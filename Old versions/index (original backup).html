   ══════════════════════════════════════════════════════════════ */
const ICONS = {
  select:`<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2l9 5.5-4 .8L6.6 13z"/></svg>`,
  rule:`<svg width="19" height="19" viewBox="0 0 19 19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="9.5" cy="3.4" r="1.9"/><path d="M8.4 5.1 4 16.2M10.6 5.1 15 16.2M6.6 11.6h5.8"/></svg>`,
  connect:`<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="4" cy="14" r="2.4"/><circle cx="14" cy="4" r="2.4"/><path d="M5.8 12.2 12.2 5.8"/></svg>`
};
function buildRail(){
  let s = `<button class="tool ${tool==="rule"?"on":""}" data-tool="rule" title="Dividers — step off a distance, then choose what's there (M)">${ICONS.rule}<span class="key">M</span></button>`;
  s += `<button class="tool ${tool==="select"?"on":""}" data-tool="select" title="Select, move, bend (V)">${ICONS.select}<span class="key">V</span></button>`;
  s += `<button class="tool ${tool==="connect"?"on":""}" data-tool="connect" title="Join two markers (C)">${ICONS.connect}<span class="key">C</span></button>`;
  s += `<div class="railrule"></div><div class="raillab">Places</div><div class="toolgrid">`;
  for(const key of KIND_KEYS){
    const kd = KINDS[key];
    s += `<button class="tool sm ${tool===key?"on":""}" data-tool="${key}" title="${kd.label} (${kd.key})">
      <svg width="20" height="20" viewBox="-12 -12 24 24">${kd.draw("currentColor")}</svg><span class="key">${kd.key}</span></button>`;
  }
  s += `</div><div class="railrule"></div><div class="raillab">Form</div><div class="toolgrid">`;
  for(const key of Object.keys(FORMS)){
    const f = FORMS[key];
    s += `<button class="tool sm ${drawForm===key?"on":""}" data-form="${key}" title="${f.label}">
      <svg width="20" height="20" viewBox="-12 -12 24 24">${f.swatch}</svg></button>`;
  }
  s += `</div><div class="railrule"></div><div class="raillab">Draw</div><div class="toolgrid">`;
  for(const key of SHAPE_KEYS){
    const kd = SHAPE_KINDS[key];
    const on = tool==="draw" && drawKind===key;
    const swatch = kd.swatch ? kd.swatch
      : kd.barrier
      ? `<path d="M-8 3 L8 3 M-5 3 L-5 8 M0 3 L0 8 M5 3 L5 8" fill="none" stroke="${kd.stroke}" stroke-width="2"/>`
      : `<rect x="-8" y="-6" width="16" height="12" rx="2" fill="${kd.fill}" fill-opacity=".55" stroke="${kd.stroke}" stroke-width="1.5"/>`;
    s += `<button class="tool sm ${on?"on":""}" data-draw="${key}" title="Draw ${kd.label}${kd.key?` (${kd.key})`:""}">
      <svg width="20" height="20" viewBox="-12 -12 24 24">${swatch}</svg>${kd.key?`<span class="key">${kd.key}</span>`:""}</button>`;
  }
  s += `</div>`;
  $("#rail").innerHTML = s;
}
/* A focused button re-fires on Enter, which would re-pick a tool and
   throw away the shape being drawn. Let it go as soon as it's served. */
document.addEventListener("click", e=>{
  const b = e.target.closest("button");
  if(b && typeof b.blur === "function") b.blur();
}, true);

$("#rail").addEventListener("click", e=>{
  const fm = e.target.closest("[data-form]");
  if(fm){ drawForm = fm.dataset.form; draft = null; formDrag = null;
          if(tool!=="draw") setTool("draw"); else { buildRail(); render(); } return; }
  const d = e.target.closest("[data-draw]");
  if(d){ drawKind = d.dataset.draw; setTool("draw"); return; }
  const b = e.target.closest("[data-tool]"); if(b) setTool(b.dataset.tool);
});
function setTool(t){
  openTools(false);
  /* an outline with real length gets kept, not thrown away, so reaching for
     another tool mid-draw never costs you the work */
  if(draft){ if(draft.pts.length>=2) finishDraft(false); else draft=null; }
  tool=t; connectFrom=null; rule=null; editing=null; closePop(); buildRail(); render();
}

/* ══════════════════════════════════════════════════════════════
   CANVAS
   ══════════════════════════════════════════════════════════════ */
let spaceDown = false;

/* ══════════════════════════════════════════════════════════════
   TOUCH — pinch to zoom, two fingers to shift the sheet, press
   and hold where a desktop would Alt-click
   ══════════════════════════════════════════════════════════════ */
const COARSE = window.matchMedia && window.matchMedia("(pointer:coarse)").matches;
const HIT = COARSE ? 22 : 9;              // grabbable radius, in screen px
/* Closing a loop is a much bigger gesture than grabbing a handle, and
   missing it silently adds a point instead — which reads as the shape
   refusing to finish. Give it a target you can actually hit. */
const SNAP_CLOSE = COARSE ? 30 : 16;
const pointers = new Map();
let pinch = null;                          // {d, k, mx, my, wx, wy}
let press = null;                          // long-press timer
let lastLaid = null;                       // {undo, t} — backed out if a 2nd finger lands

function pinchStart(){
  const [a,b] = [...pointers.values()];
  const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
  const r = svg.getBoundingClientRect();
  pinch = {
    d: Math.hypot(a.x-b.x, a.y-b.y) || 1,
    k: view.k,
    mx, my,
    wx: (mx-r.left-view.tx)/view.k,
    wy: (my-r.top -view.ty)/view.k
  };
  /* a second finger means the first one was reaching for the sheet, not
     laying a point — take back whatever it just did */
  clearPress();
  drag = null; svg.classList.remove("panning");
  if(lastLaid && Date.now()-lastLaid.t < 700){ lastLaid.undo(); render(); }
  lastLaid = null;
}
function pinchMove(){
  if(pointers.size<2) return;
  const [a,b] = [...pointers.values()];
  const d = Math.hypot(a.x-b.x, a.y-b.y) || 1;
  const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
  const r = svg.getBoundingClientRect();
  view.k = Math.max(.06, Math.min(6, pinch.k * (d/pinch.d)));
  view.tx = (mx-r.left) - pinch.wx*view.k;    // two fingers also shift the sheet
  view.ty = (my-r.top)  - pinch.wy*view.k;
  applyTransform();
}
function clearPress(){ if(press){ clearTimeout(press.timer); press=null; } }
function noteLaid(undo){ lastLaid = { undo, t:Date.now() }; }

/* zoom about the middle of the sheet, for the buttons */
function zoomBy(f){
  const r = svg.getBoundingClientRect(), mx = r.width/2, my = r.height/2;
  const bx = (mx-view.tx)/view.k, by = (my-view.ty)/view.k;
  view.k = Math.max(.06, Math.min(6, view.k*f));
  view.tx = mx-bx*view.k; view.ty = my-by*view.k;
  applyTransform(); render();
}
$("#zUndo").onclick = ()=>undo();
$("#zRedo").onclick = ()=>redo();
$("#zIn").onclick  = ()=>zoomBy(1.25);
$("#zOut").onclick = ()=>zoomBy(1/1.25);
$("#zFit").onclick = ()=>centreView();

/* Something newly set down needs its particulars to hand. On a narrow screen
   the sheet is hidden by default, so open it — otherwise the name field we'd
   focus is off-screen and all you get is a keyboard over the map. And on a
   touch screen don't focus at all: let the keyboard come up when the person
   actually taps the field, not the instant they place a marker. */
function revealInspector(focusName){
  if(pane!=="inspect"){ pane="inspect"; syncTabs(); renderPane(true); }
  if(window.innerWidth<=860) setPanel(true);
  if(focusName && !COARSE)
    setTimeout(()=>{ const f=$("#f-name"); if(f) f.focus(); },0);
}

/* ══════════════════════════════════════════════════════════════
   TAKING IT BACK — snapshot undo

   Each context keeps its own history: the survey has one, and so does
   every town plan, so backing out of a town doesn't mix its streets
   into the survey's past. A run of keystrokes collapses into a single
   step, so undoing a name doesn't walk back one letter at a time.
   ══════════════════════════════════════════════════════════════ */
const UNDO_MAX = 60, BURST_MS = 600;
const undoBy = {}, redoBy = {};
let lastSnap = null, lastSnapAt = 0;
const snapKey = ()=>planOf ? K_PLAN(planOf) : K_SURVEY;
const snapshot = ()=>({ key:snapKey(), json:JSON.stringify(doc) });
function histFor(k){ undoBy[k]=undoBy[k]||[]; redoBy[k]=redoBy[k]||[]; return [undoBy[k],redoBy[k]]; }
function resetHist(){ lastSnap = snapshot(); lastSnapAt = 0; }

function pushUndo(){
  const cur = snapshot();
  if(lastSnap && lastSnap.key===cur.key && lastSnap.json===cur.json) return;   // nothing moved
  const [u,r] = histFor(cur.key);
  const now = Date.now();
  if(!lastSnap || lastSnap.key!==cur.key){ lastSnap = cur; lastSnapAt = now; return; }
  if(now - lastSnapAt >= BURST_MS){          // a fresh action, not more of the same one
    u.push(lastSnap);
    if(u.length > UNDO_MAX) u.shift();
    r.length = 0;
    lastSnapAt = now;
  }
  lastSnap = cur;
}
function applySnap(sn){
  const d = normaliseDoc(JSON.parse(sn.json));
  if(sn.key===K_SURVEY){
    if(planOf) root = d; else setDoc(d);
  } else {
    plans[sn.key.slice(5)] = d;
    if(planOf===sn.key.slice(5)) setDoc(d);
  }
  sel = null; rule = null; draft = null; editing = null; connectFrom = null;
  lastSnap = snapshot(); lastSnapAt = 0;
  $("#ppm").value = doc.ppm;
  markDirty(sn.key); pump().catch(()=>{});
  buildRail(); applyTransform(); renderCrumb(); render(); renderPane(true);
}
function undo(){
  const [u,r] = histFor(snapKey());
  if(!u.length){ flash("Nothing to undo."); return; }
  r.push(snapshot());
  if(r.length > UNDO_MAX) r.shift();
  applySnap(u.pop());
  flash("Undone.");
}
function redo(){
  const [u,r] = histFor(snapKey());
  if(!r.length){ flash("Nothing to redo."); return; }
  u.push(snapshot());
  applySnap(r.pop());
  flash("Redone.");
}
function syncHistBtns(){
  const [u,r] = histFor(snapKey());
  const ub=$("#zUndo"), rb=$("#zRedo");
  if(ub) ub.disabled = !u.length;
  if(rb) rb.disabled = !r.length;
}

/* ── the tool drawer ─────────────────────────────────────────────
   The rail is hidden on a phone, so the whole kit comes up in a sheet.
   It reads the live KINDS/SHAPE_KINDS, which means stepping into a town
   swaps its contents to buildings and squares with no extra work. */
function toolLabel(){
  if(tool==="rule") return "Dividers";
  if(tool==="select") return "Select";
  if(tool==="connect") return planOf ? "Join" : "Join roads";
  if(tool==="draw") return SHAPE_KINDS[drawKind] ? SHAPE_KINDS[drawKind].label : "Draw";
  return KINDS[tool] ? KINDS[tool].label : "Tools";
}
function toolIcon(){
  if(ICONS[tool]) return ICONS[tool];
  if(tool==="draw"){
    const kd = SHAPE_KINDS[drawKind]||{};
    return `<svg width="20" height="20" viewBox="-12 -12 24 24">${kd.swatch
      || `<rect x="-8" y="-6" width="16" height="12" rx="2" fill="${kd.fill||"none"}" fill-opacity=".55" stroke="${kd.stroke||"currentColor"}" stroke-width="1.5"/>`}</svg>`;
  }
  const kd = KINDS[tool];
  return kd ? `<svg width="20" height="20" viewBox="-12 -12 24 24">${kd.draw("currentColor")}</svg>` : ICONS.select;
}
function syncToolsBtn(){
  const b = $("#toolsBtn"); if(!b) return;
  b.querySelector(".ic").innerHTML = toolIcon();
  b.querySelector(".lb").textContent = toolLabel();
}
function buildToolSheet(){
  const item = (on,attr,icon,name)=>
    `<button class="tsitem${on?" on":""}" ${attr}><span>${icon}</span><span class="nm">${esc(name)}</span></button>`;
  let h = `<span class="grip"></span>`;
  h += `<p class="eyebrow">Working</p><div class="tsgrid">`
    + item(tool==="rule","data-tool=\"rule\"",ICONS.rule,"Dividers")
    + item(tool==="select","data-tool=\"select\"",ICONS.select,"Select & bend")
    + item(tool==="connect","data-tool=\"connect\"",ICONS.connect,planOf?"Join streets":"Join roads")
    + `</div>`;
  h += `<p class="eyebrow spaced">${planOf?"What stands here":"Places"}</p><div class="tsgrid">`;
  for(const k of KIND_KEYS)
    h += item(tool===k,`data-tool="${k}"`,`<svg width="22" height="22" viewBox="-12 -12 24 24">${KINDS[k].draw("currentColor")}</svg>`,KINDS[k].label);
  h += `</div><p class="eyebrow spaced">Draw</p><div class="tsgrid">`;
  for(const k of SHAPE_KEYS){
    const kd = SHAPE_KINDS[k];
    const sw = kd.swatch || (kd.barrier
      ? `<path d="M-8 3 L8 3 M-5 3 L-5 8 M0 3 L0 8 M5 3 L5 8" fill="none" stroke="${kd.stroke}" stroke-width="2"/>`
      : `<rect x="-8" y="-6" width="16" height="12" rx="2" fill="${kd.fill}" fill-opacity=".55" stroke="${kd.stroke}" stroke-width="1.5"/>`);
    h += item(tool==="draw"&&drawKind===k,`data-draw="${k}"`,`<svg width="22" height="22" viewBox="-12 -12 24 24">${sw}</svg>`,kd.label);
  }
  h += `</div>`;
  $("#toolsheet").innerHTML = h;
}
function openTools(open){
  const sh = $("#toolsheet"), sc = $("#tsscrim");
  if(open) buildToolSheet();
  sh.hidden = !open; sc.hidden = !open;
}
$("#toolsBtn").onclick = ()=>openTools($("#toolsheet").hidden);
$("#tsscrim").onclick = ()=>openTools(false);
$("#toolsheet").addEventListener("click", e=>{
  const d = e.target.closest("[data-draw]");
  if(d){ drawKind = d.dataset.draw; setTool("draw"); openTools(false); return; }
  const b = e.target.closest("[data-tool]");
  if(b){ setTool(b.dataset.tool); openTools(false); }
});

/* the sheet panel slides away on a narrow screen */
const panelToggle = $("#panelToggle");
function setPanel(open){
  $("#panel").classList.toggle("open", open);
  panelToggle.setAttribute("aria-expanded", open?"true":"false");
  panelToggle.textContent = open ? "Hide" : "Sheet";
}
panelToggle.onclick = ()=>setPanel(!$("#panel").classList.contains("open"));

/* Enter, Backspace and Escape have no home on a phone — and on a desktop
   nobody should have to guess that they exist. While a shape is being
   drawn there is always a visible way to finish it. */
function renderTouchbar(){
  const tb = $("#touchbar");
  let s = "";
  if(formDrag){
    s = `<button class="go" data-tb="place">Place it</button><button data-tb="cancel">Cancel</button>`;
  } else if(draft){
    s = `<button class="go" data-tb="done">Finish</button>`
      + (draft.pts.length>2 && !SHAPE_KINDS[draft.kind].alwaysOpen ? `<button data-tb="close">Close loop</button>` : "")
      + `<button data-tb="back">Undo point</button><button data-tb="cancel">Cancel</button>`;
  } else if(editing){
    s = `<button class="go" data-tb="stop">Done</button><button data-tb="back">Undo point</button>`;
  } else if(sel){
    if(sel.kind==="road"||sel.kind==="shape") s = `<button data-tb="bend">Add a bend</button>`;
    s += `<button class="kill" data-tb="del">${sel.kind==="node"?"Delete marker":sel.kind==="road"?"Delete road":"Delete feature"}</button>`;
  }
  tb.innerHTML = s;
  /* a draft or a run being extended always shows its controls; the
     selection shortcuts stay a touch affordance, since a keyboard has
     Delete */
  tb.classList.toggle("on", !!s && (COARSE || !!draft || !!editing || !!formDrag));
}
$("#touchbar").addEventListener("click", e=>{
  const b = e.target.closest("[data-tb]"); if(!b) return;
  const a = b.dataset.tb;
  if(a==="place"){
    const f = formDrag; formDrag = null;
    if(f && !commitForm(f.a, f.b, f.square)) render();
    renderTouchbar();
  }
  else if(a==="done")   finishDraft(false);
  else if(a==="close")  finishDraft(true);
  else if(a==="cancel"){ draft=null; formDrag=null; render(); renderTouchbar(); }
  else if(a==="stop"){   editing=null; render(); renderPane(true); }
  else if(a==="back"){
    if(draft){ draft.pts.pop(); if(!draft.pts.length) draft=null; render(); }
    else if(editing){
      const sh = shapeById(editing.id);
      if(sh && sh.pts.length>2){ if(editing.end==="head") sh.pts.shift(); else sh.pts.pop(); touch(); }
    }
  }
  else if(a==="del"){ confirmDelete(); }
  else if(a==="bend"){
    /* drop one at the midpoint — no precision tapping required */
    const isRoad = sel.kind==="road";
    const obj = isRoad ? roadById(sel.id) : shapeById(sel.id);
    if(obj){
      const all = isRoad ? roadPts(obj) : obj.pts;
      const mid = polyAt(sampleCurve(all, !isRoad&&obj.closed, 10), .5);
      insertBendAt(sel.kind, sel.id, mid);
      touch(); renderPane(true);
    }
  }
});

svg.addEventListener("pointerdown", e=>{
  if(placing) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(pointers.size===2){ pinchStart(); return; }
  if(pointers.size>2) return;
  svg.setPointerCapture(e.pointerId);
  const w = toWorld(e.clientX,e.clientY); pointer = w;
  const nEl = e.target.closest("[data-node]"), rEl = e.target.closest("[data-road]"), shEl = e.target.closest("[data-shape]");
  const hPt = e.target.closest("[data-rp],[data-sp]"), hGap = e.target.closest("[data-rg],[data-sg]");
  const hCap = e.target.closest("[data-cap]");

  /* an end of a finished run — take it up again from here */
  if(hCap && e.button===0 && !spaceDown){
    const [id,end] = hCap.dataset.cap.split("|");
    editing = (editing && editing.id===id && editing.end===end) ? null : { id, end };
    if(editing && tool==="draw"){ tool="select"; buildRail(); }
    render(); return;
  }

  /* vertex handles — these come first, so a bend you already laid is never
     mistaken for the start of something new */
  if(hPt && e.button===0){
    const [id,i] = (hPt.dataset.rp||hPt.dataset.sp).split("|");
    const isRoad = !!hPt.dataset.rp;
    if(e.altKey){ removeVertex(isRoad,id,+i); return; }
    /* no Alt key on a phone — press and hold on the bend instead. Touch only:
       a slow click with a mouse must never quietly remove a point. */
    clearPress();
    if(COARSE) press = { sx:e.clientX, sy:e.clientY, timer:setTimeout(()=>{
      press = null; drag = null;
      removeVertex(isRoad,id,+i);
      flash("Bend taken out.");
    }, 550) };
    drag = { mode:isRoad?"rp":"sp", id, i:+i }; return;
  }
  if(hGap && e.button===0){
    const [id,i] = (hGap.dataset.rg||hGap.dataset.sg).split("|");
    const isRoad = !!hGap.dataset.rg;
    const arr = isRoad ? (roadById(id).pts = roadById(id).pts||[]) : shapeById(id).pts;
    arr.splice(+i, 0, {x:Math.round(w.x),y:Math.round(w.y)});
    if(isRoad){ const r=roadById(id); if(r && !r.milesLocked) r.miles = roadDrawnMiles(r); }
    drag = { mode:isRoad?"rp":"sp", id, i:+i, moved:true };
    render(); return;
  }

  /* carrying an existing run further along */
  if(editing && e.button===0 && !spaceDown){
    const sh = shapeById(editing.id);
    if(sh){
      const p = { x:Math.round(w.x), y:Math.round(w.y) };
      const head = editing.end==="head";
      if(head) sh.pts.unshift(p); else sh.pts.push(p);
      noteLaid(()=>{ if(head) sh.pts.shift(); else sh.pts.pop(); });
      touch(); return;
    }
    editing = null;
  }

  /* a regular form, click-click: the second press sets the far corner */
  if(formDrag && formDrag.armed && e.button===0 && !spaceDown){
    formDrag.b = {x:w.x, y:w.y}; formDrag.square = e.shiftKey;
    formDrag.sx = e.clientX; formDrag.sy = e.clientY;
    render(); return;
  }

  /* a regular form: drag out the size and let go */
  if(tool==="draw" && drawForm !== "free" && e.button===0 && !spaceDown && !draft){
    formDrag = { a:{x:w.x,y:w.y}, b:{x:w.x,y:w.y}, square:e.shiftKey,
                 sx:e.clientX, sy:e.clientY, armed:false };
    render(); return;
  }

  /* drawing an outline */
  if(tool==="draw" && e.button===0 && !spaceDown){
    if(!draft){
      draft = { kind:drawKind, pts:[{x:Math.round(w.x),y:Math.round(w.y)}] };
      noteLaid(()=>{ draft=null; });
    } else {
      const f = draft.pts[0];
      if(!SHAPE_KINDS[draft.kind].alwaysOpen && draft.pts.length>2 && Math.hypot(w.x-f.x,w.y-f.y) < SNAP_CLOSE/view.k) finishDraft(true);
      else { draft.pts.push({x:Math.round(w.x),y:Math.round(w.y)}); noteLaid(()=>{ draft && draft.pts.pop(); }); }
    }
    render(); return;
  }

  if(spaceDown || e.button===1 || (tool==="select" && e.button===0 && !nEl && !rEl && !shEl)){
    drag = { mode:"pan", sx:e.clientX, sy:e.clientY, tx:view.tx, ty:view.ty };
    svg.classList.add("panning"); return;
  }
  if(e.button!==0) return;

  if(tool==="rule"){
    if(rule){
      /* no hovering with a finger: drag to swing the rule, lift to fix it */
      if(COARSE){ drag = { mode:"aim" }; return; }
      fixDistance();
    }
    else if(nEl){ rule = { fromId:nEl.dataset.node, miles:1, ang:0, snapTo:null }; render(); }
    return;
  }
  if(tool==="connect"){
    if(nEl){
      const id = nEl.dataset.node;
      if(!connectFrom) connectFrom = id;
      else if(connectFrom!==id){ layRoad(connectFrom,id); connectFrom=null; }
      render();
    }
    return;
  }
  if(tool==="select"){
    if(nEl){
      const n = nodeById(nEl.dataset.node);
      select("node",n.id);
      drag = { mode:"node", id:n.id, ox:n.x-w.x, oy:n.y-w.y, moved:false };
    }
    else if(rEl) select("road", rEl.dataset.road);
    else if(shEl) select("shape", shEl.dataset.shape);
    return;
  }

  /* a marker tool. On a touch screen the same finger has to serve for both
     shifting the sheet and setting a stone, so hold the action back until
     the finger lifts and we know which one it was. */
  if(COARSE){
    drag = { mode:"pan", sx:e.clientX, sy:e.clientY, tx:view.tx, ty:view.ty,
             tap:()=>placeNode(tool, w.x, w.y) };
    svg.classList.add("panning"); return;
  }
  placeNode(tool, w.x, w.y);
});

svg.addEventListener("pointermove", e=>{
  if(placing) return;
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(pinch && pointers.size>=2){ pinchMove(); return; }
  pointer = toWorld(e.clientX,e.clientY);
  /* a finger that wanders isn't holding still, so it isn't a long press */
  if(press && Math.hypot(e.clientX-press.sx, e.clientY-press.sy) > 8) clearPress();
  if(drag){
    if(drag.mode==="aim"){ aimRule(e.shiftKey, e.altKey); render(); return; }
    if(drag.mode==="pan"){
      if(drag.tap && Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) > 6) drag.tap = null;
      view.tx = drag.tx+(e.clientX-drag.sx); view.ty = drag.ty+(e.clientY-drag.sy);
      applyTransform(); return;
    }
    if(drag.mode==="node"){
      const n = nodeById(drag.id); if(!n) return;
      n.x = Math.round(pointer.x+drag.ox); n.y = Math.round(pointer.y+drag.oy);
      drag.moved = true; recomputeUnlocked(n.id); render(); return;
    }
    if(drag.mode==="rp"){
      const r = roadById(drag.id); if(!r||!r.pts) return;
      r.pts[drag.i] = { x:Math.round(pointer.x), y:Math.round(pointer.y) };
      drag.moved = true;
      if(!r.milesLocked) r.miles = roadDrawnMiles(r);
      render(); return;
    }
    if(drag.mode==="fp"){
      const n = nodeById(drag.id); if(!n) return;
      const ppm = doc.ppm||8;
      const a = -(n.rot||0)*Math.PI/180, ca=Math.cos(a), sa=Math.sin(a);
      const dx = pointer.x-n.x, dy = pointer.y-n.y;
      /* into the building's own frame, so a turned building still sizes
         along its own walls */
      const lx = dx*ca - dy*sa, ly = dx*sa + dy*ca;
      const step = e.shiftKey ? 1 : 0.5;               // whole units with Shift
      const q = v => Math.max(1, Math.round(v/step)*step);
      n.w = q(Math.abs(lx)*2/ppm);
      n.d = q(Math.abs(ly)*2/ppm);
      drag.moved = true; render(); return;
    }
    if(drag.mode==="frot"){
      const n = nodeById(drag.id); if(!n) return;
      const a = Math.atan2(pointer.y-n.y, pointer.x-n.x);
      let deg = drag.rot0 + (a - drag.ang0)*180/Math.PI;
      if(e.shiftKey) deg = Math.round(deg/15)*15;      // to the nearest 15°
      n.rot = Math.round(((deg%360)+360)%360);
      drag.moved = true; render(); return;
    }
    if(drag.mode==="sp"){
      const sh = shapeById(drag.id); if(!sh) return;
      sh.pts[drag.i] = { x:Math.round(pointer.x), y:Math.round(pointer.y) };
      drag.moved = true; render(); return;
    }
  }
  if(formDrag){
    /* follow while the button is held, or while armed and waiting for a
       second click — never while nothing is happening */
    if(e.buttons === 0 && !formDrag.armed){ formDrag = null; render(); renderTouchbar(); return; }
    formDrag.b = {x:pointer.x, y:pointer.y}; formDrag.square = e.shiftKey;
    render(); return;
  }
  if(tool==="draw" && draft){ render(); return; }
  if(editing){ render(); return; }
  if(tool==="rule" && rule){ aimRule(e.shiftKey, e.altKey); render(); }
  else if(tool==="connect" && connectFrom) render();
});

function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch = null;
  clearPress();

  /* A form being dragged out. Two ways to place one, because a mouse
     drag and a phone tap want different things: drag far enough and
     lifting commits it; barely move and it stays live, so the next click
     sets the far corner. Either way it MUST be released here — left
     alive it tracks the pointer with no button down, and the shape
     resizes forever with no way to finish it. */
  if(formDrag){
    const moved = Math.hypot(e.clientX - (formDrag.sx ?? e.clientX),
                             e.clientY - (formDrag.sy ?? e.clientY));
    if(moved >= 6){
      const f = formDrag; formDrag = null;
      if(!commitForm(f.a, f.b, f.square)) render();
      renderTouchbar();
      return;
    }
    if(formDrag.armed){                 // second click: that's the far corner
      const f = formDrag; formDrag = null;
      if(!commitForm(f.a, f.b, f.square)) render();
      renderTouchbar();
      return;
    }
    formDrag.armed = true;              // stay live, waiting for the next click
    render(); renderTouchbar();
    return;
  }

  if(drag){
    if(drag.mode==="aim"){ fixDistance(); drag=null; svg.classList.remove("panning"); return; }
    if(drag.mode==="node" && drag.moved){ recomputeUnlocked(drag.id); touch(); }
    if((drag.mode==="rp"||drag.mode==="sp") && drag.moved){ touch(); renderPane(true); }
    if((drag.mode==="fp"||drag.mode==="frot") && drag.moved){ touch(); renderPane(true); }
    if(drag.mode==="pan"){
      const still = Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) < 6;
      if(still && drag.tap){ const t = drag.tap; drag=null; svg.classList.remove("panning"); t(); return; }
      if(still && sel && !drag.tap){ sel=null; render(); renderPane(true); }
    }
  }
  drag = null; svg.classList.remove("panning");
}
svg.addEventListener("pointerup", endPointer);
svg.addEventListener("pointercancel", endPointer);
svg.addEventListener("dblclick", e=>{
  if(draft){ finishDraft(false); return; }
  /* a double click while carrying a run on means "that's the end of it" —
     drop the point the second click laid down */
  if(editing){
    const sh = shapeById(editing.id);
    if(sh && sh.pts.length>2){ if(editing.end==="head") sh.pts.shift(); else sh.pts.pop(); }
    editing = null; touch(); return;
  }
  const w = toWorld(e.clientX,e.clientY);
  const rEl = e.target.closest("[data-road]"), shEl = e.target.closest("[data-shape]");
  if(rEl){
    select("road", rEl.dataset.road);
    if(insertBendAt("road", rEl.dataset.road, w)){ touch(); renderPane(true); }
    return;
  }
  if(shEl){
    select("shape", shEl.dataset.shape);
    if(insertBendAt("shape", shEl.dataset.shape, w)){ touch(); renderPane(true); }
  }
});

svg.addEventListener("wheel", e=>{
  e.preventDefault();
  const b = svg.getBoundingClientRect(), mx=e.clientX-b.left, my=e.clientY-b.top;
  const before = { x:(mx-view.tx)/view.k, y:(my-view.ty)/view.k };
  view.k = Math.max(.06, Math.min(6, view.k*(e.deltaY<0?1.12:1/1.12)));
  view.tx = mx-before.x*view.k; view.ty = my-before.y*view.k;
  applyTransform(); render();
}, { passive:false });

document.addEventListener("keydown", e=>{
  const t = e.target.tagName;
  if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT"){
    if(e.key==="Escape"){ e.target.blur(); if(placing) closePop(); }
    return;
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){
    e.shiftKey ? redo() : undo(); e.preventDefault(); return;
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="y"){ redo(); e.preventDefault(); return; }
  if(e.code==="Space"){ spaceDown=true; e.preventDefault(); return; }
  const k = e.key.toLowerCase();
  if(placing){ if(k==="escape") closePop(); return; }
  if(formDrag){
    if(e.key==="Enter"){
      const f = formDrag; formDrag = null;
      if(!commitForm(f.a, f.b, f.square)) render();
      renderTouchbar(); e.preventDefault(); return;
    }
    if(k==="escape"){ formDrag=null; render(); renderTouchbar(); return; }
  }
  if(draft){
    if(e.key==="Enter"){ finishDraft(false); e.preventDefault(); return; }
    if(e.key==="Backspace"){ draft.pts.pop(); if(!draft.pts.length) draft=null; render(); e.preventDefault(); return; }
    if(k==="escape"){ draft=null; render(); return; }
  }
  if(editing){
    if(e.key==="Enter"||k==="escape"){ editing=null; render(); renderPane(true); e.preventDefault(); return; }
    if(e.key==="Backspace"){
      const sh = shapeById(editing.id);
      if(sh && sh.pts.length>2){ if(editing.end==="head") sh.pts.shift(); else sh.pts.pop(); touch(); }
      e.preventDefault(); return;
    }
  }
  if(k==="m") setTool("rule");
  else if(k==="v") setTool("select");
  else if(k==="c") setTool("connect");
  else if(SHAPE_KEYS.some(key=>SHAPE_KINDS[key].key && SHAPE_KINDS[key].key.toLowerCase()===k)){
    drawKind = SHAPE_KEYS.find(key=>SHAPE_KINDS[key].key && SHAPE_KINDS[key].key.toLowerCase()===k);
    setTool("draw");
  }
  else if(k==="escape"){
    if(!$("#toolsheet").hidden){ openTools(false); return; }
    if(!connectFrom && !rule && !editing && !sel && planOf){ leavePlan(); return; }
    connectFrom=null; rule=null; editing=null; sel=null; render(); renderPane(true);
  }
  else if(k==="delete"||k==="backspace"){ if(sel){ confirmDelete(); e.preventDefault(); } }
  else if(k==="f") centreView();
  else if(rule && (e.key==="ArrowUp"||e.key==="ArrowDown")){
    rule.miles = Math.max(.1, r1(rule.miles + (e.key==="ArrowUp"?1:-1)));
    rule.snapTo = findSnap(ruleEnd()); render(); e.preventDefault();
  }
  else { const kd = KIND_KEYS.find(key=>KINDS[key].key===e.key); if(kd) setTool(kd); }
});
document.addEventListener("keyup", e=>{ if(e.code==="Space") spaceDown=false; });


/* ══════════════════════════════════════════════════════════════
   THE SHELF — more than one map

   There was one slot. Drawing a second map meant destroying the first,
   and "Start a new survey" was a one-way door. Now every survey can be
   put on a shelf and taken down again, plans and all.

   The important behaviour isn't the shelf itself, it's that NOTHING IS
   EVER DISCARDED SILENTLY. Anything that would replace the current
   survey shelves it first, under its own name and the date. If you take
   down the wrong map, or start fresh by mistake, the old one is still
   there.
   ══════════════════════════════════════════════════════════════ */
const K_MAP = id => "map:" + id;
let shelf = [];                 // metadata only, read at boot and after changes

function surveyStats(d, pl){
  const roads = d.roads || [];
  return {
    places: (d.nodes||[]).length,
    roads: roads.length,
    miles: Math.round(roads.reduce((s,r)=>s+(r.miles||0),0)*10)/10,
    plans: Object.keys(pl||{}).length,
    unit: d.unit || "mi"
  };
}

async function refreshShelf(){
  shelf = [];
  if(!USE_IDB) return shelf;
  try{
    for(const k of await idbKeys()){
      if(typeof k !== "string" || !k.startsWith("map:")) continue;
      const rec = await idbGet(k);
      if(!rec || !rec.doc) continue;
      shelf.push({ id: k.slice(4), name: rec.name || rec.doc.title || "Untitled",
                   saved: rec.saved || "", ...surveyStats(rec.doc, rec.plans) });
    }
    shelf.sort((a,b)=> (b.saved||"").localeCompare(a.saved||""));
  }catch(err){ /* leave the shelf empty rather than break the pane */ }
  return shelf;
}

/* Put the current survey on the shelf. Overwrites its own entry if it
   came from one, so saving twice doesn't breed copies. */
async function shelveCurrent(name, forceNew){
  if(!USE_IDB) return null;
  if(!root || !(root.nodes||[]).length) return null;
  const outer = root;
  const id = (!forceNew && outer.libId) || uid("m");
  outer.libId = id;
  const rec = { name: (name || outer.title || "Untitled").trim(),
                saved: new Date().toISOString(),
                doc: JSON.parse(JSON.stringify(outer)),
                plans: JSON.parse(JSON.stringify(plans)) };
  delete rec.doc.plans;
  try{ await idbSet(K_MAP(id), rec); }catch(err){ return null; }
  await refreshShelf();
  return id;
}

/* Called before anything destructive. Silent, and always safe to call. */
async function shelveBeforeReplacing(){
  const outer = root;
  if(!USE_IDB || !outer || !(outer.nodes||[]).length) return false;
  const stamp = new Date().toISOString().slice(0,16).replace("T"," ");
  const name = outer.libId ? (outer.title || "Untitled")
                           : `${outer.title || "Untitled"} — ${stamp}`;
  return !!(await shelveCurrent(name));
}

async function loadFromShelf(id){
  if(!USE_IDB) return false;
  let rec;
  try{ rec = await idbGet(K_MAP(id)); }catch(err){ return false; }
  if(!rec || !rec.doc || !Array.isArray(rec.doc.nodes)) return false;

  await shelveBeforeReplacing();
  leavePlanAll();
  for(const k of Object.keys(plans)) delete plans[k];
  Object.assign(plans, JSON.parse(JSON.stringify(rec.plans || {})));
  setRoot(JSON.parse(JSON.stringify(rec.doc)));
  root.libId = id;
  sel = null; rule = null; draft = null; formDrag = null;
  markDirty(K_SURVEY);
  for(const k of Object.keys(plans)) markDirty(K_PLAN(k));
  await pump().catch(()=>{});
  centreView();
  return true;
}

async function forgetFromShelf(id){
  if(!USE_IDB) return;
  try{ await idbDel(K_MAP(id)); }catch(err){}
  if(doc && doc.libId === id) delete doc.libId;
  await refreshShelf();
}

async function renameOnShelf(id, name){
  if(!USE_IDB) return;
  try{
    const rec = await idbGet(K_MAP(id));
    if(!rec) return;
    rec.name = (name||"Untitled").trim();
    await idbSet(K_MAP(id), rec);
  }catch(err){}
  await refreshShelf();
}

/* Climb out of every plan, so a load never lands inside a town that no
   longer exists. */
function leavePlanAll(){ leavePlan(); }

/* ── the escape hatch ─────────────────────────────────────────
   Kept as a button because it costs nothing and reassures, but it can
   no longer be NEEDED: planOf is derived from doc inside setDoc(), so
   there is no state in which they disagree. This just walks out of a
   plan the ordinary way. */
function viewIsConsistent(){
  return planOf ? plans[planOf] === doc : doc === root;
}
function surfaceToSurvey(){
  if(planOf) leavePlan(); else setDoc(root);
  sel = null; rule = null; draft = null; editing = null; connectFrom = null; formDrag = null;
  tool = "select";
  resetHist(); buildRail(); renderCrumb();
}


function surfaceToSurvey(){
  const outer = root;
  planOf = null;

  KINDS = SURVEY_KINDS; KIND_KEYS = Object.keys(KINDS);
  SHAPE_KINDS = SURVEY_SHAPES; SHAPE_KEYS = Object.keys(SHAPE_KINDS);
  sel = null; rule = null; draft = null; editing = null; connectFrom = null; formDrag = null;
  tool = "select";
  try{ $("#ppm").value = doc.ppm; }catch(err){}
  resetHist(); buildRail(); renderCrumb();
}

/* ══════════════════════════════════════════════════════════════
   THE DIVIDERS
   ══════════════════════════════════════════════════════════════ */
function aimRule(shift, alt){
  const a = nodeById(rule.fromId); if(!a){ rule=null; return; }
  let ang = Math.atan2(pointer.y-a.y, pointer.x-a.x);
  if(shift){ const st = Math.PI/12; ang = Math.round(ang/st)*st; }
  rule.ang = ang;
  const raw = Math.hypot(pointer.x-a.x, pointer.y-a.y)/doc.ppm;
  rule.miles = alt ? Math.max(.1, r1(raw)) : Math.max(1, Math.round(raw));
  rule.snapTo = findSnap(ruleEnd());
}
function findSnap(pt){
  const rad = 18/view.k;
  let best=null, bd=rad;
  for(const n of doc.nodes){
    if(n.id===rule.fromId) continue;
    const d = Math.hypot(n.x-pt.x, n.y-pt.y);
    if(d<bd){ bd=d; best=n.id; }
  }
  return best;
}
function fixDistance(){
  if(rule.snapTo){ layRoad(rule.fromId, rule.snapTo, rule.miles); rule=null; render(); return; }
  openPop();
}

function openPop(){
  placing = true;
  const from = nodeById(rule.fromId);
  const near = doc.nodes.reduce((a,b)=>a&&Math.hypot(a.x-from.x,a.y-from.y)<Math.hypot(b.x-from.x,b.y-from.y)?a:b, from);
  pop.innerHTML = `
    <div class="ph">${esc(from.name||KINDS[from.kind].label)} → new marker</div>
    <div class="drow"><input id="p-miles" type="number" step="0.1" min="0.1" value="${rule.miles}"><span>miles</span></div>
    <input id="p-name" class="nameIn" type="text" placeholder="Name it (optional)">
    <div class="kinds">
      ${KIND_KEYS.map(k=>`<button class="kb" data-kind="${k}">
        <svg width="15" height="15" viewBox="-12 -12 24 24">${KINDS[k].draw("currentColor")}</svg>${KINDS[k].label}</button>`).join("")}
    </div>
    <button class="pcancel" id="p-cancel">Cancel &nbsp;<span class="mono">Esc</span></button>`;
  pop.hidden = false;
  positionPop();

  $("#p-miles").oninput = e=>{
    rule.miles = Math.max(.1, +e.target.value||.1);
    rule.snapTo = null; render(); positionPop();
  };
  $("#p-cancel").onclick = closePop;
  pop.querySelectorAll("[data-kind]").forEach(b=>{
    b.onclick = ()=>commitPlacement(b.dataset.kind, $("#p-name").value.trim());
  });
  setTimeout(()=>{ const f=$("#p-name"); if(f) f.focus(); },0);
}
function positionPop(){
  const end = ruleEnd(), sc = toScreen(end.x,end.y);
  const fr = $("#field").getBoundingClientRect();
  let left = sc.x+18, top = sc.y-40;
  left = Math.max(8, Math.min(fr.width-pop.offsetWidth-8, left));
  top  = Math.max(8, Math.min(fr.height-pop.offsetHeight-8, top));
  pop.style.left = left+"px"; pop.style.top = top+"px";
}
function closePop(){ placing=false; pop.hidden=true; rule=null; render(); }

function commitPlacement(kind, name){
  const end = ruleEnd(), from = nodeById(rule.fromId), miles = rule.miles;
  const n = newNode(kind, end.x, end.y, from);
  n.name = name;
  doc.nodes.push(n);
  layRoad(from.id, n.id, miles);
  placing = false; pop.hidden = true;
  rule = { fromId:n.id, miles:Math.max(1,Math.round(miles)), ang:0, snapTo:null };  // chain onward
  select("node", n.id);
  touch();
}

/* ══════════════════════════════════════════════════════════════
   MUTATIONS
   ══════════════════════════════════════════════════════════════ */
function newNode(kind,x,y,near){
  return { id:uid("n"), name:"", kind, stone:null, stoneLocked:false,
           region: near?near.region:doc.regions[0].id, level: near?near.level:1,
           origin:false, seat:false, services:{...KINDS[kind].services}, notes:"",
           x:Math.round(x), y:Math.round(y) };
}
function placeNode(kind,x,y){
  const near = doc.nodes.length ? doc.nodes.reduce((a,b)=>Math.hypot(b.x-x,b.y-y)<Math.hypot(a.x-x,a.y-y)?b:a) : null;
  const n = newNode(kind,x,y,near);
  if(!doc.nodes.length && !planOf){ n.origin=true; n.stone="0"; }
  doc.nodes.push(n); select("node",n.id);
  if(planOf) syncServices(planOf);
  touch();
  revealInspector(true);
}
function layRoad(from,to,miles){
  if(doc.roads.some(r=>(r.from===from&&r.to===to)||(r.from===to&&r.to===from))){ flash("Already joined."); return; }
  const a = nodeById(from), b = nodeById(to);
  const r = { id:uid("e"), from, to,
    miles: miles!=null ? r1(miles) : autoMiles(a,b),
    milesLocked: miles!=null, name:"", density:"normal", coach:true,
    region: b.region||a.region, notes:"" };
  doc.roads.push(r); touch();
  return r;
}
function recomputeUnlocked(id){
  for(const r of doc.roads){
    if(r.milesLocked || (r.from!==id && r.to!==id)) continue;
    if(nodeById(r.from)&&nodeById(r.to)) r.miles = roadDrawnMiles(r);
  }
}
function recomputeAll(){
  let n=0;
  for(const r of doc.roads){
    if(r.milesLocked) continue;
    if(nodeById(r.from)&&nodeById(r.to)){ r.miles = roadDrawnMiles(r); n++; }
  }
  flash(`Re-measured ${n} road${n===1?"":"s"}.`); touch();
}
function replotFromMiles(){
  /* push markers to sit at the mileage their roads claim, walking out from the capital */
  const origin = doc.nodes.find(n=>n.origin);
  if(!origin){ flash("Mark a capital first."); return; }
  const adj = {};
  for(const n of doc.nodes) adj[n.id]=[];
  for(const r of doc.roads){ if(nodeById(r.from)&&nodeById(r.to)){ adj[r.from].push(r); adj[r.to].push(r); } }
  const done = new Set([origin.id]); let q=[origin.id], moved=0;
  while(q.length){
    const id = q.shift(), a = nodeById(id);
    for(const r of adj[id]){
      const oid = r.from===id?r.to:r.from;
      if(done.has(oid)) continue;
      const b = nodeById(oid);
      /* scale the road's whole run about the near end, so the curve — bends and all —
         comes out to exactly the mileage it claims */
      const want = r.miles*doc.ppm, have = polyLength(samplePath(roadPts(r),false,10,r.straight));
      const f = have>0.001 ? want/have : 1;
      if(r.pts && r.pts.length) for(const p of r.pts){
        p.x = Math.round(a.x+(p.x-a.x)*f); p.y = Math.round(a.y+(p.y-a.y)*f);
      }
      b.x = Math.round(a.x+(b.x-a.x)*f); b.y = Math.round(a.y+(b.y-a.y)*f);
      done.add(oid); q.push(oid); moved++;
    }
  }
  flash(`Re-plotted ${moved} marker${moved===1?"":"s"} to their mileage.`); touch();
}
function finishDraft(closed){
  if(!draft || draft.pts.length<2){ draft=null; render(); return; }
  const kd = SHAPE_KINDS[draft.kind];
  const sh = { id:uid("s"), kind:draft.kind, closed: kd.alwaysOpen ? false : !!closed, name:"",
               side:1, impassable: !!kd.barrier, notes:"", straight:drawStraight, pts:draft.pts };
  if(kd.river){ sh.w0 = 1.6; sh.w1 = 5.5; }
  doc.shapes = doc.shapes||[];
  doc.shapes.push(sh);
  draft = null;
  select("shape", sh.id);
  touch();
  revealInspector(false);
}
function removeVertex(isRoad, id, i){
  if(isRoad){
    const r = roadById(id); if(!r||!r.pts) return;
    r.pts.splice(i,1);
    if(!r.milesLocked) r.miles = roadDrawnMiles(r);
  } else {
    const sh = shapeById(id); if(!sh || sh.pts.length<=2) return;
    sh.pts.splice(i,1);
  }
  touch(); renderPane(true);
}
/* A marker doesn't go alone: it takes its roads, and a place you've drawn
   takes its whole plan. Say so before it happens — but only when there's
   actually something to lose, so clearing a stray marker stays one tap. */
function deletionCost(){
  if(!sel || sel.kind!=="node") return null;
  const n = nodeById(sel.id); if(!n) return null;
  const roads = doc.roads.filter(r=>r.from===sel.id||r.to===sel.id).length;
  const plan = !planOf ? plans[sel.id] : null;
  const bits = [];
  if(roads) bits.push(`${roads} road${roads===1?"":"s"}`);
  if(plan) bits.push(`the plan of this place (${plan.nodes.length} building${plan.nodes.length===1?"":"s"}, ${plan.roads.length} street${plan.roads.length===1?"":"s"})`);
  return bits.length ? bits.join(" and ") : null;
}
function confirmDelete(){
  const cost = deletionCost();
  if(cost){
    const n = nodeById(sel.id);
    if(!confirm(`Removing ${n && n.name ? n.name : "this marker"} also removes ${cost}. Go ahead?`)) return;
  }
  deleteSelected();
}
function deleteSelected(){
  if(!sel) return;
  if(sel.kind==="node"){
    doc.roads = doc.roads.filter(r=>r.from!==sel.id&&r.to!==sel.id);
    doc.nodes = doc.nodes.filter(n=>n.id!==sel.id);
    if(planOf) syncServices(planOf);
    else { delete plans[sel.id]; markDirty(K_PLAN(sel.id)); }   // marker gone, plan goes with it
  } else if(sel.kind==="shape"){
    doc.shapes = (doc.shapes||[]).filter(s=>s.id!==sel.id);
  } else doc.roads = doc.roads.filter(r=>r.id!==sel.id);
  sel=null; editing=null; touch(); renderPane(true);
}
function select(kind,id){
  if(editing && editing.id!==id) editing=null;
  sel={kind,id}; pane="inspect"; syncTabs(); render(); renderPane(true);
}

/* ── what's in here worth going in for ────────────────────────
   Foes and loot are what let the engine answer two questions it
   otherwise can't: what this map is worth in experience, and whether a
   place will kill whoever walks into it. The verdict updates as you

/* ══════════════════════════════════════════════════════════════
   FOOTPRINTS — buildings at the size they actually are

   A marker on the survey is a symbol: a town is a square whatever its
   size, because at fourteen miles to the inch a town IS a dot. Inside a
   town plan that stops being true. At six yards to the pixel a smithy
   drawn as a constant-size glyph comes out about a yard and a half
   across, standing beside a street twenty yards wide.

   So plan markers carry a footprint in the plan's own units, drawn to
   scale, and can be sized and turned. The defaults below are roughly
   what these buildings were: a house is ten by eight, a great hall is
   twenty-four by sixteen, a well is three by three.
   ══════════════════════════════════════════════════════════════ */
const FOOTPRINT = {
  hall:{w:24,d:16}, house:{w:10,d:8},  inn:{w:16,d:12},  smith:{w:12,d:9},
  provision:{w:13,d:10},
  temple:{w:20,d:13}, market:{w:18,d:18}, store:{w:11,d:9}, stable:{w:18,d:10},
  gate:{w:8,d:5},   tower:{w:8,d:8},   well:{w:3,d:3},   statue:{w:4,d:4},
  apothecary:{w:10,d:8}, healer:{w:12,d:9}, archive:{w:18,d:12}, reeve:{w:14,d:11},
  office:{w:14,d:10}, trainer:{w:14,d:12}, fence:{w:9,d:7}, ruinlet:{w:12,d:10}
};
const DEFAULT_FP = { w:12, d:9 };

function footprintOf(n){
  const base = FOOTPRINT[n.kind] || DEFAULT_FP;
  return { w: n.w != null ? n.w : base.w,
           d: n.d != null ? n.d : base.d,
           rot: n.rot || 0 };
}
/* Only inside a plan. On the survey a place is a symbol, not a shape. */
const hasFootprint = n => !!planOf && !!(FOOTPRINT[n.kind] || PLAN_KINDS[n.kind]);

/* the four corners, turned, in world units */
function footprintPts(n){
  const f = footprintOf(n), ppm = doc.ppm || 8;
  const hw = f.w*ppm/2, hd = f.d*ppm/2;
  const a = (f.rot||0) * Math.PI/180, ca = Math.cos(a), sa = Math.sin(a);
  return [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([x,y])=>({
    x: n.x + x*ca - y*sa, y: n.y + x*sa + y*ca }));
}
function footprintPath(n){
  return footprintPts(n).map((p,i)=>(i?"L":"M")+r1(p.x)+" "+r1(p.y)).join(" ") + " Z";
}

/* What a drawn plan says this place offers, and whether the survey
   agrees with it. Drawing an inn ought to mean the town has one. */
function planProvides(nodeId){
  const pl = plans[nodeId];
  if(!pl) return null;
  const out = {};
  for(const m of pl.nodes||[]){
    const kd = PLAN_KINDS[m.kind] || {};
    /* a building can site more than one thing — an Errantry office is
       also the contract board, stables are also the coach stop. The
       `services` map is the truth; `svc` is a label for one of them. */
    const list = kd.services ? Object.keys(kd.services) : (kd.svc ? [kd.svc] : []);
    for(const k of list) out[k] = (out[k]||0) + 1;
  }
  return out;
}


/* ══════════════════════════════════════════════════════════════
   WHAT'S HIDDEN — searching a place

   Anywhere a marker can go, something can be hidden. A find is a skill
   check against a difficulty, and what turns up when you beat it.

   Two ways to notice a thing, and the difference matters in play:
   PASSIVE means it's found without asking — 10 + the modifier, no roll,
   no declaration. ACTIVE means somebody has to say they're looking.
   Perception is usually passive; Investigation almost never is.

   The benchmark strip below exists because a DC on its own tells you
   nothing. 15 is a coin-flip for a trained carrier and a wall for an
   untrained one, and you should be able to see that while you set it.
   ══════════════════════════════════════════════════════════════ */
const FIND_SKILLS = [
  ["investigation","Investigation","working it out"],
  ["perception","Perception","noticing"],
  ["survival","Survival","reading ground"],
  ["insight","Insight","reading people"],
  ["arcana","Arcana","recognising magic"],
  ["history","History","recognising the old work"],
  ["religion","Religion","recognising the rite"],
  ["nature","Nature","recognising the country"],
  ["medicine","Medicine","reading a body"],
  ["sleight","Sleight of Hand","light fingers"],
  ["athletics","Athletics","shifting it"],
  ["stealth","Stealth","not being seen doing it"]
];

/* 5e's own ladder, with what each rung means for a level 1–3 carrier. */
const DC_STEPS = [
  { dc:5,  name:"Very easy",  note:"Anyone who looks." },
  { dc:10, name:"Easy",       note:"Most people, most of the time." },
  { dc:12, name:"Fair",       note:"A trained eye usually; anyone else might." },
  { dc:15, name:"Moderate",   note:"A coin-flip for someone trained. A wall for anyone else." },
  { dc:18, name:"Hard",       note:"Wants a specialist, or a good roll, or both." },
  { dc:20, name:"Very hard",  note:"Expertise territory. Most carriers will never see it." },
  { dc:25, name:"Nearly out of reach", note:"Reserve this for things that shouldn't be found by accident." }
];

/* Rough modifiers at levels 1–3, proficiency +2 throughout. */
const FIND_BENCH = [
  { label:"untrained",  mod:1 },
  { label:"trained",    mod:5 },
  { label:"expert",     mod:8 }
];
const oddsAt = (dc, mod) => Math.max(0, Math.min(100, Math.round((21 - (dc - mod)) / 20 * 100)));

function findOdds(f){
  const dc = f.dc||10;
  return FIND_BENCH.map(b => ({
    ...b,
    roll: oddsAt(dc, b.mod),
    passive: 10 + b.mod >= dc
  }));
}
function dcRung(dc){
  let out = DC_STEPS[0];
  for(const s of DC_STEPS) if(dc >= s.dc) out = s;
  return out;
}

/* When a failed search may be tried again. Not the same question as
   whether it can be found twice — `once` covers that. This is: you
   looked, you missed, how long before looking again is worth anything.

   Without this every difficulty is decorative, because the answer is
   always "roll until you pass". */
const RETRY = [
  ["never", "Never — one attempt, and that's the answer"],
  ["visit", "Once each time you come to town"],
  ["day",   "Once a day"],
  ["week",  "Once a week"],
  ["month", "Once a month"],
  ["free",  "As often as you like"]
];
const retryLabel = k => (RETRY.find(r=>r[0]===k) || RETRY[0])[1];

function blankFind(){
  return { skill:"investigation", dc:12, passive:false, once:true, retry:"visit",
           what:"", gives:{ xp:0 }, fail:"" };
}

/* Repaint one find's benchmark without rebuilding the panel under the
   caret. */
function refreshFind(n, i){
  const f = (n.finds||[])[+i]; if(!f) return;
  const box = $("#pane-inspect").querySelectorAll(".findbox")[+i]; if(!box) return;
  const rung = dcRung(f.dc||10), odds = findOdds(f);

  if(o) o.innerHTML = odds.map(x=>
    `<span><i>${x.label}</i>${x.passive && f.passive ? "no roll" : x.roll+"%"}</span>`).join("");
}

function wireFinds(n){
  const add = $("#fd-add");
  if(add) add.onclick = ()=>{ (n.finds = n.finds||[]).push(blankFind()); touch(); renderInspect(); };
  if(!n.finds || !n.finds.length) return;
  const pane = $("#pane-inspect");
  const re = ()=>{ touch(); renderInspect(); };
  const F = i => n.finds[+i];

  pane.querySelectorAll("[data-fdwhat]").forEach(el=>el.oninput = e=>{ F(e.target.dataset.fdwhat).what = e.target.value; touch(); });
  pane.querySelectorAll("[data-fdfail]").forEach(el=>el.oninput = e=>{ F(e.target.dataset.fdfail).fail = e.target.value; touch(); });
  pane.querySelectorAll("[data-fdxp]").forEach(el=>{
    const i = el.dataset.fdxp;
    numField(el, { min:0, max:500, get:()=>G(i).xp||0, set:v=>G(i).xp=v });
  });
  pane.querySelectorAll("[data-fdcoin]").forEach(el=>el.onchange = e=>{
    const g = G(e.target.dataset.fdcoin);
    const v = +e.target.value;
    /* `purse` is a category the game rolls. `coin` would be raw copper,
       which is not what this dropdown means. */
    if(v) g.purse = v; else delete g.purse;
    delete g.coin;

  });

  pane.querySelectorAll("[data-fdonce]").forEach(el=>el.onchange = e=>{ F(e.target.dataset.fdonce).once = e.target.checked; touch(); });
  pane.querySelectorAll("[data-fdt]").forEach(el=>{
    const [i,t] = el.dataset.fdt.split("-");

  });

/* ── numeric fields you can actually clear ────────────────────
   Clamping on every keystroke means an empty box instantly becomes the
   minimum, so you can never delete "12" to type "8" — the 1 goes, the
   2 becomes 12 again, and the field fights you. Instead: leave the
   text alone while it's being typed, update anything live off it, and
   only clamp and re-render when the field is left. */
function numField(el, opts){
  if(!el) return;
  const { min = 0, max = 999, get, set, live, done } = opts;
  el.oninput = e=>{
    const raw = e.target.value.trim();
    if(raw === "" || raw === "-") return;          // mid-edit; leave it be
    const v = Number(raw);
    if(!Number.isFinite(v)) return;
    set(Math.max(min, Math.min(max, v)));
    touch();
    if(live) live();
  };
  const settle = e=>{
    const raw = e.target.value.trim();
    const v = raw === "" ? get() : Number(raw);
    const clamped = Math.max(min, Math.min(max, Number.isFinite(v) ? v : get()));
    set(clamped);
    e.target.value = clamped;
    touch();
    if(done) done(); else if(live) live();
  };
  el.onblur = settle;
  el.onchange = settle;
}


/* ══════════════════════════════════════════════════════════════
   REGULAR FORMS

   A market square is a square. Laying one point at a time to make a
   rectangle is busywork, so: pick a form, drag out the size you want,
   and let go. What you get is an ordinary outline with ordinary
   handles — every point draggable, every edge bendable — so the form
   is a starting position, never a constraint.

   Squares and triangles come out ruled; circles and ovals come out
   smoothed, because a circle drawn with eight points and a curve
   through them is rounder than one drawn with thirty-two.
   ══════════════════════════════════════════════════════════════ */
const FORMS = {
  free:     { label:"Freehand", key:"", straight:null,
              swatch:`<path d="M-8 4 Q-4-6 0 1 T8-4" fill="none" stroke="currentColor" stroke-width="1.8"/>` },
  square:   { label:"Square",   key:"", straight:true,
              swatch:`<rect x="-7" y="-7" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"/>` },
  circle:   { label:"Circle",   key:"", straight:false,
              swatch:`<circle r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/>` },
  triangle: { label:"Triangle", key:"", straight:true,
              swatch:`<path d="M0-8 L8 6 L-8 6 Z" fill="none" stroke="currentColor" stroke-width="1.8"/>` },
  hex:      { label:"Hexagon",  key:"", straight:true,
              swatch:`<path d="M0-8 L7-4 L7 4 L0 8 L-7 4 L-7-4 Z" fill="none" stroke="currentColor" stroke-width="1.8"/>` }
};
let drawForm = "free";

/* Points for a form inside the box the drag described. Squares and
   triangles snap square when Shift is held; circles become true
   circles rather than ovals. */
function formPoints(form, a, b, square){
  let x0 = Math.min(a.x,b.x), y0 = Math.min(a.y,b.y);
  let w = Math.abs(b.x-a.x), h = Math.abs(b.y-a.y);
  if(square){ const m = Math.max(w,h); x0 = a.x <= b.x ? a.x : a.x-m; y0 = a.y <= b.y ? a.y : a.y-m; w = h = m; }
  const cx = x0 + w/2, cy = y0 + h/2;
  const R = v => Math.round(v);

  if(form === "square")
    return [{x:R(x0),y:R(y0)},{x:R(x0+w),y:R(y0)},{x:R(x0+w),y:R(y0+h)},{x:R(x0),y:R(y0+h)}];

  if(form === "triangle")
    return [{x:R(cx),y:R(y0)},{x:R(x0+w),y:R(y0+h)},{x:R(x0),y:R(y0+h)}];

  if(form === "hex"){
    const out = [];
    for(let i=0;i<6;i++){
      const t = Math.PI/2 + i*Math.PI/3;          // flat-ish top
      out.push({ x:R(cx + Math.cos(t)*w/2), y:R(cy + Math.sin(t)*h/2) });
    }
    return out;
  }
  /* circle — eight points, smoothed, is rounder than thirty-two ruled */
  const out = [];
  for(let i=0;i<8;i++){
    const t = i/8 * Math.PI*2;
    out.push({ x:R(cx + Math.cos(t)*w/2), y:R(cy + Math.sin(t)*h/2) });
  }
  return out;
}

function commitForm(a, b, square){
  const kd = SHAPE_KINDS[drawKind] || {};
  if(Math.hypot(b.x-a.x, b.y-a.y) < 4/view.k) return false;   // a tap, not a drag
  const pts = formPoints(drawForm, a, b, square);
  const sh = { id:uid("s"), kind:drawKind, closed: !kd.alwaysOpen, name:"",
               side:1, impassable: !!kd.barrier, notes:"",
               straight: FORMS[drawForm].straight === true, pts };
  if(kd.river){ sh.w0 = 1.6; sh.w1 = 5.5; }
  doc.shapes = doc.shapes || [];
  doc.shapes.push(sh);
  noteLaid(()=>{ doc.shapes = doc.shapes.filter(x=>x.id!==sh.id); });
  select("shape", sh.id);
  touch();
  revealInspector(false);
  return true;
}

/* the ghost while dragging */
function formOverlay(inv){
  if(!formDrag) return "";
  const kd = SHAPE_KINDS[drawKind] || {};
  const pts = formPoints(drawForm, formDrag.a, formDrag.b, formDrag.square);
  const d = pathOf(pts, true, FORMS[drawForm].straight === true);
  const w = Math.abs(formDrag.b.x-formDrag.a.x)/doc.ppm, h = Math.abs(formDrag.b.y-formDrag.a.y)/doc.ppm;
  const mid = { x:(formDrag.a.x+formDrag.b.x)/2, y:Math.min(formDrag.a.y,formDrag.b.y) };
  return `<path d="${d}" fill="${kd.fill||"none"}" fill-opacity=".28" stroke="${kd.stroke||"var(--lead)"}"
            stroke-width="${1.8*inv}" stroke-dasharray="${5*inv} ${4*inv}"/>
          <text class="roadlabel" x="${mid.x}" y="${mid.y - 10*inv}" font-size="${11*inv}" fill="var(--lead)">${
            r1(w)} × ${r1(h)} ${doc.unit||"mi"}</text>`;
}
let formDrag = null;


/* ══════════════════════════════════════════════════════════════
   HOW OFTEN THE ROAD INTERRUPTS

   You say how many encounters you want on an average leg; this works
   out the gap distribution that produces it on THIS map's roads. The
   same spacing that gives one a leg here would give six on a map with
   twelve-mile roads, so the constant can't be written down in advance —
   it has to be solved against what you actually drew.

   Length ÷ mean gap would be the obvious formula and it's wrong: most
   legs are short, and on a road only a little longer than the mean gap
   the count is dominated by whether the first gap fits at all. The
   exact expectation is computed instead, from the Irwin–Hall
   distribution. It agrees with the game engine to about one percent.
   ══════════════════════════════════════════════════════════════ */
const _LF=[0]; for(let i=1;i<=200;i++) _LF[i]=_LF[i-1]+Math.log(i);
const _lc=(n,k)=>_LF[n]-_LF[k]-_LF[n-k];
function irwinHall(k,x){
  if(x<=0) return 0; if(x>=k) return 1;
  let s=0; const top=Math.floor(x);
  for(let j=0;j<=top;j++){
    const t=Math.exp(_lc(k,j)+k*Math.log(x-j)-_LF[k]);
    s += (j%2? -t : t);
  }
  return Math.max(0,Math.min(1,s));
}
function expectedOnRoad(L,lo,span){
  if(L<=0) return 0;
  if(span<=0) return Math.floor(L/Math.max(1e-9,lo));
  let t=0; const kMax = lo>0 ? Math.floor(L/lo) : 400;
  for(let k=1;k<=Math.min(kMax,200);k++){
    const x=(L-k*lo)/span; if(x<=0) break;
    t += irwinHall(k,x);
  }
  return t;
}
const DENSITY_SCALE = { quiet:1.6, normal:1.0, dense:0.65 };

/* Roads that named their own rate are held out of the general solve —
   otherwise making one road busy would quietly thin every other road on
   the map to compensate. */
function walkableRoads(freeOnly){
  const out=[];
  for(const r of doc.roads||[]){
    const a=nodeById(r.from), b=nodeById(r.to);
    if(!a||!b||a.gate||b.gate) continue;
    if(freeOnly && r.enc!=null) continue;
    out.push({ id:r.id, miles:r.miles, scale:DENSITY_SCALE[r.density||"normal"]??1, enc:r.enc, road:r });
  }
  return out;
}
function perLegAt(roads, mean, spread){
  if(!roads.length) return 0;
  const span=mean*Math.max(0,Math.min(1.99,spread)), lo=mean-span/2;
  let t=0;
  for(const r of roads) t += expectedOnRoad(r.miles, lo*r.scale, span*r.scale);
  return t/roads.length;
}
/* Monotonic in the mean, so a bisection is exact. */
function solveSpacing(){
  const spread = doc.gapSpread ?? 1.2;
  const target = doc.encPerLeg ?? 1.0;
  const roads = walkableRoads(true);
  if(!roads.length || target<=0)
    return { ok:false, target, spread, mean:1.5, gapMin:0.6, gapSpan:1.8, perLeg:0, roads:[] };
  let lo=0.05, hi=400;
  for(let i=0;i<60;i++){
    const mid=(lo+hi)/2;
    if(perLegAt(roads,mid,spread)>target) lo=mid; else hi=mid;
  }
  const mean=(lo+hi)/2, span=mean*spread;
  const gapMin=Math.max(0.05, Math.round((mean-span/2)*100)/100);
  const gapSpan=Math.round(span*100)/100;
  const base={gapMin,gapSpan};
  const all=walkableRoads(false);
  const per=all.map(r=>{
    const g = r.enc!=null ? solveRoadGap(r.miles,r.enc,spread)
                          : { gapMin:gapMin*r.scale, gapSpan:gapSpan*r.scale };
    return { id:r.id, miles:r.miles, override:r.enc!=null, enc:r.enc,
             expected:Math.round(expectedOnRoad(r.miles,g.gapMin,g.gapSpan)*100)/100 };
  });
  const miles=all.reduce((s,r)=>s+r.miles,0);
  const total=per.reduce((s,r)=>s+r.expected,0);
  const freeTotal=per.filter(r=>!r.override).reduce((s,r)=>s+r.expected,0);
  return { ok:true, target, spread,
    mean:Math.round(mean*100)/100, gapMin, gapSpan,
    perLeg: roads.length ? Math.round(freeTotal/roads.length*100)/100 : 0,
    perLegAll: all.length ? Math.round(total/all.length*100)/100 : 0,
    perMile: miles? Math.round(total/miles*100)/100 : 0,
    total: Math.round(total), legs:all.length, freeLegs:roads.length,
    namedLegs: all.length-roads.length, miles:Math.round(miles*10)/10, roads: per };
}
/* Solve the gap for one road named as an exception. */
function solveRoadGap(miles, target, spread){
  const sp = Math.max(0, Math.min(1.99, spread ?? 1.2));
  if(!(miles>0) || !(target>0)) return { gapMin: Math.max(miles*4, 999), gapSpan: 0 };
  let lo=0.02, hi=Math.max(400, miles*40);
  for(let i=0;i<60;i++){
    const mid=(lo+hi)/2, span=mid*sp;
    if(expectedOnRoad(miles, mid-span/2, span) > target) lo=mid; else hi=mid;
  }
  const mean=(lo+hi)/2, span=mean*sp;
  return { gapMin:Math.max(0.02, Math.round((mean-span/2)*1000)/1000),
           gapSpan:Math.round(span*1000)/1000 };
}
function gapForRoad(r, sp){
  const spread = doc.gapSpread ?? 1.2;
  if(r.enc != null) return solveRoadGap(r.miles, r.enc, spread);
  const scale = DENSITY_SCALE[r.density||"normal"] ?? 1;
  return { gapMin: sp.gapMin*scale, gapSpan: sp.gapSpan*scale };
}
function roadExpects(r){
  const g = gapForRoad(r, solveSpacing());
  return Math.round(expectedOnRoad(r.miles, g.gapMin, g.gapSpan)*100)/100;
}

        <input data-foec="${i}" class="fchance mono" type="text" value="${f.chance==null?"":f.chance}" placeholder="1" title="Chance it's here at all, 0 to 1">

      </div>${m?`<div class="foenote">${m.xp} xp each${f.chance!=null&&f.chance<1?` · ${Math.round(f.chance*100)}% of the time`:""}${m.boss?" · boss":""}${m.talk?" · can be talked to":""}</div>`:""}`;
    }).join("")}
    <button class="btn wide" id="st-addfoe" style="margin-top:4px">Add another</button>

    <p class="grouplab">What they're sitting on</p>
    <div class="field"><label>Purse</label><select id="st-coin">${PURSES.map(p=>
      `<option value="${p.cat}" ${p.cat===((st.loot&&(st.loot.purse??st.loot.coin))||0)?"selected":""}>${p.cat?`${p.cat} · ${p.name} — ${p.dice}`:"No coin"}</option>`).join("")}</select></div>
    <div class="checks" style="grid-template-columns:1fr 1fr">
      ${[1,2,3,4].map(t=>`<div class="field" style="margin-bottom:8px"><label>Tier ${t}</label>
        <input id="st-t${t}" class="mono" type="number" min="0" max="9" value="${(st.loot&&st.loot["t"+t])||0}"></div>`).join("")}
    </div>
    <p class="empty-note" style="margin:-2px 0 8px;font-size:12px">
      ${[1,2,3,4].filter(t=>(st.loot&&st.loot["t"+t])).map(t=>`tier ${t} — ${TIER_LABEL[t]}`).join(" · ")||"No goods."}
    </p>
    ${(()=>{
      const reg = doc.regions.find(r=>r.id===n.region);
      const w = lootWorth(st, (reg&&reg.threat)||1);
      if(!w.total) return `<p class="warn">Nothing to carry out of here. A place worth fighting for should be worth robbing.</p>`;
      return `<div class="worth"><div>
        <b>${cpStr(w.coin)}</b> in loose coin${(reg&&reg.threat>1)?` <i>(×${THREAT_MULT[reg.threat]} for ${esc(reg.name)})</i>`:""}<br>
        <b>${cpStr(w.goods)}</b> in goods, about <b>${w.lb} lb</b> of it<br>
        <b>${cpStr(w.total)}</b> all told${w.lb>60?` — and nobody is carrying ${w.lb} lb out in one trip`:""}
      </div></div>`;
    })()}

    <div class="verdict" style="border-color:${tone}">
      <div class="vhead" style="color:${tone}">${chk.verdict.toUpperCase()}</div>
      <div class="vbody">${chk.foes} foe${chk.foes===1?"":"s"} · ${chk.raw} xp raw, ${chk.eff} against a solo budget of ${chk.hard} at level ${st.level||1}
      ${chk.verdict==="deadly"?"<br>This will probably kill a carrier who walks in alone at that level.":""}
      ${chk.verdict==="light"?"<br>Barely worth the walk. Add a foe, or drop the level it's built for.":""}</div>
    </div>
    <button class="btn wide danger" id="st-del">Empty this place</button>`;
}


function wireSite(n){
  const add = $("#f-addsite");
  if(add){ add.onclick = ()=>{ n.site = blankSite(n); touch(); renderInspect(); }; return; }
  if(!n.site) return;
  const st = n.site;
  const re = () => { touch(); renderInspect(); };

  $("#st-kind").oninput  = e=>{ st.kind = e.target.value; touch(); };
  numField($("#st-level"), { min:1, max:10, get:()=>st.level||1, set:v=>st.level=v,
                             live:()=>refreshVerdict(n), done:()=>re() });
  numField($("#st-waves"), { min:1, max:6, get:()=>st.waves||1, set:v=>st.waves=v,
                             live:()=>refreshVerdict(n) });
  $("#st-once").onchange = e=>{ st.once = e.target.checked; touch(); };

  $("#pane-inspect").querySelectorAll("[data-foe]").forEach(sel=>{
    sel.onchange = e=>{ st.foes[+e.target.dataset.foe].id = e.target.value; re(); };
  });
  $("#pane-inspect").querySelectorAll("[data-foen]").forEach(inp=>{
    inp.oninput = e=>{
      const v = e.target.value.trim();
      st.foes[+e.target.dataset.foen].n = /^\d+$/.test(v) ? +v : v;
      touch(); refreshVerdict(n);
    };
  });
  $("#pane-inspect").querySelectorAll("[data-foec]").forEach(inp=>{
    inp.oninput = e=>{
      const v = e.target.value.trim();
      const f = st.foes[+e.target.dataset.foec];
      if(v==="") delete f.chance; else f.chance = Math.max(0, Math.min(1, +v||0));
      touch(); refreshVerdict(n);
    };
  });
  $("#pane-inspect").querySelectorAll("[data-foedel]").forEach(b=>{
    b.onclick = e=>{ st.foes.splice(+e.currentTarget.dataset.foedel,1); re(); };
  });
  $("#st-addfoe").onclick = ()=>{ (st.foes=st.foes||[]).push({id:"bandit",n:1}); re(); };

  $("#st-coin").onchange = e=>{
    const L = (st.loot = st.loot || {});
    const v = +e.target.value;
    /* one spelling only. `purse` is the category the game rolls. */
    if(v) L.purse = v; else delete L.purse;
    delete L.coin;
    touch();
  };
  for(const t of [1,2,3,4]){
    numField($("#st-t"+t), { min:0, max:9,
      get:()=>(st.loot&&st.loot["t"+t])||0,
      set:v=>{ (st.loot=st.loot||{})["t"+t] = v; } });
  }
  $("#st-del").onclick = ()=>{ delete n.site; touch(); renderInspect(); };
}

/* Update the grade in place — rebuilding the whole panel while someone
   is typing "1d3" throws the caret out of the box. */
function refreshVerdict(n){
  if(!n.site) return;
  const chk = checkSite(n.site, n.site.level||n.level||1);
  const tone = { light:"var(--ink-faint)", fair:"var(--r1)", hard:"var(--r3)", deadly:"var(--lead)" }[chk.verdict];
  const box = $("#pane-inspect .verdict"); if(!box) return;
  box.style.borderColor = tone;
  const h = box.querySelector(".vhead"), b = box.querySelector(".vbody");
  if(h){ h.textContent = chk.verdict.toUpperCase(); h.style.color = tone; }
  if(b) b.innerHTML = `${chk.foes} foe${chk.foes===1?"":"s"} · ${chk.raw} xp raw, ${chk.eff} against a solo budget of ${chk.hard} at level ${n.site.level||1}`;
}

function renderInspect(){
  const el = $("#pane-inspect");
  if(!sel && planOf){
    const outer = root;
    const n = (outer.nodes||[]).find(x=>x.id===planOf);
    const sited = new Set();
    for(const b of doc.nodes){ const kd=PLAN_KINDS[b.kind]; if(kd&&kd.svc) sited.add(kd.svc); }
    const claimed = n ? Object.keys(n.services||{}).filter(k=>n.services[k]) : [];
    const missing = claimed.filter(k=>!sited.has(k) &&
      Object.values(PLAN_KINDS).some(kd=>kd.svc===k));
    el.innerHTML = `<p class="eyebrow">${esc(doc.title||"Plan")}</p>
      <p class="empty-note">A plan of the place, drawn at <span class="mono">${doc.ppm}</span> px to the ${UNIT()}.
      Everything works as it does on the survey — streets bend, water runs, walls block.</p>
      <div class="field" style="margin-top:14px"><label>Name of this place</label>
        <input id="p-title" type="text" value="${esc(doc.title||"")}"></div>
      <p class="eyebrow spaced">Trades claimed on the survey</p>
      ${missing.length
        ? `<p class="empty-note" style="margin-bottom:8px">${missing.length} not yet sited — put a building down and it ticks itself off.</p>
           <div class="checks">${missing.map(k=>`<span class="want">${esc(SERVICE_LABEL[k]||k)}</span>`).join("")}</div>`
        : (claimed.length ? `<p class="allclear">Every claimed trade has a building.</p>`
                          : `<p class="empty-note">This marker claims no trades.</p>`)}
      <div class="hr"></div>
      <button class="btn wide" id="p-back">Back out to the survey</button>`;
    const pt = $("#p-title");
    pt.oninput = e=>{ doc.title = e.target.value; renderCrumb(); markDirty(currentKey()); };
    $("#p-back").onclick = leavePlan;
    return;
  }
  if(!sel){
    el.innerHTML = `<p class="eyebrow">Nothing selected</p>
      <p class="empty-note">Pick a marker, a road, or a drawn feature to read its particulars.<br><br>
      <span class="mono">M</span> dividers · <span class="mono">V</span> select ·
      <span class="mono">C</span> join · <span class="mono">1–0</span> markers ·
      <span class="mono">R</span> river · <span class="mono">S</span> water · <span class="mono">X</span> impasse ·
      <span class="mono">F</span> fit · <span class="mono">Del</span> remove.<br><br>
      Double-click any road or river to put a bend in it. Select a river and click
      either dashed end to carry it on later.</p>`;
    return;
  }
  if(sel.kind==="shape"){
    const sh = shapeById(sel.id); if(!sh){ sel=null; return renderInspect(); }
    const kd = SHAPE_KINDS[sh.kind]||SHAPE_KINDS.water;
    const run = r1(polyLength(samplePath(sh.pts, sh.closed, 10, sh.straight))/doc.ppm);
    const liveEnd = (editing && editing.id===sh.id) ? editing.end : null;
    el.innerHTML = `
      <p class="eyebrow">Drawn feature</p>
      <div class="field"><label>Name</label><input id="s-name" type="text" value="${esc(sh.name)}" placeholder="unnamed"></div>
      <div class="field"><label>Kind</label><select id="s-kind">${SHAPE_KEYS.map(k=>`<option value="${k}" ${k===sh.kind?"selected":""}>${SHAPE_KINDS[k].label}</option>`).join("")}</select></div>
      ${kd.alwaysOpen?"":`<label class="check"><input id="s-closed" type="checkbox" ${sh.closed?"checked":""}> Closed outline</label>`}
      <label class="check" style="margin-top:6px"><input id="s-straight" type="checkbox" ${sh.straight?"checked":""}> Straight lines between points</label>
      <label class="check" style="margin-top:6px"><input id="s-imp" type="checkbox" ${sh.impassable?"checked":""}> Roads can't cross this</label>
      ${kd.road?`
        <div class="field" style="margin-top:12px"><label>Width</label>
          <input id="s-w" class="mono" type="number" step="0.5" min="0.5" max="60" value="${sh.w==null?kd.w:sh.w}"></div>`:""}
      ${kd.river?`
        <p class="eyebrow spaced">The channel</p>
        <div class="row2">
          <div class="field"><label>At the head</label><input id="s-w0" class="mono" type="number" step="0.5" min="0.5" max="60" value="${sh.w0==null?1.6:sh.w0}"></div>
          <div class="field"><label>At the mouth</label><input id="s-w1" class="mono" type="number" step="0.5" min="0.5" max="60" value="${sh.w1==null?5.5:sh.w1}"></div>
        </div>
        <button class="btn wide" id="s-rev">Reverse the flow</button>`:""}
      ${(kd.hachure&&!sh.closed)?`<button class="btn wide" id="s-flip" style="margin-top:11px">Put the water on the other side</button>`:""}
      ${sh.closed?"":`

        <p class="empty-note" style="margin-bottom:9px">Take the line up again from either end. It stays where it is until you do — come back to it whenever.</p>
        <button class="btn wide${liveEnd==="head"?" on":""}" id="s-ext-head">${liveEnd==="head"?"Laying points at the head — Enter to stop":`Keep drawing from the ${kd.river?"head":"start"}`}</button>
        <button class="btn wide${liveEnd==="tail"?" on":""}" id="s-ext-tail">${liveEnd==="tail"?"Laying points at the mouth — Enter to stop":`Keep drawing from the ${kd.river?"mouth":"end"}`}</button>`}
      <div class="field" style="margin-top:14px"><label>Notes</label><textarea id="s-notes" placeholder="What it is, and what it means for anyone crossing.">${esc(sh.notes)}</textarea></div>
      <p class="eyebrow spaced">Measured</p>
      <div class="stat"><span class="k">Outline runs</span><span class="v">${run} <small>${UNIT()}</small></span></div>
      <div class="stat"><span class="k">Points</span><span class="v">${sh.pts.length}</span></div>
      <div class="hr"></div>
      <button class="btn wide danger" id="s-del">Remove this feature</button>`;

    $("#s-name").oninput = e=>{ sh.name=e.target.value; touch(); };
    $("#s-kind").onchange = e=>{
      sh.kind = e.target.value;
      const nk = SHAPE_KINDS[sh.kind];
      if(nk.alwaysOpen) sh.closed = false;
      if(nk.river && sh.w0==null){ sh.w0=1.6; sh.w1=5.5; }
      touch(); renderInspect();
    };
    $("#s-straight").onchange = e=>{ sh.straight = e.target.checked; drawStraight = sh.straight; touch(); };
    const wS = $("#s-w"); if(wS) wS.oninput = e=>{ sh.w = Math.max(.5, Math.min(60, +e.target.value||kd.w)); touch(); };
    const cl = $("#s-closed"); if(cl) cl.onchange = e=>{ sh.closed=e.target.checked; if(sh.closed) editing=null; touch(); renderInspect(); };
    $("#s-imp").onchange = e=>{ sh.impassable=e.target.checked; touch(); };
    $("#s-notes").oninput = e=>{ sh.notes=e.target.value; touch(); };
    const fl = $("#s-flip"); if(fl) fl.onclick = ()=>{ sh.side = sh.side===-1?1:-1; touch(); };
    const w0 = $("#s-w0"); if(w0) w0.oninput = e=>{ sh.w0 = Math.max(.5, Math.min(60, +e.target.value||1.6)); touch(); };
    const w1 = $("#s-w1"); if(w1) w1.oninput = e=>{ sh.w1 = Math.max(.5, Math.min(60, +e.target.value||5.5)); touch(); };
    const rv = $("#s-rev"); if(rv) rv.onclick = ()=>{
      sh.pts.reverse();
      if(editing && editing.id===sh.id) editing.end = editing.end==="head"?"tail":"head";
      touch(); renderInspect();
    };
    const eh = $("#s-ext-head"); if(eh) eh.onclick = ()=>{
      editing = (liveEnd==="head") ? null : { id:sh.id, end:"head" };
      if(editing && tool==="draw"){ tool="select"; buildRail(); }
      render(); renderInspect();
    };
    const et = $("#s-ext-tail"); if(et) et.onclick = ()=>{
      editing = (liveEnd==="tail") ? null : { id:sh.id, end:"tail" };
      if(editing && tool==="draw"){ tool="select"; buildRail(); }
      render(); renderInspect();
    };
    $("#s-del").onclick = confirmDelete;
    return;
  }
  if(sel.kind==="node"){
    const n = nodeById(sel.id); if(!n){ sel=null; return renderInspect(); }
    const d = distancesFromOrigin();
    const surveyed = isFinite(d[n.id]) ? r1(d[n.id]) : null;
    const des = designation(n, d);
    const attached = doc.roads.filter(r=>r.from===n.id||r.to===n.id);
    el.innerHTML = `
      <p class="eyebrow">${esc(KINDS[n.kind].label)}</p>
      <div class="field"><label>Name</label><input id="f-name" type="text" value="${esc(n.name)}" placeholder="unnamed"></div>
      <div class="row2">
        <div class="field"><label>Stone no.</label><input id="f-stone" class="mono" type="text" value="${n.stone==null?"":esc(n.stone)}" placeholder="—"></div>
        <div class="field"><label>Kind</label><select id="f-kind">${KIND_KEYS.map(k=>`<option value="${k}" ${k===n.kind?"selected":""}>${KINDS[k].label}</option>`).join("")}</select></div>
      </div>
      ${planOf?"":`<label class="check" style="margin:-4px 0 12px"><input id="f-slock" type="checkbox" ${n.stoneLocked?"checked":""}> Hold this number when renumbering</label>`}
      <div class="row2">

      <label class="check" style="margin-top:6px"><input id="f-seat" type="checkbox" ${n.seat?"checked":""}> New capital — the seat as it stands now</label>`}

        <button class="btn wide" id="f-plan">${hasPlan(n.id)?"Open the plan of this place":"Draw the plan of this place"}</button>
        ${hasPlan(n.id)?`<button class="btn wide danger" id="f-planwipe">Discard this plan</button>`:""}`}

    $("#f-name").oninput = e=>{ n.name=e.target.value; touch(); };

  } else {
