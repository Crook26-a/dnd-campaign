      <div class="field" style="margin-top:4px"><label>Encounters on this road</label>
        <input id="r-enc" class="mono" type="text" value="${r.enc==null?"":r.enc}" placeholder="the map's rate"></div>
      <p class="empty-note" style="margin:-6px 0 10px;font-size:12px">${r.enc==null
        ? `Leave it blank and this road takes the map's rate, scaled by how busy the stretch is said to be. Fill it in to name this road an exception — the road nobody comes back from, or the mile where nothing ever happens.`
        : `Named as an exception. The <b>${esc(r.density||"normal")}</b> setting above is ignored while this is filled in, and this road is held out of the map's average.`}</p>
      <div class="stat"><span class="k">Expected encounters</span><span class="v">${roadExpects(r)}${r.enc!=null?` <small>named</small>`:` <small>from the map</small>`}</span></div>
      <div class="stat"><span class="k">Drawn length</span><span class="v">${drawn} <small>${UNIT()}</small></span></div>
      ${drift?`<p class="warn" style="margin-top:9px">The line as drawn runs <b>${drawn} mi</b>, but this road is held at <b>${r.miles} mi</b>.</p>
        <button class="btn wide" id="r-adopt">Take the drawn length</button>`:""}
      <div class="stat"><span class="k">Coach at 25%</span><span class="v">${r1(r.miles*.25)} <small>${UNIT()}</small></span></div>
      <div class="stat"><span class="k">Coach at 50%</span><span class="v">${r1(r.miles*.5)} <small>${UNIT()}</small></span></div>
      <div class="stat"><span class="k">Coach at 75%</span><span class="v">${r1(r.miles*.75)} <small>${UNIT()}</small></span></div>
      <div class="hr"></div>
      <button class="btn wide" id="r-straight">Straighten this road</button>
      <button class="btn wide danger" id="r-del">Remove this road</button>`;

    $("#r-name").oninput = e=>{ r.name=e.target.value; touch(); };
    $("#r-miles").oninput = e=>{ r.miles=Math.max(.1,+e.target.value||.1); r.milesLocked=true; touch(); };
    $("#r-lock").onchange = e=>{ r.milesLocked=e.target.checked; touch(); };
    $("#r-density").onchange = e=>{ r.density=e.target.value; touch(); };
    $("#r-region").onchange = e=>{ r.region=e.target.value; touch(); };
    $("#r-straight").onchange = e=>{
      r.straight = e.target.checked;
      if(!r.milesLocked) r.miles = roadDrawnMiles(r);
      touch(); renderInspect();
    };
    $("#r-coach").onchange = e=>{ r.coach=e.target.checked; touch(); };
    const enc = $("#r-enc");
    if(enc){
      enc.oninput = e=>{
        const raw = e.target.value.trim();
        if(raw===""){ delete r.enc; touch(); return; }
        const v = Number(raw);
        if(Number.isFinite(v) && v>=0 && v<=40){ r.enc = Math.round(v*100)/100; touch(); }
      };
      enc.onblur = ()=>{ renderPane(true); };
    }
    $("#r-notes").oninput = e=>{ r.notes=e.target.value; touch(); };
    const ad = $("#r-adopt"); if(ad) ad.onclick = ()=>{ r.miles = roadDrawnMiles(r); touch(); renderInspect(); };
    $("#r-straight").onclick = ()=>{ r.pts=[]; if(!r.milesLocked) r.miles=roadDrawnMiles(r); touch(); renderInspect(); };
    $("#r-del").onclick = confirmDelete;
  }
}

function renderLedger(){
  const total = doc.roads.reduce((s,r)=>s+r.miles,0);
  const legs = doc.roads.map(r=>r.miles).sort((a,b)=>a-b);
  const byRegion = {}; for(const r of doc.roads){ const id=r.region||"—"; byRegion[id]=(byRegion[id]||0)+r.miles; }
  const counts = {}; for(const n of doc.nodes) counts[n.kind]=(counts[n.kind]||0)+1;

  const warns = [];
  if(!doc.nodes.some(n=>n.origin)) warns.push("No old capital marked — stones can't be reckoned.");
  if(doc.nodes.length && !doc.nodes.some(n=>n.seat)) warns.push("No new capital marked.");
  /* the road rules lean on these: nowhere to resupply means no long rests, nowhere to
     wake up means death mode 2 has no destination */
  const NEED = [["provision","provisioner"],["temple","temple"],["inn","inn"],["board","contract board"]];
  for(const reg of doc.regions){
    const here = doc.nodes.filter(n=>n.region===reg.id);
    if(!here.length) continue;
    const missing = NEED.filter(([k])=>!here.some(n=>n.services&&n.services[k])).map(x=>x[1]);
    if(missing.length) warns.push(`<b>${esc(reg.name)}</b> has no ${missing.join(", no ")}.`);
  }
  const orphan = doc.nodes.filter(n=>!doc.roads.some(r=>r.from===n.id||r.to===n.id));
  if(orphan.length) warns.push(`<b>${orphan.length}</b> marker${orphan.length===1?"":"s"} with no road: ${orphan.slice(0,4).map(n=>esc(n.name||KINDS[n.kind].label)).join(", ")}${orphan.length>4?"…":""}`);
  const d = distancesFromOrigin();
  const unreach = Object.keys(d).length ? doc.nodes.filter(n=>!isFinite(d[n.id])) : [];
  if(unreach.length) warns.push(`<b>${unreach.length}</b> marker${unreach.length===1?"":"s"} can't be walked to from the capital.`);
  const nums = doc.nodes.map(n=>n.stone).filter(v=>v!=null&&v!=="");
  const dupes = [...new Set(nums.filter((v,i)=>nums.indexOf(v)!==i))];
  if(dupes.length) warns.push(`Stone number${dupes.length===1?"":"s"} used twice: <b>${dupes.slice(0,6).join(", ")}</b>`);
  const hidden = doc.nodes.reduce((s,n)=>s+((n.finds||[]).length),0);
  const hollow = doc.nodes.flatMap(n=>(n.finds||[]).map(f=>({n,f})))
    .filter(({f})=>!f.what && !(f.gives&&(f.gives.xp||f.gives.coin||f.gives.t1||f.gives.t2||f.gives.t3||f.gives.t4||f.gives.flag)));
  if(hollow.length) warns.push(`<b>${hollow.length}</b> hidden thing${hollow.length===1?"":"s"} that give${hollow.length===1?"s":""} nothing and say${hollow.length===1?"s":""} nothing.`);
  const steep = doc.nodes.flatMap(n=>(n.finds||[]).map(f=>({n,f}))).filter(({f})=>(f.dc||10)>=20);
  if(steep.length) warns.push(`<b>${steep.length}</b> hidden thing${steep.length===1?"":"s"} at DC 20 or above — an expert carrier still misses those more than half the time.`);
  const pointless = doc.nodes.filter(nd=>{
    if(!nd.site||nd.gate) return false;
    const reg=doc.regions.find(r=>r.id===nd.region);
    return (nd.site.foes||[]).length && !lootWorth(nd.site,(reg&&reg.threat)||1).total;
  });
  if(pointless.length) warns.push(`<b>${pointless.length}</b> place${pointless.length===1?"":"s"} with something to fight and nothing to take: ${pointless.slice(0,4).map(nd=>esc(nd.name||nd.id)).join(", ")}`);
  const deadly = doc.nodes.filter(n=>n.site&&!n.gate&&checkSite(n.site,n.site.level||n.level||1).verdict==="deadly");
  if(deadly.length) warns.push(`<b>${deadly.length}</b> place${deadly.length===1?"":"s"} would likely kill a lone carrier at the level ${deadly.length===1?"it claims":"they claim"}: ${deadly.slice(0,4).map(n=>esc(placeName?placeName(n):(n.name||n.id))).join(", ")}`);
  const empty = doc.nodes.filter(n=>["cave","ruin","toll"].includes(n.kind)&&!n.site&&!n.gate);
  if(empty.length) warns.push(`<b>${empty.length}</b> place${empty.length===1?"":"s"} that look like somewhere to go in, with nothing in ${empty.length===1?"it":"them"}.`);
  const unnamed = doc.nodes.filter(n=>!n.name&&n.kind!=="stone").length;
  if(unnamed) warns.push(`<b>${unnamed}</b> place${unnamed===1?"":"s"} still unnamed.`);
  /* roads that run straight through something nothing can cross */
  const barriers = (doc.shapes||[]).filter(s=>s.impassable&&s.pts&&s.pts.length>1)
    .map(s=>({ name:s.name||SHAPE_KINDS[s.kind].label, sm:sampleCurve(s.pts,s.closed,8) }));
  if(barriers.length){
    const bad = [];
    for(const r of doc.roads){
      const a=nodeById(r.from), b=nodeById(r.to); if(!a||!b) continue;
      const rs = sampleCurve(roadPts(r),false,8);
      let hit = null;
      outer: for(const bar of barriers)
        for(let i=1;i<rs.length;i++)
          for(let j=1;j<bar.sm.length;j++)
            if(segCross(rs[i-1],rs[i],bar.sm[j-1],bar.sm[j])){ hit = bar.name; break outer; }
      if(hit) bad.push(`${a.name||"?"}–${b.name||"?"} across ${hit}`);
    }
    if(bad.length) warns.push(`<b>${bad.length}</b> road${bad.length===1?"":"s"} cross an impasse: ${bad.slice(0,3).map(esc).join("; ")}${bad.length>3?"…":""}`);
  }

  $("#pane-ledger").innerHTML = `
    <p class="eyebrow">The survey</p>
    <div class="stat head"><span class="k">Road laid</span><span class="v">${Math.round(total)} <small>${UNIT()}</small></span></div>
    <div class="stat"><span class="k">Markers</span><span class="v">${doc.nodes.length}</span></div>
    <div class="stat"><span class="k">Roads</span><span class="v">${doc.roads.length}</span></div>
    <div class="stat"><span class="k">Hidden things</span><span class="v">${doc.nodes.reduce((s,n)=>s+((n.finds||[]).length),0)}</span></div>
    <div class="stat"><span class="k">Drawn features</span><span class="v">${(doc.shapes||[]).length}</span></div>
    <div class="stat"><span class="k">Shortest leg</span><span class="v">${legs.length?legs[0]+` <small>${UNIT()}</small>`:"—"}</span></div>
    <div class="stat"><span class="k">Longest leg</span><span class="v">${legs.length?legs[legs.length-1]+` <small>${UNIT()}</small>`:"—"}</span></div>
    <div class="stat"><span class="k">Median leg</span><span class="v">${legs.length?legs[Math.floor(legs.length/2)]+` <small>${UNIT()}</small>`:"—"}</span></div>
    <div class="stat"><span class="k">Encounters, all told</span><span class="v">≈${Math.round(total/2)}</span></div>
    <p class="eyebrow spaced">Miles by region</p>
    ${doc.regions.map(r=>`<div class="stat"><span class="k"><span class="swatch" style="background:${r.hex};display:inline-block;margin-right:6px;vertical-align:-1px"></span>${esc(r.name)}</span><span class="v">${Math.round(byRegion[r.id]||0)} <small>${UNIT()}</small></span></div>`).join("")}
    <p class="eyebrow spaced">Markers by kind</p>
    ${KIND_KEYS.filter(k=>counts[k]).map(k=>`<div class="stat"><span class="k">${KINDS[k].label}</span><span class="v">${counts[k]}</span></div>`).join("")||`<p class="empty-note">None yet.</p>`}
    ${planOf ? (()=>{
      const prov = planProvides(planOf) || {};
      const outer = root;
      const parent = outer ? (outer.nodes||[]).find(x=>x.id===planOf) : null;
      const have = (parent && parent.services) || {};
      const drawn = Object.keys(prov);
      const missing = drawn.filter(k=>!have[k]);
      const claimed = Object.keys(have).filter(k=>have[k] && !prov[k]);
      const peopled = (doc.nodes||[]).filter(n=>n.premises).length;
      return `<p class="eyebrow">What's drawn here</p>
        <div class="stat"><span class="k">Premises with somebody in them</span><span class="v">${peopled} <small>of ${(doc.nodes||[]).length}</small></span></div>
        <div class="stat"><span class="k">Services sited</span><span class="v">${drawn.length}</span></div>
        ${drawn.length?`<p class="empty-note" style="margin:6px 0 10px">${drawn.map(k=>esc(k)+(prov[k]>1?` ×${prov[k]}`:"")).join(" · ")}</p>`:""}
        ${missing.length?`<p class="warn">Drawn here but not ticked on the place itself: <b>${missing.map(esc).join(", ")}</b>
          <button class="btn wide" id="pl-sync" style="margin-top:8px">Tick them on ${esc(planParentName())}</button></p>`:""}
        ${claimed.length?`<p class="warn">${esc(planParentName())} claims <b>${claimed.map(esc).join(", ")}</b>, with nowhere drawn for ${claimed.length===1?"it":"them"}.</p>`:""}
        <div class="hr"></div>`;
    })() : ""}
    <p class="eyebrow spaced">What it's worth</p>
    ${(()=>{ const w = surveyWorth(); return `
      <div class="stat"><span class="k">Experience in the map</span><span class="v">${w.total}</span></div>
      <div class="stat"><span class="k">From the road</span><span class="v">${w.roadXP} <small>≈${w.enc} encounters</small></span></div>
      <div class="stat"><span class="k">From ${w.sites} site${w.sites===1?"":"s"}</span><span class="v">${w.siteXP} <small>≈${w.foes} foes</small></span></div>
      <div class="stat"><span class="k">Allowed for contract work</span><span class="v">${w.questXP} <small>${w.boards} boards</small></span></div>
      ${(()=>{
        let coin=0, goods=0, lb=0, empty=0;
        for(const nd of doc.nodes){
          if(!nd.site||nd.gate) continue;
          const reg=doc.regions.find(r=>r.id===nd.region);
          const lw=lootWorth(nd.site,(reg&&reg.threat)||1);
          coin+=lw.coin*(nd.site.waves||1>1?1:1); goods+=lw.goods; lb+=lw.lb;
          if(!lw.total) empty++;
        }
        if(!doc.nodes.some(nd=>nd.site)) return "";
        return `<div class="stat"><span class="k">Coin lying in the sites</span><span class="v">${cpStr(coin)}</span></div>
          <div class="stat"><span class="k">Goods in the sites</span><span class="v">${cpStr(goods)} <small>${Math.round(lb)} lb</small></span></div>
          ${empty?`<p class="warn"><b>${empty}</b> site${empty===1?" has":"s have"} nothing to carry out.</p>`:""}`;
      })()}
      <div class="worth"><div>
        ${w.supports.map(x=>`Level ${x.lv} cap → curve ×${x.mult}${x.mult<1?` <b style="color:var(--lead)">too thin</b>`:""}`).join("<br>")}
      </div></div>
      <p class="empty-note" style="margin-top:-4px">A curve below ×1 means the map holds less than the book expects — either lower the cap or lay more road. The game works this out for itself; this is only so you can see it while you draw.</p>`; })()}

    <p class="eyebrow spaced">Wants attention</p>
    ${warns.length?warns.map(w=>`<p class="warn">${w}</p>`).join(""):`<p class="allclear">Survey is consistent.</p>`}`;
}

function renderRegions(){
  $("#pane-regions").innerHTML = `
    <p class="eyebrow">Regions & threat</p>
    ${doc.regions.map((r,i)=>`<div class="regrow">
      <span class="swatch" style="background:${r.hex}"></span>
      <input class="nm" data-ri="${i}" data-f="name" type="text" value="${esc(r.name)}">
      <input class="th mono" data-ri="${i}" data-f="threat" type="number" min="1" max="9" value="${r.threat}">
    </div>`).join("")}
    <p class="empty-note" style="margin-top:12px">Threat sets the level you want before walking in, and feeds the encounter tables.</p>
    <button class="btn wide" id="addRegion" style="margin-top:14px">Add a region</button>
    <p class="eyebrow spaced">How often the road interrupts</p>
    ${(()=>{ const sp=solveSpacing(); return `
      <div class="field"><label>Encounters on an average leg</label>
        <input id="encPerLeg" class="mono" type="number" step="0.05" min="0" max="8" value="${doc.encPerLeg ?? 1}"></div>
      <div class="field"><label>How even the spacing is</label>
        <input id="gapSpread" class="mono" type="number" step="0.1" min="0" max="1.9" value="${doc.gapSpread ?? 1.2}"></div>
      <p class="empty-note" style="margin:-4px 0 10px">${
        (doc.gapSpread ?? 1.2) < 0.5 ? "Almost metronomic — a player will feel the rhythm."
        : (doc.gapSpread ?? 1.2) > 1.6 ? "Very uneven. Long empty stretches, then two at once."
        : "Reads as authored without being predictable."}</p>
      <div class="stat"><span class="k">Solved gap</span><span class="v">${sp.gapMin} – ${(sp.gapMin+sp.gapSpan).toFixed(2)} <small>${doc.unit||"mi"}</small></span></div>
      <div class="stat"><span class="k">Which gives</span><span class="v">${sp.perLeg} <small>per ordinary leg</small></span></div>
      ${sp.namedLegs?`<div class="stat"><span class="k">Named as exceptions</span><span class="v">${sp.namedLegs} <small>road${sp.namedLegs===1?"":"s"}</small></span></div>
      <div class="stat"><span class="k">Whole map</span><span class="v">${sp.perLegAll} <small>per leg · ${sp.perMile} per ${doc.unit||"mile"}</small></span></div>`
      :`<div class="stat"><span class="k">Per ${doc.unit||"mile"}</span><span class="v">${sp.perMile}</span></div>`}
      <div class="stat"><span class="k">Across the map</span><span class="v">≈${sp.total} <small>over ${sp.legs} legs</small></span></div>
      ${sp.roads.length?`<p class="empty-note" style="margin-top:8px">Longest leg sees ≈${
        Math.max(...sp.roads.map(r=>r.expected))}, shortest ≈${Math.min(...sp.roads.map(r=>r.expected))}. A leg under half is a road where nothing usually happens.</p>`:""}
    `; })()}

    <p class="eyebrow spaced">Reckoning the sheet</p>
    <p class="empty-note" style="margin-bottom:10px">A stone bears its road-distance from the old capital and the quarter it lies in — <span class="mono">22N</span>, <span class="mono">27SW</span>. Held numbers stay put, so a region whose stones lie keeps its lie.</p>
    <div class="field"><label>Compass</label><select id="compassSel">
      <option value="4" ${doc.compass===4?"selected":""}>4 points — N E S W</option>
      <option value="8" ${(doc.compass||8)===8?"selected":""}>8 points — adds NE SE SW NW</option>
      <option value="16" ${doc.compass===16?"selected":""}>16 points — adds NNE, ENE…</option>
    </select></div>
    <button class="btn wide" id="renumber">Number the stones from the datum</button>
    <button class="btn wide" id="remeasure">Re-measure roads from the plot</button>
    <button class="btn wide" id="replot">Re-plot markers to their mileage</button>`;

  $("#pane-regions").querySelectorAll("[data-ri]").forEach(inp=>{
    inp.oninput = e=>{
      const r = doc.regions[+e.target.dataset.ri];
      if(e.target.dataset.f==="threat") r.threat = Math.max(1,Math.min(9,+e.target.value||1));
      else r.name = e.target.value;
      touch();
    };
  });
  $("#addRegion").onclick = ()=>{
    doc.regions.push({ id:uid("r"), name:"New region", threat:1, hex:REGION_HEX[doc.regions.length%REGION_HEX.length], notes:"" });
    touch(); renderRegions();
  };
  $("#compassSel").onchange = e=>{ doc.compass = +e.target.value; touch(); renderRegions(); };
  const sync = $("#pl-sync");
  if(sync) sync.onclick = ()=>{
    const outer = root;
    const parent = outer ? (outer.nodes||[]).find(x=>x.id===planOf) : null;
    if(!parent) return;
    const prov = planProvides(planOf) || {};
    parent.services = parent.services || {};
    let n = 0;
    for(const k of Object.keys(prov)) if(!parent.services[k]){ parent.services[k] = 1; n++; }
    markDirty(K_SURVEY);
    touch(); renderPane(true);
    flash(`${n} service${n===1?"":"s"} ticked on ${parent.name||"the place"}.`);
  };
  numField($("#encPerLeg"), { min:0, max:8,
    get:()=>doc.encPerLeg ?? 1, set:v=>{ doc.encPerLeg = v; }, done:()=>renderPane(true) });
  numField($("#gapSpread"), { min:0, max:1.9,
    get:()=>doc.gapSpread ?? 1.2, set:v=>{ doc.gapSpread = v; }, done:()=>renderPane(true) });
  $("#renumber").onclick = numberTheStones;
  $("#remeasure").onclick = recomputeAll;
  $("#replot").onclick = replotFromMiles;
}

function renderData(){
  const here = doc.libId;
  $("#pane-data").innerHTML = `
        ${(()=>{
      /* A plan that has markers and no outlines at all usually means
         something removed them. Offer the ground back. */
      const thin = Object.keys(plans).filter(k =>
        (plans[k].nodes||[]).length > 3 && !(plans[k].shapes||[]).some(s => s.closed));
      if(!thin.length) return "";
      const names = thin.map(k => { const n = root.nodes.find(x=>x.id===k);
        return esc((n&&n.name) || "a plan"); });
      return `<p class="warn">${names.join(", ")} ${thin.length===1?"has":"have"} buildings but no squares or greens drawn.
        If something removed them, the <b>Square</b> form under Draw puts one back in a drag.</p>`;
    })()}
    <p class="eyebrow">If something looks wrong</p>
    <p class="empty-note" style="margin:0 0 9px">If the screen is drawing a town's shapes over the survey's markers, or the other way about, this puts everything back on the survey. Nothing is lost — every town plan stays where it is.</p>
    <button class="btn wide" id="d-surface">Back to the survey</button>
    <div class="hr"></div>
    <p class="eyebrow">The shelf</p>
    ${!USE_IDB ? `<p class="empty-note">This browser won't hold more than one survey, so the shelf is unavailable. Export anything you want to keep.</p>`
    : shelf.length ? shelf.map(m=>`
      <div class="shelfrow ${m.id===here?"on":""}">
        <div class="sname">${esc(m.name)}${m.id===here?`<span class="tag lead">open</span>`:""}
          <span class="smeta">${m.places} place${m.places===1?"":"s"} · ${m.roads} road${m.roads===1?"":"s"} · ${m.miles} ${esc(m.unit)}${m.plans?` · ${m.plans} plan${m.plans===1?"":"s"}`:""}${m.saved?` · ${esc(m.saved.slice(0,16).replace("T"," "))}`:""}</span></div>
        <div class="sacts">
          ${m.id===here?"":`<button class="pb" data-shelf-load="${esc(m.id)}">take down</button>`}

          <button class="pb drop" data-shelf-forget="${esc(m.id)}">×</button>
        </div>
      </div>`).join("")
    : `<p class="empty-note">Nothing on the shelf yet. Anything you replace gets put here automatically, so you can't lose a map by accident.</p>`}
    ${USE_IDB ? `<button class="btn wide" id="d-shelve">${here?"Save this one to the shelf":"Put this one on the shelf"}</button>
    ${here?`<button class="btn wide" id="d-shelve-copy">Save as a separate copy</button>`:""}` : ""}

    <button class="btn wide" id="d-import">Load a survey.json</button>

    <textarea id="jsonOut" spellcheck="false" placeholder="Paste exported JSON here, then load it."></textarea>
    <button class="btn wide" id="d-paste" style="margin-top:7px">Load from the box</button>
    <button class="btn wide" id="d-show">Show current survey in the box</button>

    <button class="btn wide danger" id="d-clear">Start a new survey</button>
    <p class="empty-note" style="margin-top:12px">Autosave keeps your work between visits, but export before anything you'd hate to redo.</p>`;

  $("#d-title").oninput = e=>{ doc.title=e.target.value; touch(); };
  $("#d-download").onclick = ()=>{
    const a = document.createElement("a");

  $("#d-paste").onclick = ()=>loadJSON($("#jsonOut").value);
  $("#d-show").onclick = ()=>{ $("#jsonOut").value = JSON.stringify(exportBundle(),null,2); };
  $("#d-clear").onclick = async ()=>{
    if(!confirm("Start a new survey?\n\nThis one goes on the shelf first, so you can take it down again.")) return;
    await shelveBeforeReplacing();
    leavePlanAll();
    for(const k of Object.keys(plans)) delete plans[k];
    setRoot(blankDoc()); sel=null; rule=null; draft=null; formDrag=null;
    touch(); centreView(); renderPane(true);
    flash("New survey. The old one is on the shelf.");
  };

  const surf = $("#d-surface");
  if(surf) surf.onclick = ()=>{
    surfaceToSurvey(); centreView(); render(); renderPane(true);
    flash("Back on the survey.");
  };

  const sh = $("#d-shelve");
  if(sh) sh.onclick = async ()=>{
    const name = prompt("Call it what?", doc.title || "Untitled");
    if(name === null) return;
    doc.title = name.trim() || doc.title;
    const id = await shelveCurrent(name);
    renderPane(true);
    flash(id ? "On the shelf." : "Couldn't shelve it — export instead.");
  };
  const shc = $("#d-shelve-copy");
  if(shc) shc.onclick = async ()=>{
    const name = prompt("Call the copy what?", (doc.title||"Untitled") + " (copy)");
    if(name === null) return;
    const id = await shelveCurrent(name, true);
    renderPane(true);
    flash(id ? "Copied to the shelf." : "Couldn't shelve it — export instead.");
  };

  $("#pane-data").querySelectorAll("[data-shelf-load]").forEach(b=>b.onclick = async e=>{
    const id = e.currentTarget.dataset.shelfLoad;
    const m = shelf.find(x=>x.id===id);
    if(!confirm(`Take down "${m?m.name:"that map"}"?\n\nWhat's open now goes on the shelf first.`)) return;
    const ok = await loadFromShelf(id);
    renderPane(true); render();
    flash(ok ? `${m?m.name:"Map"} is open.` : "Couldn't read that one.");
  });
  $("#pane-data").querySelectorAll("[data-shelf-rename]").forEach(b=>b.onclick = async e=>{
    const id = e.currentTarget.dataset.shelfRename;
    const m = shelf.find(x=>x.id===id);
    const name = prompt("Call it what?", m ? m.name : "");
    if(name === null) return;
    await renameOnShelf(id, name);
    if(doc.libId === id){ doc.title = name.trim() || doc.title; touch(); }
    renderPane(true);
  });
  $("#pane-data").querySelectorAll("[data-shelf-forget]").forEach(b=>b.onclick = async e=>{
    const id = e.currentTarget.dataset.shelfForget;
    const m = shelf.find(x=>x.id===id);
    if(!confirm(`Forget "${m?m.name:"that map"}"?\n\nThis one can't be undone.`)) return;
    await forgetFromShelf(id);
    renderPane(true);
    flash("Off the shelf.");
  });
}

$("#fileIn").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{ loadJSON(rd.result); e.target.value=""; };
  rd.readAsText(f);
});
async function loadJSON(text){
  await shelveBeforeReplacing();
  return loadJSONNow(text);
}
function loadJSONNow(text){
  let d;
  try{ d = JSON.parse(text); } catch(err){ flash("That isn't valid JSON."); return; }
  if(!d||!Array.isArray(d.nodes)||!Array.isArray(d.roads)){ flash("No nodes and roads in that file."); return; }
  leavePlan();                     // never load in on top of a plan
  setRoot({ format:"ordinate-survey-v1", title:d.title||"Untitled survey", ppm:d.ppm||10, compass:d.compass||8,
          unit:d.unit||"mi",
          regions:(Array.isArray(d.regions)&&d.regions.length)?d.regions:DEFAULT_REGIONS.map(r=>({...r})),
          nodes:d.nodes, roads:d.roads, shapes:Array.isArray(d.shapes)?d.shapes:[] });
  for(const k in plans){ delete plans[k]; markDirty(K_PLAN(k)); }
  let np = 0;
  if(d.plans && typeof d.plans==="object")
    for(const k in d.plans){
      if(!d.nodes.some(n=>n.id===k)) continue;              // drop plans with no marker
      plans[k] = normaliseDoc(d.plans[k]); markDirty(K_PLAN(k)); np++;
    }
  $("#ppm").value = doc.ppm;
  sel=null; rule=null; touch(); centreView(); renderCrumb();
  flash(`Loaded ${doc.nodes.length} markers, ${doc.roads.length} roads${np?`, ${np} plan${np===1?"":"s"}`:""}.`);
}
$("#ppm").addEventListener("input", e=>{
  doc.ppm = Math.max(1, Math.min(80, +e.target.value||10)); render(); touch();
});

/* ══════════════════════════════════════════════════════════════
   SAVE
   ══════════════════════════════════════════════════════════════ */
function flash(msg){
  const el = $("#saveState");
  el.textContent = msg; el.className = "ok";
  clearTimeout(flashTimer);
  flashTimer = setTimeout(()=>{ flashTimer=null; setSaved(); }, 2200);
}
function setSaved(){
  const el = $("#saveState");
  el.textContent = storageOK ? "saved" : "export to keep";
  el.className = storageOK ? "" : "warn";
}
function touch(){
  pushUndo();
  render();
  markDirty(currentKey());
  if(!flashTimer){ const el=$("#saveState"); el.textContent="saving…"; el.className=""; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ save().catch(()=>{}); }, 700);
}
/* ══════════════════════════════════════════════════════════════
   THE STRONGROOM — IndexedDB, so the survey can hold as many
   town plans as you care to draw

   window.storage caps a value at about 5MB, and a survey with a
   dozen drawn towns will pass that. IndexedDB is effectively
   unbounded. Everything moves across once, with a verify-before-
   delete handshake: write to IDB, read it back, compare — only a
   proven copy releases the original. Any failure at any point
   leaves the app running exactly as it did before.

   The survey and each town plan get their own key, so opening one
   town doesn't drag every other town's streets into memory.
   ══════════════════════════════════════════════════════════════ */
const DB_NAME = "ordinate-survey", STORE = "kv";
const K_SURVEY = "survey", K_PLAN = id=>"plan:"+id, MIGKEY = "ordinate-idb-v1";
let USE_IDB = false, _idbConn = null;

function idbOpen(){
  if(_idbConn) return _idbConn;
  _idbConn = new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = ()=>r.result.createObjectStore(STORE);
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>{ _idbConn=null; rej(r.error); };
  });
  return _idbConn;
}
const idbGet = k=>idbOpen().then(db=>new Promise((res,rej)=>{
  const t = db.transaction(STORE,"readonly").objectStore(STORE).get(k);
  t.onsuccess=()=>{ const v=t.result; if(v==null) return res(null);
    try{ res(typeof v==="string"?JSON.parse(v):v); }catch(err){ res(null); } };
  t.onerror=()=>rej(t.error);
}));
const idbSet = (k,v)=>idbOpen().then(db=>new Promise((res,rej)=>{
  const tx = db.transaction(STORE,"readwrite"); tx.objectStore(STORE).put(JSON.stringify(v),k);
  tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);
}));
const idbDel = k=>idbOpen().then(db=>new Promise((res,rej)=>{
  const tx = db.transaction(STORE,"readwrite"); tx.objectStore(STORE).delete(k);
  tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
}));
const idbKeys = ()=>idbOpen().then(db=>new Promise((res,rej)=>{
  const t = db.transaction(STORE,"readonly").objectStore(STORE).getAllKeys();
  t.onsuccess=()=>res(t.result||[]); t.onerror=()=>rej(t.error);
}));

/* the older single-value store, kept as a fallback and a source to move from */
async function legacyGet(){
  try{ const r = await window.storage.get("ordinate-survey"); return r&&r.value ? r.value : null; }
  catch(err){ return null; }
}
async function legacySet(v){
  try{ await window.storage.set("ordinate-survey", v); return true; }catch(err){ return false; }
}
async function legacyDel(){ try{ await window.storage.delete("ordinate-survey"); }catch(err){} }

/* Verify before delete: write to IDB, read it back, compare — only a proven
   copy releases the original. If IDB already holds a survey it is the newer
   of the two, so the old copy is simply dropped rather than allowed to
   overwrite it. That matters because the marker below lives in localStorage,
   which isn't always available; without this guard a stale copy could clobber
   good data on every boot. */
async function migrateToIdb(){
  const existing = await idbGet(K_SURVEY);
  const raw = await legacyGet();
  if(raw && !existing){
    const parsed = JSON.parse(raw);
    await idbSet(K_SURVEY, parsed);
    if(JSON.stringify(await idbGet(K_SURVEY)) !== JSON.stringify(parsed))
      throw new Error("idb verify failed");        // leaves the old copy untouched
    await legacyDel();                             // proven copy — release the original
  } else if(raw && existing){
    await legacyDel();                             // IDB is authoritative
  }
  USE_IDB = true;
  try{ localStorage.setItem(MIGKEY,"1"); }catch(err){}
}

/* writes are coalesced per key: one in flight, one trailing for anything
   that changed while it was going */
const _dirty = new Set();
let _saving = false;
async function pump(){
  if(_saving || !_dirty.size) return;
  _saving = true;
  const keys = [..._dirty]; _dirty.clear();
  let bad = false;
  for(const k of keys){
    const val = k===K_SURVEY ? doc : plans[k.slice(5)];
    if(val===undefined){ try{ await idbDel(k); }catch(err){ bad=true; } continue; }
    try{
      if(USE_IDB) await idbSet(k, val);
      else if(k===K_SURVEY) bad = !(await legacySet(JSON.stringify(bundleForLegacy())));
      else _dirty.add(K_SURVEY);                   // no IDB: fold plans into the one blob
    }catch(err){ bad = true; }
  }
  storageOK = !bad;
  _saving = false;
  if(_dirty.size) return pump();
  if(!flashTimer) setSaved();
}
function markDirty(key){ _dirty.add(key); }
async function save(){ markDirty(currentKey()); return pump().catch(()=>{ storageOK=false; }); }
function currentKey(){ return planOf ? K_PLAN(planOf) : K_SURVEY; }

/* without IDB there's only one slot, so everything travels together */
function bundleForLegacy(){ return exportBundle(); }
/* what leaves the app: the survey with every drawn plan folded in */
function exportBundle(){
  /* Always the survey with every plan folded in, wherever you happen to
     be standing. `root` is the survey by construction, so there is
     nothing to work out and nothing to get wrong. */
  return Object.assign({}, root, { plans });
}

async function boot(){
  buildRail(); syncTabs();
  let loaded = null;
  const wasMigrated = (()=>{ try{ return localStorage.getItem(MIGKEY)==="1"; }catch(err){ return false; } })();
  try{
    if("indexedDB" in window){
      if(wasMigrated){
        const d = await idbGet(K_SURVEY);
        if(d && Array.isArray(d.nodes)){ loaded = d; USE_IDB = true; }
        else { await migrateToIdb(); loaded = await idbGet(K_SURVEY); }
      } else {
        await migrateToIdb();
        loaded = await idbGet(K_SURVEY);
      }
      /* pull every town plan alongside it */
      if(USE_IDB){
        for(const k of await idbKeys()){
          if(typeof k==="string" && k.startsWith("plan:")){
            const pl = await idbGet(k);
            if(pl) plans[k.slice(5)] = pl;
          }
        }
      }
      try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(err){}
    }
  }catch(err){ USE_IDB = false; }                  // anything unexpected: stay on the old store

  if(!loaded){                                     // legacy path, unchanged behaviour
    try{
      const raw = await legacyGet();
      if(raw){ const d = JSON.parse(raw); if(d && Array.isArray(d.nodes)) loaded = d; }
    }catch(err){}
  }
  await refreshShelf();
  if(loaded){
    if(loaded.plans){ Object.assign(plans, loaded.plans); delete loaded.plans; }
    setRoot(loaded);
  }
  centreView(); renderCrumb(); resetHist();
  $("#saveState").textContent = doc.nodes.length ? "saved" : "new survey";
}
boot();

/* ── installed as an app ──────────────────────────────────────
   Registered only over HTTPS, so a local `python3 -m http.server`
   session has no cache to fight while you're editing. */
if("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("./sw.js", { updateViaCache:"none" })
    .then(reg=>{ reg.update(); setInterval(()=>{ try{ reg.update(); }catch(err){} }, 30*60*1000); })
    .catch(()=>{});
}

/* A survey is hours of work held in this browser. Warn before a reload
   or a closed tab loses anything that hasn't reached storage yet. */
addEventListener("beforeunload", e=>{
  if(_dirty.size || _saving){ e.preventDefault(); e.returnValue = ""; }
});
addEventListener("pagehide", ()=>{ try{ pump(); }catch(err){} });
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "hidden"){ try{ pump(); }catch(err){} }
});
window.addEventListener("resize", ()=>{ render(); if(placing) positionPop(); });
</script>
