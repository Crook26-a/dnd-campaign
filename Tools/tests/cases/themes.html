// uses: nothing
<script>
/* themed rolling: GEN_THEMES_DATA by theme (neutral fits anywhere), the campaign's mix (root.themeMix), a roll's own
   Theme, the Roll tab's controls, and the old GEN_* lists still holding every theme together */
setTimeout(async ()=>{ const wait = ms => new Promise(r=>setTimeout(r, ms)); const out=[]; const txt = el => el ? el.innerText.replace(/\s+/g,' ').trim() : 'none';
 try{
  loadJSONNow(JSON.stringify({ format:"ordinate-survey-v1", title:"Theme Test", ppm:10, unit:"mi", party:3, nodes:[], roads:[], shapes:[] })); await wait(200);
  const D = GEN_THEMES_DATA;
  out.push('themes: ' + Object.keys(D).join(', '));
  out.push('every list is a list: ' + Object.values(D).every(t=>THEME_TABLES.every(k=>Array.isArray(t[k])) && ['enemy','neutral','ally'].every(d=>Array.isArray(t.wants[d]))));
  out.push('GEN_FAMILY has every theme: ' + (GEN_FAMILY.length >= Object.values(D).reduce((a, t)=>Math.max(a, t.family.length), 0)) + ', has Tidewell ' + GEN_FAMILY.includes('Tidewell') + ', GEN_WANTS.enemy ' + (GEN_WANTS.enemy.length > 50));
  const inTheme = (theme, g) => { const T = themeTables(theme), fam = g.name.split(' ').pop(); return T.family.includes(fam) && (!g.look || T.look.includes(g.look) || true) && T.secret.includes(g.secret || T.secret[0]); };
  const roll = (n, over) => { const r = []; for(let i=0; i<n; i++) r.push(genPerson({ type:'Humanoid', species:'Human', ...(over||{}) })); return r; };
  /* the campaign set to gothic */
  root.themeMix = { mode:'mix', w:{ gothic:100 } };
  let r = roll(40); out.push('gothic campaign: themes ' + [...new Set(r.map(g=>g.theme))].join(',') + ', surnames all gothic or neutral ' + r.every(g=>themeTables('gothic').family.includes(g.name.split(' ').pop())) + ', any nautical surname ' + r.some(g=>D.nautical.family.includes(g.name.split(' ').pop())));
  out.push('  backstories from gothic+neutral ' + r.every(g=>{ const T = themeTables('gothic'); return T.origin.some(o=>g.backstory.toLowerCase().startsWith(o.toLowerCase().slice(0, 12))); }) + ', e.g. ' + r[0].name + ': ' + r[0].backstory.slice(0, 80));
  /* a 70/30 mix over a big crowd */
  root.themeMix = { mode:'mix', w:{ gothic:70, courtly:30 } };
  r = roll(400); const n = t => r.filter(g=>g.theme===t).length;
  out.push('70/30 mix of 400: gothic ' + n('gothic') + ', courtly ' + n('courtly') + ', other ' + (400 - n('gothic') - n('courtly')) + ' (about right: ' + (n('gothic') > 240 && n('gothic') < 320) + ')');
  /* neutral only, any, and a roll's own Theme */
  root.themeMix = { mode:'neutral' }; r = roll(30); out.push('neutral only: ' + [...new Set(r.map(g=>g.theme))].join(',') + ', surnames all neutral ' + r.every(g=>D.neutral.family.includes(g.name.split(' ').pop())));
  root.themeMix = { mode:'any' }; r = roll(120); out.push('any: ' + new Set(r.map(g=>g.theme)).size + ' themes seen');
  root.themeMix = { mode:'mix', w:{ gothic:100 } }; r = roll(20, { theme:'nautical' }); out.push('roll override nautical: ' + [...new Set(r.map(g=>g.theme))].join(','));
  out.push('backstory with no theme (the Field Book): ' + (typeof genBackstory()==='string' && genBackstory().length > 20) + ', genderFirst without a theme ' + genderFirst('woman').length);
  /* the Roll tab: the Theme picker, the campaign's mix */
  root.themeMix = { mode:'any' }; pane = 'roll'; syncTabs(); document.getElementById('pane-roll').hidden = false; renderRoll(); await wait(40);
  const el = document.getElementById('pane-roll'), sel = el.querySelector('#gn-theme'), sec = el.querySelector('.themesec');
  out.push('roll tab: theme picker ' + !!sel + ' (' + (sel ? [...sel.options].map(o=>o.textContent).join(' / ') : '') + '), mix section ' + !!sec);
  sec.open = true; const mix = el.querySelector('[data-tmix="mode"][value="mix"]'); mix.checked = true; mix.dispatchEvent(new Event('change', { bubbles:true })); await wait(40);
  const g = document.getElementById('pane-roll').querySelector('[data-tmix="w"][data-k="gothic"]'); g.value = '60'; g.dispatchEvent(new Event('change', { bubbles:true })); await wait(40);
  const c = document.getElementById('pane-roll').querySelector('[data-tmix="w"][data-k="city"]'); c.value = '40'; c.dispatchEvent(new Event('change', { bubbles:true })); await wait(40);
  out.push('mix set from the tab: ' + JSON.stringify(root.themeMix) + ', summary ' + txt(document.querySelector('#pane-roll .themesec summary')));
  const s2 = document.querySelector('#pane-roll #gn-theme'); s2.value = 'rustic'; s2.dispatchEvent(new Event('change', { bubbles:true })); await wait(20);
  document.querySelector('#pane-roll [data-ract="person"]').click(); await wait(80);
  out.push('rolled from the tab with Rustic: theme ' + (genResult && genResult.theme) + ', card says ' + /rustic/.test(txt(document.querySelector('#pane-roll .pcsum'))));
 }catch(e){ out.push('ERR ' + e.message + ' ' + (e.stack||'').split('\n')[1]); }
 document.title = 'RES ' + out.join(' || ');
}, 900);
</script>
