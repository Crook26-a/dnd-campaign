// uses: nothing
<script>setTimeout(async ()=>{ const wait = ms => new Promise(r=>setTimeout(r, ms)); const out=[]; const txt = el => el ? el.innerText.replace(/\s+/g,' ').trim() : 'none';
 try{
  const bar = document.getElementById('cdBar'); out.push('bar hidden before ' + (bar && bar.hidden));
  /* set it up from the Players' screen panel */
  const ps = document.getElementById('pscreen'); ps.hidden = false; cdSecOpen = true; renderPScreen();
  const on = ps.querySelector('[data-cdf="on"]'); on.checked = true; on.dispatchEvent(new Event('change', { bubbles:true })); await wait(30);
  const tot = ps.querySelector('[data-cdf="total"]'); tot.value = '1:00'; tot.dispatchEvent(new Event('change', { bubbles:true })); await wait(30);
  ps.querySelector('[data-cd="badd"]').click(); await wait(20); ps.querySelector('[data-cd="badd"]').click(); await wait(20);
  const c = root.countdown; c.bells[0].at = 0; c.bells[0].label = 'The first bell'; c.bells[0].note = 'Guest one sleeps'; c.bells[1].label = 'The second bell'; c.bells[1].at = 30; renderPScreen();
  out.push('set up: total ' + c.total + ' left ' + c.left + ' bells ' + c.bells.map(b=>b.at + ':' + b.label).join(', '));
  out.push('panel: ' + txt(ps.querySelector('.cdsec')).slice(0, 60));
  ps.querySelector('[data-cd="go"]').click(); await wait(1300);
  out.push('running ' + cdRunning(c) + ', bar ' + txt(bar).replace(/59:59|1:00:00/, 'about 1:00:00') + ', bell 1 rung ' + c.bells[0].rung + ', bell 2 rung ' + c.bells[1].rung + ', banner: ' + txt(document.getElementById('cdbanner')));
  c.endsAt -= 31*60000; await wait(1200);
  out.push('31 min later: bell 2 rung ' + c.bells[1].rung + ', banners ' + document.querySelectorAll('#cdbanner .cdb').length);
  bar.querySelector('.cd-go').click(); await wait(50); const lp = c.left;
  out.push('paused: running ' + cdRunning(c) + ', left about ' + Math.round(lp/60) + ' min, bar ' + txt(bar));
  ps.querySelector('[data-cd="add"][data-m="5"]').click(); await wait(30); out.push('+5 min: left ' + Math.round(c.left - lp) + ' s more');
  const pay = cdForPlayers(); out.push('for the TV: ' + JSON.stringify({ title:pay.title, endsAt:pay.endsAt, left:Math.round(pay.left/60) }));
  ps.querySelector('[data-cd="go"]').click(); await wait(30); c.endsAt = Date.now() + 400; await wait(8000);
  out.push('at zero: done ' + !!c.done + ', left ' + c.left + ', running ' + cdRunning(c) + ', bar ' + txt(bar) + ', last banner: ' + txt([...document.querySelectorAll('#cdbanner .cdb')].pop()));
  ps.querySelector('[data-cd="reset"]').click(); await wait(30); out.push('reset: left ' + c.left + ', bells rung ' + c.bells.filter(b=>b.rung).length + ', done ' + !!c.done);
  /* the TV side, fed by hand */
  cdPlayerWire(); window.postMessage({ ordinate:'countdown', cd:{ title:'Before the last bell', endsAt:Date.now() + 45000, left:45, done:'' } }, '*'); await wait(400);
  const pv = document.getElementById('pvcd'); out.push('TV: hidden ' + pv.hidden + ', ' + txt(pv).replace(/0:4[45]\b/, 'about 0:45') +', low ' + pv.classList.contains('low') + ', last ' + pv.classList.contains('last'));
  window.postMessage({ ordinate:'countdown', cd:{ title:'', endsAt:null, left:1500, done:'' } }, '*'); await wait(400); out.push('TV paused: ' + txt(pv) + ', low ' + pv.classList.contains('low'));
  window.postMessage({ ordinate:'cd-bell', label:'The third bell', ms:500 }, '*'); await wait(200); out.push('TV bell: ' + document.getElementById('pvbell').classList.contains('on') + ' ' + txt(document.getElementById('pvbell')));
  /* what their screen shows: the in-game time (start + minutes per real minute, or worked out from the time at zero), real time up / down / hidden */
  const chg = (sel, v) => { const el = ps.querySelector(sel); if(el.type==='checkbox') el.checked = v; else el.value = v; el.dispatchEvent(new Event('change', { bubbles:true })); };
  chg('[data-cdf="gameShow"]', true); await wait(30); chg('[data-cdf="gameStart"]', '9:30 pm'); await wait(30); chg('[data-cdf="gameEnd"]', '12:00 am'); await wait(30);
  out.push('in-game: start ' + c.gameStart + ' rate ' + cdRate(c).toFixed(3) + ' at zero ' + ps.querySelector('[data-cdf="gameEnd"]').value + ', bar ' + txt(bar));
  chg('[data-cdf="gameRate"]', '1'); await wait(30); out.push('rate 1: at zero ' + ps.querySelector('[data-cdf="gameEnd"]').value);
  /* fitting the time you have: the story's start and end stay, the bells keep their story times */
  chg('[data-cdf="gameStart"]', '9:30 pm'); await wait(30); chg('[data-cdf="gameEnd"]', '12:00 am'); await wait(30);
  const bellIn = i => ps.querySelectorAll('[data-cdb="at"]')[i];
  const setBell = async (i, v) => { const el = bellIn(i); el.value = v; el.dispatchEvent(new Event('change', { bubbles:true })); await wait(30); };
  await setBell(0, '10:00 pm'); await setBell(1, '11:00 pm');
  const bells = () => c.bells.slice().sort((a, b)=>a.at-b.at).map(b=>Math.round(b.at) + 'min=' + cdBellShow(c, b)).join(', ');
  out.push('length 1:00: rate ' + cdRate(c).toFixed(3) + ', bells ' + bells());
  chg('[data-cdf="total"]', '1:45'); await wait(30); out.push('length 1:45: rate ' + cdRate(c).toFixed(3) + ', bells ' + bells() + ', ends ' + ps.querySelector('[data-cdf="gameEnd"]').value);
  const soon = new Date(Date.now() + 50*60000); chg('[data-cdf="finishBy"]', soon.getHours() + ':' + String(soon.getMinutes()).padStart(2,'0')); await wait(30);
  out.push('finish by, not started: ' + /^Press Start and it fits/.test(document.getElementById('cd-ps-end').textContent));
  ps.querySelector('[data-cd="go"]').click(); await wait(60);
  out.push('started: length about 50 min ' + (Math.abs(c.total/60 - 50) < 1.5) + ', bells ' + bells() + ', story now ' + cdGameNow(c) + ', end line ' + /^Ends at/.test(document.getElementById('cd-ps-end').textContent));
  c.endsAt -= 10*60000; await wait(1200); const now1 = cdGameNow(c);
  ps.querySelector('[data-cd="add"][data-m="-5"]').click(); await wait(60);
  out.push('10 min in, then -5: story before ' + now1 + ' after ' + cdGameNow(c) + ', length about 45 ' + (Math.abs(c.total/60 - 45) < 1.5) + ', bells still to ring ' + c.bells.filter(b=>!b.rung).map(b=>cdBellShow(c, b)).join(', ') + ', at zero ' + cdGameClock(Math.round(cdGameMin(c, c.total))));
  ps.querySelector('[data-cd="go"]').click(); await wait(30); delete c.finishBy;
  chg('[data-cdf="realShow"]', 'up'); await wait(30); const p2 = cdForPlayers(); out.push('payload: real ' + p2.real + ' game ' + p2.game + ' story now ' + cdGameClock(p2.gameStart + p2.gameRate*((p2.total - p2.left)/60)));
  window.postMessage({ ordinate:'countdown', cd:{ title:'Until midnight', endsAt:null, left:2700, total:3600, done:'', real:'up', game:true, gameStart:1290, gameRate:2.5 } }, '*'); await wait(400);
  out.push('TV both, counting up: ' + txt(pv) + ', both ' + pv.classList.contains('both'));
  window.postMessage({ ordinate:'countdown', cd:{ title:'', endsAt:null, left:2700, total:3600, done:'', real:'off', game:true, gameStart:1290, gameRate:2.5 } }, '*'); await wait(400);
  out.push('TV in-game only: ' + txt(pv) + ', both ' + pv.classList.contains('both'));
  window.postMessage({ ordinate:'countdown', cd:{ title:'', endsAt:null, left:2700, total:3600, done:'', real:'down', game:false } }, '*'); await wait(400);
  out.push('TV real only: ' + txt(pv));
  window.postMessage({ ordinate:'countdown', cd:null }, '*'); await wait(400); out.push('TV off: hidden ' + pv.hidden);
  out.push('log: ' + gameLogList().filter(l=>l.kind==='clock').map(l=>l.text.replace(/started: 4\d:\d\d to go/, 'started: about 50 min to go')).join(' / '));
 }catch(e){ out.push('THREW ' + e.message + ' ' + (e.stack||'').split('\n')[1]); }
 document.title = 'RES ' + (__ERR.length?'ERR '+__ERR.join(' | ')+' · ':'') + out.join(' || ');
},1500);</script>
