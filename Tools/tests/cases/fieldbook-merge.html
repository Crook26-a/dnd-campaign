// uses: nothing
<script>
/* a person or item back from the Field Book (Joseph, 2026-10-29): one already here takes only what the phone edits.
   Its stages, stat block, rules and anything else the phone can't see stay as they are here, so an old phone copy
   (Corvin before his Masked Charm changed) can't undo them; something cleared on the phone is cleared here; a new one
   comes in whole */
const __FM = { format:"ordinate-survey-v1", title:"Merge Test", campaign:"Merge Test", ppm:10, unit:"mi", party:1,
  nodes:[{ id:"h", name:"House", kind:"town", x:0, y:0 }], roads:[], shapes:[], roster:[{ id:"pa", name:"Anna", level:5 }],
  library:{ npcs:[{ id:"ln_c", name:"Corvin", look:"Old and thin", voice:"Warm", campaign:"Merge Test",
      statBlock:{ name:"Corvin", act:[["Masked Charm (2/Day)", "NEW: Gracious Host or Enemies Abound"]] },
      stages:[{ id:"cv_host", name:"The host" }, { id:"cv_lich", name:"The lich", fightsAs:"lf_unlich" }], stageNow:"cv_host",
      effects:[], rules:[{ id:"rl_fury", when:[{ flag:"f_chandelier" }], stage:"cv_lich" }] }],
    foes:[], loot:[{ id:"ll_l", name:"Locket", charges:"3", notes:"here", campaign:"Merge Test", shopGood:false }], encounters:[], shops:[], factions:[] } };
setTimeout(async ()=>{ const wait = ms => new Promise(r=>setTimeout(r, ms)); const out = [];
 try{
  loadJSONNow(JSON.stringify(__FM)); await wait(300);
  /* the phone's copy: the look and voice edited, the voice then cleared, and an old stat block, old stages and an old lock */
  const pack = { format:"ordinate-fieldbook", version:1, campaign:"Merge Test",
    npcs:[{ id:"ln_c", name:"Corvin", look:"Old, thin, frost on his breath", campaign:"Merge Test",
      statBlock:{ name:"Corvin", act:[["Masked Charm (2/Day)", "OLD: Wisdom save only"]] },
      stages:[{ id:"cv_host", name:"The host" }], stageNow:"cv_host", effects:[{ id:"ef_charm", name:"Not desperate yet", lose:["Masked Charm"] }], rules:[] },
      { id:"ln_new", name:"Mara", look:"A maid", statBlock:{ name:"Commoner" }, campaign:"Merge Test" }],
    loot:[{ id:"ll_l", name:"Locket of the Stilled Heart", charges:"3", campaign:"Merge Test" }] };
  window.confirm = () => false; fieldBookIn(JSON.stringify(pack)); await wait(50);
  const c = lib().npcs.find(p=>p.id==="ln_c"), m = lib().npcs.find(p=>p.id==="ln_new"), l = lib().loot.find(x=>x.id==="ll_l");
  out.push('edited: look "' + c.look + '" · voice cleared ' + !("voice" in c));
  out.push('kept here: stat block ' + c.statBlock.act[0][1].slice(0, 4) + ' · stages ' + c.stages.map(s=>s.id).join(',') + ' · effects ' + c.effects.length + ' · rules ' + c.rules.length);
  out.push('new one whole: ' + (m ? m.name + ', stat block ' + (m.statBlock && m.statBlock.name) : 'missing'));
  out.push('item: ' + l.name + ' · notes cleared ' + !("notes" in l) + ' · shopGood kept ' + ("shopGood" in l));
 }catch(e){ out.push('ERR ' + e.message + ' ' + (e.stack||'').split('\n').slice(1, 3).join(' / ')); }
 document.title = 'RES ' + out.join(' || ');
}, 900);
</script>
