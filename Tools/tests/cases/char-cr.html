function refChar(cls, L){

  const c = { level:L, cls, hpMax:String(hp), hp:String(hp), attacks:[], spells:[], slots:[], res:[], ref:true };     // like the app's crRefChar: no familiar
  if(cls==="Fighter"){ c.ac = L >= 5 ? "18" : "16"; c.attacks = [{ name:"Greatsword", hit:"+" + (prof + pm), dmg:"2d6+" + pm }]; c.res = [{ name:"Action Surge", max:1, used:0 }]; }
  if(cls==="Rogue"){ c.ac = String(12 + pm); c.attacks = [{ name:"Rapier", hit:"+" + (prof + pm), dmg:"1d8+" + pm }]; }
  if(cls==="Wizard" || cls==="Cleric"){
    c.ac = cls==="Wizard" ? "13" : "18"; c.attacks = [{ name:cls==="Wizard" ? "Dagger" : "Mace", hit:"+" + (prof + 2), dmg:(cls==="Wizard" ? "1d4" : "1d6") + "+2" }];
    c.satk = "+" + (prof + pm); c.dc = String(8 + prof + pm);
    const sl = FULL_SLOTS[L - 1]; sl.forEach((n, i)=>{ c.slots[i + 1] = { max:n, used:0 }; });
    c.spells = SRD_SPELLS.filter(s=>new RegExp(cls).test(s.cls||"") && (+s.lv||0) <= sl.length).map(s=>s.id); }
  return c;
}
