// uses: nothing
<script>
/* tactics (Joseph, 2026-10-30): the dials worked out from stat blocks (Int: nearest / grudge / weakest / strongest;
   role; courage), the suggestion on an enemy's turn (grudge against distance, the weakest unless the strongest bears
   down, the strongest within 1.5 × its movement, Now CR for two rounds then damage dealt), would-flee, support, the
   dials on the card (a kind, this one only), the box in the action form, Target, and undo keeping the tallies */
const __TC = { format:"ordinate-survey-v1", title:"Tactics", ppm:10, unit:"mi", party:2,
  nodes:[{ id:"h", name:"Test House", kind:"town", x:0, y:0 }], roads:[], shapes:[],
  roster:[{ id:"pa", name:"Gawain", cls:"Fighter", level:5, hp:"53", hpMax:"53", ac:"17", str:20, attacks:[{ name:"Greatsword", hit:"+8", dmg:"2d6+5 + 2d6" }], res:[{ name:"Action Surge", max:1, used:0, rest:"short" }] },
    { id:"pb", name:"Wren", cls:"Wizard", level:5, hp:"20", hpMax:"28", ac:"12", attacks:[{ name:"Dagger", hit:"+4", dmg:"1d4+1" }] }],
  groups:[{ id:"g1", members:["pa","pb"], at:{ map:"h", node:"hall" } }],
  library:{ npcs:[], foes:[], loot:[], encounters:[], shops:[] },
  plans:{ h:{ format:"ordinate-plan-v1", of:"h", title:"Test House", ppm:5, unit:"yd", roads:[], shapes:[], nodes:[
    { id:"hall", name:"The Hall", kind:"hall", x:100, y:100, w:10, d:8, site:{ kind:"", level:5, once:true, waves:1, loot:{ coin:0 }, items:[], light:"bright",
      foes:[{ id:"srd:animated-armor", n:"1" }, { id:"srd:gargoyle", n:"1" }, { id:"srd:specter", n:"1" }] },
      bmap:{ name:"The Hall", rows:["####################","#..................#","#..................#","#..................#","#..................#","####################"], start:{ party:[[2,2],[3,2]], enemy:[[6,1],[7,1],[8,1]] } } } ] } } };
setTimeout(async ()=>{ const wait = ms => new Promise(r=>setTimeout(r, ms)); const out = [];
 try{
  loadJSONNow(JSON.stringify(__TC)); await wait(300); setDmMode(true); await wait(60);
  enterPlan('h'); await wait(40); const hall = doc.nodes.find(n=>n.id==='hall'); openBattle(hall); await wait(150);
  const c = hall.site.combat; beginBattle(hall.site); await wait(60);
  const all = () => combatants(c), by = nm => all().find(t=>t.label.startsWith(nm)), G = by('Gawain'), W = by('Wren'), arm = by('Animated Armor'), gar = by('Gargoyle'), spe = by('Specter');
  out.push('defaults: ' + [arm, gar, spe].map(t=>{ const T = tacOf(c, t); return `${t.label} ${T.role}/${T.aim}/courage ${T.courage}`; }).join(' · '));
  /* the map: Gawain at (2,2), Wren at (12,2); the armor and gargoyle by Wren, the specter in between */
  c.pos = c.pos || {}; Object.assign(c.pos, { [G.id]:{ x:2, y:2 }, [W.id]:{ x:12, y:2 }, [arm.id]:{ x:11, y:2 }, [gar.id]:{ x:13, y:3 }, [spe.id]:{ x:7, y:2 } });
  const sug = t => { const s = tacSuggest(c, t); return `${t.label} → ${s.toLabel || s.helpLabel || '-'} (${s.why})${s.flee ? ' · would flee: ' + s.flee : ''}`; };
  out.push('round 1: ' + [arm, gar, spe].map(sug).join(' | '));
  /* Gawain hits the gargoyle hard: its grudge outweighs 50 ft? (normal: 2 a step) */
  act = freshAct(G.id); act.what = 'pca:0'; act.targets = [gar.x.id]; act.outcome = 'hit'; act.dmg = '30'; logAction(hall, c); await wait(30);
  out.push('after Gawain hits the gargoyle for 30: ' + sug(gar) + ' · tallies ' + JSON.stringify({ dealt:c.dealt, hurt:c.hurt }));
  /* the strongest bears down on the specter: Gawain moves next to it */
  c.pos[G.id] = { x:6, y:2 }; out.push('Gawain beside the specter: ' + sug(spe));
  /* clever: the strongest within 1.5 × movement, Now CR for two rounds, then damage dealt */
  const ct = Object.assign({}, gar, {}); gar.x.tac = { aim:'strongest' };
  out.push('the gargoyle as clever, round 1: ' + sug(gar)); c.round = 3; act = freshAct(W.id); act.what = 'pca:0'; act.targets = [arm.x.id]; act.outcome = 'hit'; act.dmg = '40'; logAction(hall, c); await wait(30);
  out.push('round 3, Wren has dealt 40: ' + sug(gar)); delete gar.x.tac;
  /* courage: the specter (brave) nearly dead */
  spe.x.hp = 2; out.push('specter at 2 HP: ' + sug(spe));
  /* support */
  arm.x.tac = { role:'support' }; gar.x.hp = 10; out.push('armor as support: ' + sug(arm)); arm.x.tac = { role:'support', ward:spe.x.id }; out.push('looking after the specter: ' + sug(arm)); delete arm.x.tac;
  /* the action form on the gargoyle's turn, and Target */
  act = freshAct(gar.id); renderBattlePanel(); await wait(40); const box = document.querySelector('.tacbox');
  out.push('form: ' + (box ? box.innerText.replace(/\s+/g, ' ').trim() : 'no box')); const tb = document.querySelector('[data-tactgt]'); if(tb){ tb.click(); await wait(30); } out.push('Target picked: ' + JSON.stringify(act.targets));
  /* the dials on its card: a kind, then this one only */
  const html = tacEditor(gar.x, 'x:' + gar.x.id); out.push('card dials: ' + (html.match(/data-tf="(\w+)"/g) || []).join(' '));
  root.tacFoes = { 'srd:gargoyle':{ courage:1 } }; out.push('kind set to cowardly: ' + tacOf(c, gar).courage + ' · this one only: ' + (gar.x.tac = { courage:5 }, tacOf(c, gar).courage)); delete gar.x.tac;
  /* undo takes the tallies back */
  const before = JSON.stringify(c.dealt); undoAction(c); out.push('undo: dealt ' + before + ' -> ' + JSON.stringify(c.dealt));
 }catch(e){ out.push('ERR ' + e.message + ' ' + (e.stack||'').split('\n').slice(1, 3).join(' / ')); }
 out.push('page errors: ' + (window.__ERR || []).length + ((window.__ERR || []).length ? ' ' + __ERR.slice(0, 3).join(' ; ') : ''));
 document.title = 'RES ' + out.join(' || ');
}, 900);
</script>
