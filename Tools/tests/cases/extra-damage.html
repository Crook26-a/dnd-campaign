// uses: nothing
<script>
/* extra damage on a hit (Joseph, 2026-10-30: "additional damage, like flame tongue, should be showing up in the damage
   thing on a hit"; "it should be on all types of damage"): an item's "extra 2d6 Fire damage" (on its own weapon, lit once
   ticked), a creature's "plus 3 (1d6) Fire damage", each type rolled on its own, each target's resistances */
const __XD = { format:"ordinate-survey-v1", title:"Extra damage", ppm:10, unit:"mi", party:2,
  nodes:[{ id:"h", name:"Test House", kind:"town", x:0, y:0 }], roads:[], shapes:[],
  roster:[{ id:"pa", name:"Gawain", cls:"Fighter", level:5, hp:"40", hpMax:"53", ac:"17", str:20, defenses:"Resistant to fire.",
    attacks:[{ name:"Flame Tongue Greatsword (fire while lit)", hit:"+8", dmg:"2d6+5", dtype:"slashing" }, { name:"Javelin", hit:"+8", dmg:"1d6+5", dtype:"piercing" }, { name:"Old line", hit:"+8", dmg:"2d6+5 + 2d6", dtype:"slashing + fire" }],
    inv:[{ id:"srd:flame-tongue-greatsword", qty:1, attuned:true }] }, { id:"pb", name:"Wren", cls:"Wizard", level:5, hp:"28", hpMax:"28", ac:"12", attacks:[] }],
  groups:[{ id:"g1", members:["pa","pb"], at:{ map:"h", node:"hall" } }], library:{ npcs:[], foes:[], encounters:[], shops:[], loot:[] },
  plans:{ h:{ format:"ordinate-plan-v1", of:"h", title:"Test House", ppm:5, unit:"yd", roads:[], shapes:[], nodes:[
    { id:"hall", name:"The Hall", kind:"hall", x:100, y:100, w:10, d:8, site:{ kind:"", level:5, once:true, waves:1, loot:{ coin:0 }, items:[], light:"bright", foes:[{ id:"srd:hell-hound", n:"1" }, { id:"srd:ogre", n:"1" }] },
      bmap:{ name:"The Hall", rows:["##########","#........#","#........#","#........#","##########"], start:{ party:[[2,2],[3,2]], enemy:[[6,1],[7,2]] } } } ] } } };
setTimeout(async ()=>{ const wait = ms => new Promise(r=>setTimeout(r, ms)); const out = [];
 try{
  loadJSONNow(JSON.stringify(__XD)); await wait(300); setDmMode(true); await wait(60);
  enterPlan('h'); await wait(40); const hall = doc.nodes.find(n=>n.id==='hall'); openBattle(hall); await wait(150);
  const c = hall.site.combat; beginBattle(hall.site); await wait(60);
  const hound = c.list.find(x=>/hell/i.test(x.label||x.foe)), ogre = c.list.find(x=>/ogre/i.test(x.label||x.foe));
  const pick = async (actor, what, targets) => { act = freshAct(actor); act.what = what; renderBattlePanel(); await wait(20); const w = document.querySelector('#ac-what'); w.dispatchEvent(new Event('change', { bubbles:true })); await wait(20); act.targets = targets; renderBattlePanel(); await wait(20); };
  const form = () => { const lab = (document.querySelector('#ac-dmg') || {}).parentElement; return (lab ? lab.querySelector('label').textContent : '-') + ' · chips ' + [...document.querySelectorAll('[data-addon]')].map(b=>b.textContent + (b.classList.contains('on') ? ' (on)' : '')).join(' / '); };
  const clickRoll = async () => { document.querySelector('[data-acroll="dmg"]').click(); await wait(20); return `box ${act.dmg} · "${act.rolled.dmg.said}"`; };
await pick('pa', 'pca:0', [ogre.id]); out.push('greatsword, not lit yet: ' + form());
  document.querySelector('[data-addon="inv:srd:flame-tongue-greatsword"]').click(); await wait(20); out.push('ticked: ' + form() + ' · ' + await clickRoll());
  await pick('pa', 'pca:0', [ogre.id]); out.push('next swing, still lit: ' + form());
  await pick('pa', 'pca:1', [ogre.id]); out.push('javelin: ' + form());
  await pick('pa', 'pca:2', [ogre.id]); out.push('a line that already has fire: ' + form());
  await pick('pa', 'pca:0', [hound.id, ogre.id]); out.push('on the hell hound (immune to fire) and the ogre: ' + await clickRoll());
  logAction(hall, c); await wait(30); out.push('logged: "' + c.log.slice(-1)[0].text + '"');
  await pick(hound.id, 'fa:Bite', ['pa']); out.push('the hound bites: ' + form() + ' · ' + await clickRoll());
  await pick('pa', 'pca:0', [ogre.id]); document.querySelector('[data-acroll="part:0"]').click(); await wait(20); out.push('slashing on its own: box ' + act.dmg + ' · "' + act.rolled.dmg.said + '" · buttons ' + [...document.querySelectorAll('[data-acroll]')].map(b=>b.textContent.trim()).join(' / '));
  { const f = document.querySelector('[data-acpart="1"]'); f.value = '5'; f.dispatchEvent(new Event('change', { bubbles:true })); await wait(20); } out.push('fire typed in (5): box ' + act.dmg + ' · "' + act.rolled.dmg.said + '"');
  out.push('Gawain CR lines: ' + (()=>{ const p = pcState(root.roster[0]); return itemExtras(p).map(x=>`${x.name} ${x.dice} ${x.dtype} (${x.cond ? 'while' : 'always'})`).join(', '); })());
 }catch(e){ out.push('ERR ' + e.message + ' ' + (e.stack||'').split('\n').slice(1, 3).join(' / ')); }
 out.push('page errors: ' + (window.__ERR || []).length + ((window.__ERR || []).length ? ' ' + __ERR.slice(0, 3).join(' ; ') : ''));
 document.title = 'RES ' + out.join(' || ');
}, 900);
</script>
