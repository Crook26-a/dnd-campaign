// uses: nothing
<script>
/* what spells and items do to rolls while they last (Joseph, 2026-10-30: "will things like pass without trace give the
   bonus that it's supposed to"; "Is it doing it for items as well?"; "and temp hit points") */
const __FX = { format:"ordinate-survey-v1", title:"Effects", ppm:10, unit:"mi", party:2,
  nodes:[{ id:"h", name:"Test House", kind:"town", x:0, y:0 }], roads:[], shapes:[],
  roster:[{ id:"pa", name:"Gawain", cls:"Fighter", level:5, hp:"40", hpMax:"53", ac:"17", str:20, dex:10, con:15, attacks:[{ name:"Greatsword", hit:"+8", dmg:"2d6+5", dtype:"slashing" }], inv:[{ id:"ll_cloak", qty:1, attuned:true }] },
    { id:"pb", name:"Wren", cls:"Cleric", level:5, hp:"28", hpMax:"28", ac:"12", dex:14, con:14, wis:16, dc:"14", satk:"+6", saves:"Wis +6, Cha +2", skills:"Stealth +2",
      spells:["spell:bless", "spell:shield", "spell:false-life", "spell:pass-without-trace", "spell:guidance"], attacks:[] }],
  groups:[{ id:"g1", members:["pa","pb"], at:{ map:"h", node:"hall" } }], library:{ npcs:[], foes:[], encounters:[], shops:[],
    loot:[{ id:"ll_cloak", name:"Cloak of Protection", kind:"magic item", attune:true, desc:"You gain a +1 bonus to AC and saving throws while you wear this cloak." }] },
  plans:{ h:{ format:"ordinate-plan-v1", of:"h", title:"Test House", ppm:5, unit:"yd", roads:[], shapes:[], nodes:[
    { id:"hall", name:"The Hall", kind:"hall", x:100, y:100, w:10, d:8, site:{ kind:"", level:5, once:true, waves:1, loot:{ coin:0 }, items:[], light:"bright", foes:[{ id:"srd:hell-hound", n:"1" }, { id:"srd:ogre", n:"1" }] },
      bmap:{ name:"The Hall", rows:["##########","#........#","#........#","#........#","##########"], start:{ party:[[1,2],[2,2]], enemy:[[6,1],[7,2]] } } } ] } } };
setTimeout(async ()=>{ const wait = ms => new Promise(r=>setTimeout(r, ms)); const out = [];
 try{ window.confirm = () => true;     // a second action on a turn: yes (Joseph, 2026-10-30: the action is tracked now)
  loadJSONNow(JSON.stringify(__FX)); await wait(300); setDmMode(true); await wait(60);
  enterPlan('h'); await wait(40); const hall = doc.nodes.find(n=>n.id==='hall'); openBattle(hall); await wait(150);
  const c = hall.site.combat; beginBattle(hall.site); await wait(60); const [G, W] = root.roster, hound = c.list.find(x=>/Hell/.test(x.label)), ogre = c.list.find(x=>/Ogre/.test(x.label));
  W.slots[1].max = 4; W.slots[2].max = 3;
  const choose = async (actor, what, targets) => { act = freshAct(actor); act.what = what; renderBattlePanel(); await wait(20); document.querySelector('#ac-what').dispatchEvent(new Event('change', { bubbles:true })); await wait(20); if(targets) act.targets = targets; renderBattlePanel(); await wait(20); };
  const seq = (...v) => { let k = 0; const r0 = Math.random; return () => k < v.length ? v[k++] : r0(); };
  const line = () => '"' + c.log.slice(-1)[0].text + '"';
  /* the cloak: a save the app works out gets +1; AC is the sheet's */
  out.push('Gawain with the cloak: Dex save ' + saveBonusOf(combatants(c).find(t=>t.id==='pa'), 'Dexterity') + ', Wren Wis save (on her sheet) ' + saveBonusOf(combatants(c).find(t=>t.id==='pb'), 'Wisdom') + ', AC to hit ' + acOf(combatants(c).find(t=>t.id==='pa')));
  /* Bless and Guidance aren't attacks or damage (Joseph, 2026-10-30: "guidance took away hit points and bless was making me do an attack roll") */
  await choose('pb', 'sp:spell:bless', ['pa', 'pb']); out.push('Bless form: roll to hit ' + !!document.querySelector('[data-acroll="hit"]') + ', damage roll ' + !!document.querySelector('[data-acroll="dmg"]') + ', outcome ' + act.outcome);
  await choose('pb', 'sp:spell:guidance', ['pa']); out.push('Guidance form: damage roll ' + !!document.querySelector('[data-acroll="dmg"]')); { const hp = G.hp; logAction(hall, c); await wait(30); out.push('Guidance on Gawain: hp ' + hp + ' -> ' + G.hp + ' · ' + line() + ' · on him: ' + fxOf(G, false).map(f=>f.name + fxSay(f.b)).join(' · ')); }
  W.conc = null;
  /* Bless on both */
  await choose('pb', 'sp:spell:bless', ['pa', 'pb']); act.outcome = 'none'; logAction(hall, c); await wait(30);
  out.push('Bless: ' + line() + ' · on Gawain: ' + fxOf(G, true).map(f=>f.name + fxSay(f.b)).join(' · '));
  await choose('pa', 'pca:0', [ogre.id]); out.push('the form for Gawain: ' + [...document.querySelectorAll('.actbox .actspell')].map(p=>p.textContent.replace(/\s+/g, ' ')).filter(t=>/^On /.test(t)).join(''));
  { const r0 = Math.random; Math.random = seq(0.45, 0.45, 0.5); document.querySelector('[data-acroll="hit"]').click(); Math.random = r0; await wait(20); } out.push('to hit: ' + act.toHit.said);
  /* the hell hound's breath: Bless on the save */
  await choose(hound.id, 'fa:Fire Breath (Recharge 5–6)', ['pa', 'pb']);
  out.push('save row: ' + [...document.querySelectorAll('.saverow small')].map(s=>s.textContent).join(' | '));
  { const r0 = Math.random; Math.random = seq(0.3, 0.5, 0.6, 0.0); document.querySelector('[data-svroll="all"]').click(); Math.random = r0; await wait(20); }
  out.push('saves: ' + Object.values(act.saves).map(r=>r.said).join(' ; '));
  act.dmg = '10'; logAction(hall, c); await wait(30); concSweep(); await wait(20);
  { const b = document.querySelector('[data-concask="roll"]'); const r0 = Math.random; Math.random = seq(0.5, 0.25); b.click(); Math.random = r0; await wait(30); } out.push('Wren\'s concentration save: ' + gameLogList().slice(-1)[0].text);
  /* Shield: +5 AC till her next turn (a round) */
  await choose('pb', 'sp:spell:shield'); act.lvl = 1; logAction(hall, c); await wait(30); out.push('Shield: ' + line());
  await choose(ogre.id, 'fa:Greatclub', ['pb']); out.push('the ogre on Wren: ' + ((document.querySelector('[data-acroll="hit"]')||{}).textContent || 'no button'));
  newRound(c); fxSweep(); out.push('a round later: AC ' + acOf(combatants(c).find(t=>t.id==='pb')));
  /* concentration ends: so does Bless */
  concEnd(concHolders().find(o=>o.h===W), 'took a hit'); concSweep(); out.push('Bless gone: Gawain ' + (fxOf(G, false).map(f=>f.name).join(', ') || 'nothing'));
  /* False Life: temporary hit points, not healing */
  await choose('pb', 'sp:spell:false-life'); out.push('False Life form: ' + [...document.querySelectorAll('.actbox label')].map(l=>l.textContent).find(t=>/Temp HP|Healing/.test(t)));
  act.lvl = 1; act.heal = '9'; out.push('targets ' + JSON.stringify(act.targets) + ' temp flag ' + actDice(c, combatants(c).find(t=>t.id==='pb'), actInfo(c, combatants(c).find(t=>t.id==='pb'))).temp); const hp0 = W.hp; logAction(hall, c); await wait(30); out.push(`False Life: hp ${hp0} -> ${W.hp}, temp ${W.temp} · ` + c.log.slice(-2).map(e=>e.text).join(' / '));
  /* an enemy's temporary hit points go first */
  ogre.temp = 5; const oh = ogre.hp; await choose('pa', 'pca:0', [ogre.id]); act.outcome = 'hit'; act.dmg = '8'; logAction(hall, c); await wait(30); out.push(`the ogre with 5 temp: hp ${oh} -> ${ogre.hp}, temp ${ogre.temp}`);
  /* Pass without Trace: +10 Stealth on her and Gawain */
  closeBattle(); await wait(30); W.conc = null; concBegin(W, spellOf('spell:pass-without-trace'), numOr(W.hp)); fxCast(spellOf('spell:pass-without-trace'), 'pc:pb', [W, G], W);
  out.push('Pass without Trace: Stealth Wren ' + skillMod(W, 'Stealth') + ' (sheet +2), Gawain ' + skillMod(G, 'Stealth') + ' (Dex +0)');
  concEnd(concHolders().find(o=>o.h===W), 'they ended it'); concSweep(); out.push('ended: Wren ' + skillMod(W, 'Stealth') + ', Gawain ' + skillMod(G, 'Stealth'));
 }catch(e){ out.push('ERR ' + e.message + ' ' + (e.stack||'').split('\n').slice(1, 3).join(' / ')); }
 out.push('page errors: ' + (window.__ERR || []).length + ((window.__ERR || []).length ? ' ' + __ERR.slice(0, 3).join(' ; ') : ''));
 document.title = 'RES ' + out.join(' || ');
}, 900);
</script>
