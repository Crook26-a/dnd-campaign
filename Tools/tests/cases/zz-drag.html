// uses: nothing
<script>
/* movement (Joseph, 2026-10-30: "keep track of movement"; "From token moves, but I should be able to undo it or fudge
   those number"): their own drags counted against their speed, Dash, the number by hand, undo, cleared on their turn */
const __MV = { format:"ordinate-survey-v1", title:"Movement", ppm:10, unit:"mi", party:2,
  nodes:[{ id:"h", name:"Test House", kind:"town", x:0, y:0 }], roads:[], shapes:[],
  roster:[{ id:"pa", name:"Gawain", cls:"Fighter", level:5, hp:"40", hpMax:"53", ac:"17", speed:"30", attacks:[] },
    { id:"pb", name:"Wren", cls:"Cleric", level:5, hp:"28", hpMax:"28", ac:"12", speed:"25 ft", attacks:[] }],
  groups:[{ id:"g1", members:["pa","pb"], at:{ map:"h", node:"hall" } }], library:{ npcs:[], foes:[], encounters:[], shops:[], loot:[] },
  plans:{ h:{ format:"ordinate-plan-v1", of:"h", title:"Test House", ppm:5, unit:"yd", roads:[], shapes:[], nodes:[
    { id:"hall", name:"The Hall", kind:"hall", x:100, y:100, w:16, d:8, site:{ kind:"", level:5, once:true, waves:1, loot:{ coin:0 }, items:[], light:"bright", foes:[{ id:"srd:ogre", n:"1" }] },
      bmap:{ name:"The Hall", rows:["################","#..............#","#..............#","#..............#","#..............#","################"], start:{ party:[[1,2],[1,3]], enemy:[[13,2]] } } } ] } } };
setTimeout(async ()=>{ const wait = ms => new Promise(r=>setTimeout(r, ms)); const out = [];
 try{
  loadJSONNow(JSON.stringify(__MV)); await wait(300); setDmMode(true); await wait(60);
  enterPlan('h'); await wait(40); const hall = doc.nodes.find(n=>n.id==='hall'); openBattle(hall); await wait(150);
  const c = hall.site.combat; beginBattle(hall.site); await wait(60);
  combatants(c).forEach((t, k)=>{ c.init[t.id] = 20 - k; }); c.turn = 'pa'; act = freshAct('pa'); renderBattle(); renderBattlePanel(); await wait(30);
  const svgEl = document.getElementById('bsvg');
  const scr = (x, y) => { const p = svgEl.createSVGPoint(); p.x = (x + .5) * BS; p.y = (y + .5) * BS; return p.matrixTransform(svgEl.getScreenCTM()); };
  const ev = (type, tgt, q) => tgt.dispatchEvent(new PointerEvent(type, { bubbles:true, clientX:q.x, clientY:q.y, button:0, pointerId:1, pointerType:'mouse' }));
  const drag = async (id, x, y, steps) => { const a = c.pos[id], tok = svgEl.querySelector(`[data-tok="${id}"]`); const s = scr(a.x, a.y), e = scr(x, y);
    ev('pointerdown', tok, s); for(let i=1;i<=steps;i++){ ev('pointermove', svgEl, { x:s.x + (e.x - s.x) * i / steps, y:s.y + (e.y - s.y) * i / steps }); await wait(5); } ev('pointerup', svgEl, e); await wait(30);
    return `to ${c.pos[id].x},${c.pos[id].y}: moved ${movedOf(c, id).ft}`; };
  out.push('start ' + c.pos.pa.x + ',' + c.pos.pa.y);
  out.push('1 square: ' + await drag('pa', 2, 2, 6));
  out.push('another 1 square: ' + await drag('pa', 3, 2, 6));
  out.push('3 squares: ' + await drag('pa', 6, 2, 10));
 }catch(e){ out.push('ERR ' + e.message + ' ' + (e.stack||'').split('\n').slice(1, 3).join(' / ')); }
 out.push('page errors: ' + (window.__ERR || []).length + ((window.__ERR || []).length ? ' ' + __ERR.slice(0, 3).join(' ; ') : ''));
 document.title = 'RES ' + out.join(' || ');
}, 900);
</script>
