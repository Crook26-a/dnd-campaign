// uses: nothing
<script>
/* story flags (root.flags) and a person's rules (p.rules): a goal's puzzles solved takes an effect off (an ability
   back), a ticked flag moves them to a stage with words to read, their hit points in a fight move them on (the fight
   takes the new numbers, keeping the damage), the countdown running out sets a flag, a rule written in the Library */
const __RL = { format:"ordinate-survey-v1", title:"Rule Test", ppm:10, unit:"mi", party:2,
  nodes:[{ id:"h", name:"Test House", kind:"town", x:0, y:0 }], roads:[], shapes:[],
  roster:[{ id:"pa", name:"Anna Ash", level:5, hp:"30", hpMax:"30" }, { id:"pb", name:"Bram Birch", level:5, hp:"30", hpMax:"30" }],
  groups:[{ id:"g1", members:["pa","pb"], at:{ map:"h", node:"hall" } }],
  flags:[{ id:"f1", name:"The chandelier is broken", on:false }, { id:"f2", name:"Midnight has struck", on:false }],
  countdown:{ on:true, title:"", total:600, left:600, endsAt:null, show:true, sound:false, bells:[], flagsAtEnd:["f2"] },
  library:{ npcs:[{ id:"ln_v", name:"Lord Vile", role:"The host", fightsAs:"self", ac:"14", hpMax:"40", hp:"40", npcs:[],
      attacks:[{ name:"Cane", hit:"+5", dmg:"1d6+2", dtype:"bludgeoning" }, { name:"Charm", hit:"WIS 13", dmg:"", dtype:"" }],
      effects:[{ id:"e0", name:"Not yet desperate", lose:["Charm"] }],
      stages:[{ id:"s1", name:"The host" }, { id:"s2", name:"In a fury", fightsAs:"srd:mage", wants:"Revenge" }, { id:"s3", name:"Coming apart", fightsAs:"srd:lich" }],
      stageNow:"s1",
      rules:[{ id:"r1", when:[{ goal:"The shield", n:2 }], unEffect:"Not yet desperate", say:"He stops smiling." },
             { id:"r2", when:[{ flag:"f1" }], stage:"s2", say:"And Lord Vile screams." },
             { id:"r3", when:[{ flag:"f2" }, { flag:"f1", off:true }], stage:"s3" },
             { id:"r4", when:[{ hp:50 }], stage:"s3" }] }], foes:[], loot:[], encounters:[], shops:[] },
  puzzles:[{ id:"pz1", name:"Ward A", goal:"The shield", hints:[], given:0, text:"Crack." }, { id:"pz2", name:"Ward B", goal:"The shield", hints:[], given:0, text:"Crack." }, { id:"pz3", name:"Ward C", goal:"The shield", hints:[], given:0, text:"Crack." }],
  plans:{ h:{ format:"ordinate-plan-v1", of:"h", title:"Test House", ppm:5, unit:"yd", roads:[], shapes:[], nodes:[
    { id:"hall", name:"The Hall", kind:"hall", x:100, y:100, w:10, d:8, site:{ light:"bright" }, bmap:{ name:"The Hall", rows:["##########","#........#","#........#","#........#","##########"], start:{ party:[[2,2],[3,2]], enemy:[] } } } ] } } };
setTimeout(async ()=>{ const wait = ms => new Promise(r=>setTimeout(r, ms)); const out=[]; const txt = el => el ? el.innerText.replace(/\s+/g,' ').trim() : 'none';
 try{
  loadJSONNow(JSON.stringify(__RL)); await wait(300); setDmMode(true); await wait(50);
  const p = () => libNpcById('ln_v'), acts = () => foeEntries(foeById(npcFightId(p()))).map(([n])=>n).filter(n=>!/Weakened/.test(n));
  out.push('start: stage ' + p().stageNow + ', abilities ' + acts().join(', '));
  /* the goal */
  pane = 'session'; syncTabs(); renderSession(); await wait(30);
  const solve = async id => { pzOpen.add(id); renderSession(); document.querySelector(`#pane-session [data-pz="solve"][data-id="${id}"]`).click(); await wait(40); document.querySelector('#pzpop [data-pz="close"]') && document.querySelector('#pzpop [data-pz="close"]').click(); };
  await solve('pz1'); out.push('one ward: abilities ' + acts().join(', '));
  await solve('pz2'); out.push('two wards: abilities ' + acts().join(', ') + ' · pop "' + txt(document.getElementById('saypop')) + '"');
  document.querySelector('#saypop [data-say="close"]') && document.querySelector('#saypop [data-say="close"]').click();
  await solve('pz3'); out.push('three wards: effects ' + (p().effects||[]).length + ' (it acted once)');
  /* the flags panel */
  const fp = () => document.querySelector('#pane-session details[data-invfor="flags"]');
  out.push('flags panel: ' + txt(fp().querySelector('summary')));
  const cb = fp().querySelector('[data-flag="f1"]'); cb.checked = true; cb.dispatchEvent(new Event('change', { bubbles:true })); await wait(40);
  out.push('ticked "chandelier broken": stage ' + p().stageNow + ', fights as ' + foeById(npcFightId(p())).name + ' hp ' + foeById(npcFightId(p())).hp + ' · pop "' + txt(document.getElementById('saypop')) + '"');
  document.querySelector('#saypop [data-say="close"]') && document.querySelector('#saypop [data-say="close"]').click();
  /* a fight: hit points move them on, the fight follows */
  enterPlan('h'); await wait(40); const hall = doc.nodes.find(n=>n.id==='hall'); openBattle(hall); await wait(100);
  const c = hall.site.combat, x = addToFight(c, 'p:ln_v'); placeTokens(c); beginBattle(hall.site); battleSel = x.id; renderBattlePanel(); await wait(40);
  out.push('in the fight: ' + x.hp + '/' + x.max + ' (' + x.foe + ')');
  x.hp = 30; renderBattlePanel(); await wait(40); out.push('down to 30: stage ' + p().stageNow + ', ' + x.hp + '/' + x.max);
  /* the countdown runs out: midnight; r3 needs the chandelier not broken */
  const cd = root.countdown; cd.endsAt = Date.now() - 1000; cdTick(); await wait(30);
  out.push('countdown out: midnight ' + flagOn('f2') + ', stage still ' + p().stageNow + ' (r3 needs no chandelier)');
  /* a rule written on the Library page */
  openLib('npcs', 'ln_v'); await wait(60);
  const rb = [...document.querySelectorAll('#pane-library details.pcset')].find(d=>/When things happen/.test(d.querySelector('summary').textContent));
  out.push('library rules: ' + txt(rb.querySelector('summary')) + ' · ' + [...rb.querySelectorAll('.thrrow .thrtext')].map(e=>txt(e)).join(' | '));
  rb.querySelector('[data-rl="new"]').click(); await wait(30);
  const ty = document.querySelector('#pane-library [data-rlc="type"][data-j="0"]'); ty.value = 'hp'; ty.dispatchEvent(new Event('change', { bubbles:true })); await wait(30);
  const hp = document.querySelector('#pane-library [data-rlc="hp"][data-j="0"]'); hp.value = '25'; hp.dispatchEvent(new Event('change', { bubbles:true }));
  document.querySelector('#pane-library [data-rlf="stage"]').value = 's1'; document.querySelector('#pane-library [data-rlf="say"]').value = 'He begs.';
  document.querySelector('#pane-library [data-rl="save"]').click(); await wait(30);
  const nr = p().rules[p().rules.length-1]; out.push('written in the app: ' + JSON.stringify({ when:nr.when, stage:nr.stage, say:nr.say }) + ' · ' + ruleWords(p(), nr));
  /* unticking a flag undoes its rule: back to the stage it moved them from */
  setStage(p(), 's1', true); flagsOf().find(f=>f.id==='f1').on = false; p().rules.find(r=>r.id==='r2').was = false;
  setFlag('f1', true, 'ticked'); const st1 = p().stageNow; setFlag('f1', false, 'unticked');
  out.push('flag on → ' + st1 + ', off → ' + p().stageNow);
  /* a puzzle's own flag: ticking it solves the puzzle, Solved ticks it, unticking undoes it */
  flagsOf().push({ id:'fw', name:'Ward D broken', on:false }); root.puzzles.push({ id:'pz4', name:'Ward D', flag:'fw', hints:[], given:0, text:'Crack.', does:[{ to:'ln_v', effect:{ name:'Ward D', save:{ wis:-1 } } }] });
  setFlag('fw', true, 'ticked'); out.push('flag ticked: Ward D solved ' + !!root.puzzles.find(q=>q.id==='pz4').solved + ', on him ' + (p().effects||[]).map(e=>e.name).join(','));
  setFlag('fw', false, 'unticked'); out.push('unticked: solved ' + !!root.puzzles.find(q=>q.id==='pz4').solved + ', on him ' + ((p().effects||[]).map(e=>e.name).join(',') || 'nothing'));
  pane = 'session'; syncTabs(); pzOpen.add('pz4'); renderSession(); document.querySelector('#pane-session [data-pz="solve"][data-id="pz4"]').click(); await wait(30);
  out.push('Solved: flag ' + flagOn('fw'));
  /* spell names in a stat block, and a key person's card while they're off the map */
  out.push('spell links: ' + (spellLinks('casts Shield or Fireball, not a Fireballer').match(/data-spellpeek="[^"]+"/g)||[]).join(' '));
  p().key = true; enterPlan('h'); await wait(30); openBattle(doc.nodes.find(n=>n.id==='hall')); await wait(80); closeBattle(true); delete doc.nodes.find(n=>n.id==='hall').site.combat;
  openBattle(doc.nodes.find(n=>n.id==='hall')); await wait(80); openPersonCard('npc', 'ln_v'); await wait(40);
  out.push('card off the map: ' + /Lord Vile/.test(txt(document.getElementById('pane-inspect'))) + ', stage box ' + !!document.querySelector('#pane-inspect [data-stagepick]') + ', stat block ' + !!document.querySelector('#pane-inspect .fq-acts'));
 }catch(e){ out.push('ERR ' + e.message + ' ' + (e.stack||'').split('\n').slice(1, 3).join(' / ')); }
 document.title = 'RES ' + out.join(' || ');
}, 900);
</script>
