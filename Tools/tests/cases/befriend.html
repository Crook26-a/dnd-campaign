// uses: nothing
<script>
/* befriending (x.befriend): the first creature befriended becomes the library person and joins the party on its
   square with its hit points; any other one like it won't; the Build panel sets who it becomes */
const __BF = { format:"ordinate-survey-v1", title:"Befriend Test", ppm:10, unit:"mi", party:2,
  nodes:[{ id:"h", name:"Test House", kind:"town", x:0, y:0 }], roads:[], shapes:[],
  roster:[{ id:"pa", name:"Anna Ash", level:5, hp:"30", hpMax:"30" }, { id:"pb", name:"Bram Birch", level:5, hp:"30", hpMax:"30" }],
  groups:[{ id:"g1", members:["pa","pb"], at:{ map:"h", node:"hall" } }],
  library:{ npcs:[{ id:"ln_ar", name:"Faithful Armor", role:"A friend", fightsAs:"srd:animated-armor", npcs:[], befriendSay:"It kneels.", befriendNo:"Not this one." }], foes:[], loot:[], encounters:[], shops:[] },
  plans:{ h:{ format:"ordinate-plan-v1", of:"h", title:"Test House", ppm:5, unit:"yd", roads:[], shapes:[], nodes:[
    { id:"hall", name:"The Hall", kind:"hall", x:100, y:100, w:10, d:8, site:{ kind:"", level:5, once:true, waves:1, loot:{ coin:0 }, items:[], light:"bright", foes:[{ id:"srd:animated-armor", n:"2", befriend:"ln_ar" }] },
      bmap:{ name:"The Hall", rows:["##########","#........#","#........#","#........#","##########"], start:{ party:[[2,2],[3,2]], enemy:[[6,1],[7,1]] } } } ] } } };
setTimeout(async ()=>{ const wait = ms => new Promise(r=>setTimeout(r, ms)); const out=[]; const txt = el => el ? el.innerText.replace(/\s+/g,' ').trim() : 'none';
 try{
  loadJSONNow(JSON.stringify(__BF)); await wait(300); setDmMode(true); await wait(50);
  enterPlan('h'); await wait(40); const hall = doc.nodes.find(n=>n.id==='hall'); openBattle(hall); await wait(120);
  const c = hall.site.combat, [x1, x2] = c.list; beginBattle(hall.site); c.init[x1.id] = 17; x1.hp = 25;
  battleSel = x1.id; renderBattlePanel(); await wait(40);
  out.push('first: button "' + txt(document.querySelector('#actionbox [data-befriend]')) + '"');
  const pos = c.pos[x1.id]; document.querySelector('#actionbox [data-befriend]').click(); await wait(60);
  const p = libNpcById('ln_ar');
  out.push('befriended: in the fight ' + c.list.length + ', companion ' + isCompanion('ln_ar') + ' at ' + JSON.stringify(c.pos['n:ln_ar']) + ' (was ' + JSON.stringify(pos) + '), initiative ' + c.init['n:ln_ar'] + ', hp ' + p.hp + '/' + p.hpMax + ' · pop "' + txt(document.getElementById('saypop')) + '"');
  document.querySelector('#saypop [data-say="close"]').click();
  battleSel = x2.id; renderBattlePanel(); await wait(40);
  const b2 = document.querySelector('#actionbox [data-befriend]'); out.push('second: button "' + txt(b2) + '"');
  b2.click(); await wait(40); out.push('  still fighting ' + c.list.includes(x2) + ' · pop "' + txt(document.getElementById('saypop')) + '"');
  document.querySelector('#saypop [data-say="close"]').click();
  /* the Build panel */
  closeBattle(true); await wait(30); delete hall.site.combat; select('node', 'hall'); setDmMode(false); renderPane(true); await wait(40);
  const sel = document.querySelector('#pane-inspect [data-foebf="0"]');
  out.push('Build: becomes ' + (sel ? [...sel.options].find(o=>o.selected).textContent : 'no field'));
  sel.value = ''; sel.dispatchEvent(new Event('change')); out.push('  cleared: ' + JSON.stringify(hall.site.foes[0].befriend));
 }catch(e){ out.push('ERR ' + e.message + ' ' + (e.stack||'').split('\n').slice(1, 3).join(' / ')); }
 document.title = 'RES ' + out.join(' || ');
}, 900);
</script>
