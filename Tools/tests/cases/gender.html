// uses: nothing
<script>
/* man or woman on the person roller: names from the right list, nothing that doesn't suit (a beard on a woman), the
   person keeps it, the Roll tab / bring-in / add-here pickers, the Library sheet's Gender field, the Field Book round trip */
setTimeout(async ()=>{ const wait = ms => new Promise(r=>setTimeout(r, ms)); const out=[];
 try{
  loadJSONNow(JSON.stringify({ format:"ordinate-survey-v1", title:"Gender Test", ppm:10, unit:"mi", party:2, nodes:[], roads:[], shapes:[],
    roster:[{ id:"pa", name:"Anna Ash", level:3 }, { id:"pb", name:"Bram Birch", level:3 }] })); await wait(300);
  const first = g => g.name.replace(/"[^"]*"/g, "").trim().split(/\s+/)[0];
  const check = sex => { let wrong = 0, beard = 0, kept = 0; for(let i=0; i<60; i++){ const g = genPerson({ type:"Humanoid", gender:sex });
      if(!genderFirst(sex).includes(first(g))) wrong++; if(/beard/i.test(g.look + g.name)) beard++; if(g.gender===sex && g.person.gender===GENDER_WORD[sex]) kept++; }
    return `${sex}: 60 rolled, names off-list ${wrong}, beards ${beard}, kept ${kept}`; };
  out.push(check("man")); out.push(check("woman"));
  let men = 0; for(let i=0; i<100; i++){ const g = genPerson({ type:"Humanoid", gender:"" }); if(g.gender==="man") men++; else if(g.gender!=="woman") men = -999; }
  out.push('either: 100 rolled, men ' + (men > 30 && men < 70 ? 'about half' : men));
  out.push('lists: men ' + GEN_FIRST_MAN.length + ', women ' + GEN_FIRST_WOMAN.length + ', either ' + GEN_FIRST_ANY.length + ', all ' + GEN_FIRST.length + ', no repeats ' + (new Set(GEN_FIRST).size === GEN_FIRST.length));
  /* the Roll tab */
  pane = 'roll'; syncTabs(); renderRoll(); await wait(60);
  const sel = document.getElementById('gn-gender'); out.push('Roll tab picker: ' + (sel ? [...sel.options].map(o=>o.textContent).join('/') : 'none'));
  if(sel){ sel.value = 'woman'; sel.dispatchEvent(new Event('change', { bubbles:true })); await wait(20); out.push('picked: genOpts.gender ' + genOpts.gender); }
  const g = genPerson({ type:"Humanoid" }); out.push('Roll tab roll is a ' + g.gender + ', card says ' + /· woman/.test(personSheet(g, 'x:1', true)));
  /* saved to the Library: the summary and the sheet field */
  const p = personToLibrary(g); out.push('library: gender ' + p.gender + ', summary "' + libSummary('npcs', p).replace(/&[^;]+;/g, '') + '"');
  /* the Field Book: out and back with a change */
  const pack = JSON.parse(JSON.stringify({ format:"ordinate-fieldbook", version:1, npcs:[{ ...p, gender:"Man" }] }));
  fieldBookIn(JSON.stringify(pack), true); out.push('Field Book back with Man: ' + libNpcById(p.id).gender);
  const pack2 = { format:"ordinate-fieldbook", version:1, npcs:[(()=>{ const q = { ...libNpcById(p.id) }; delete q.gender; return q; })()] };
  fieldBookIn(JSON.stringify(pack2), true); out.push('cleared on the phone: ' + JSON.stringify(libNpcById(p.id).gender));
  /* "the party knows their name" goes out and back too, and clears like any other field */
  libNpcById(p.id).known = true; const pk = JSON.parse(JSON.stringify({ format:"ordinate-fieldbook", version:1, npcs:[{ ...libNpcById(p.id) }] }));
  fieldBookIn(JSON.stringify(pk), true); const kept = libNpcById(p.id).known;
  const pk2 = { format:"ordinate-fieldbook", version:1, npcs:[(()=>{ const q = { ...libNpcById(p.id) }; delete q.known; return q; })()] };
  fieldBookIn(JSON.stringify(pk2), true); out.push('known out and back ' + kept + ', cleared on the phone ' + JSON.stringify(libNpcById(p.id).known));
  out.push('FB_FIELDS has gender: ' + FB_FIELDS.npcs.includes('gender'));
  openLib('npcs', p.id); await wait(120); const gf = document.querySelector('[data-f="gender"]'); out.push('Library sheet Gender field: ' + (gf ? [...gf.options].map(o=>o.textContent).join('/') + ' = ' + gf.value : 'none'));
 }catch(e){ out.push('ERR ' + e.message + ' ' + (e.stack||'').split('\n')[1]); }
 document.title = 'RES ' + out.join(' || ');
}, 900);
</script>
