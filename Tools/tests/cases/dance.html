// uses: nothing
<script>
/* dancing tokens: c.dance pairs (nearest neighbour, an odd one alone), drawn turning round the couple's middle on both
   screens (the DM's ♪ only), dragging a dancer stops the couple, everyone-not-in-the-party, stop all */
const __DN = { format:"ordinate-survey-v1", title:"Dance Test", ppm:10, unit:"mi", party:2,
  nodes:[{ id:"h", name:"Test Hall", kind:"town", x:0, y:0 }], roads:[], shapes:[],
  roster:[{ id:"pa", name:"Anna Ash", level:5, hp:"30", hpMax:"30" }, { id:"pb", name:"Bram Birch", level:5, hp:"30", hpMax:"30" }],
  groups:[{ id:"g1", members:["pa","pb"], at:{ map:"h", node:"hall" } }],
  library:{ foes:[], loot:[], npcs:[{ id:"n1", name:"Dora Dee", role:"guest" }, { id:"n2", name:"Ed Eel", role:"guest" }, { id:"n3", name:"Fay Fern", role:"guest" }] },
  plans:{ h:{ format:"ordinate-plan-v1", of:"h", title:"Test Hall", ppm:5, unit:"yd", roads:[], shapes:[], nodes:[
    { id:"hall", name:"The Hall", kind:"hall", x:100, y:100, w:12, d:8, npcs:["n1","n2","n3"], bmap:{ name:"The Hall",
      rows:["############","#i........i#","#..........#","#..........#","#..........#","#i........i#","############"],
      start:{ party:[[1,1]], enemy:[], npc:[[4,3],[6,3],[9,5]] } } } ] } } };
setTimeout(async ()=>{ const wait = ms => new Promise(r=>setTimeout(r, ms)); const out=[]; const txt = el => el ? el.innerText.replace(/\s+/g,' ').trim() : 'none';
 const sqClient = (x, y) => { const r = document.getElementById('bsvg').getBoundingClientRect(), b = bview, s = Math.max(b.w/r.width, b.h/r.height);
   return { clientX: r.left + (r.width - b.w/s)/2 + ((x+.5)*BS - b.x)/s, clientY: r.top + (r.height - b.h/s)/2 + ((y+.5)*BS - b.y)/s }; };
 const drag = async (tokId, x, y) => { const t = document.querySelector(`#bsvg [data-tok="${tokId}"]`); if(!t) throw new Error('no token ' + tokId);
   const p0 = bnode().site.combat.pos[tokId], a = sqClient(p0.x, p0.y), b = sqClient(x, y), o = { bubbles:true, pointerId:1, button:0 };
   t.dispatchEvent(new PointerEvent('pointerdown', { ...o, ...a })); await wait(10);
   document.getElementById('bsvg').dispatchEvent(new PointerEvent('pointermove', { ...o, clientX:(a.clientX+b.clientX)/2, clientY:(a.clientY+b.clientY)/2 })); await wait(10);
   document.getElementById('bsvg').dispatchEvent(new PointerEvent('pointermove', { ...o, ...b })); await wait(10);
   document.getElementById('bsvg').dispatchEvent(new PointerEvent('pointerup', { ...o, ...b })); await wait(80); };
 const centre = id => { const r = document.querySelector(`#bsvg [data-tok="${id}"] .dance-up > circle:last-of-type, #bsvg [data-tok="${id}"] .dance-up circle`).getBoundingClientRect(); return { x:r.left + r.width/2, y:r.top + r.height/2 }; };
 try{
  loadJSONNow(JSON.stringify(__DN)); await wait(300); setDmMode(true); await wait(50);
  enterPlan('h'); await wait(60); openBattle(doc.nodes.find(x=>x.id==='hall')); await wait(120);
  const c = bnode().site.combat, el = document.getElementById('pane-inspect');
  out.push('panel has Dancing: ' + !!el.querySelector('.dancesec') + ', people listed ' + el.querySelectorAll('[data-dpick]').length);
  el.querySelector('.dancesec').open = true;
  ['p:n1', 'p:n2'].forEach(id=>{ el.querySelector(`[data-dpick="${id}"]`).click(); });
  el.querySelector('[data-dance="pair"]').click(); await wait(80);
  out.push('paired: ' + JSON.stringify(c.dance) + ', Ed stepped beside Dora ' + JSON.stringify(c.pos['p:n1']) + JSON.stringify(c.pos['p:n2']));
  const dm = document.getElementById('bsvg').innerHTML;
  out.push('DM map: turning groups ' + document.querySelectorAll('#bsvg .dance').length + ', notes ' + (dm.match(/♪/g)||[]).length + ', panel says ' + txt(el.querySelector('.dancesec summary')));
  const sc = playerMapScene(); out.push('TV: turning groups ' + ((sc.svg||'').match(/class="dance"/g)||[]).length + ', notes ' + ((sc.svg||'').match(/♪/g)||[]).length);
  const a0 = centre('p:n1'), b0 = centre('p:n2'); await wait(1500); const a1 = centre('p:n1'), b1 = centre('p:n2');
  const mid = (p, q) => ({ x:(p.x+q.x)/2, y:(p.y+q.y)/2 }), dist = (p, q) => Math.hypot(p.x-q.x, p.y-q.y), m0 = mid(a0, b0), m1 = mid(a1, b1);
  out.push('turning round their middle: they moved ' + (dist(a0, a1) > 3) + ', middle stayed ' + (dist(m0, m1) < 2) + ', apart the same ' + (Math.abs(dist(a0, b0) - dist(a1, b1)) < 2));
  battleSel = null; await drag('p:n1', 4, 1); await wait(60);
  out.push('Dora dragged: dance ' + JSON.stringify(c.dance||null) + ', Dora at ' + JSON.stringify(c.pos['p:n1']));
  el.querySelector('.dancesec').open = true; document.getElementById('pane-inspect').querySelector('[data-dance="all"]').click(); await wait(80);
  out.push('everyone not in the party: ' + JSON.stringify(c.dance) + ', Anna dancing ' + !!danceOf(c, 'pa'));
  battleSel = 'p:n3'; renderBattlePanel(); await wait(30); const one = document.querySelector('#pane-inspect [data-dance="one"]');
  out.push('card: ' + txt(one)); one.click(); await wait(60); out.push('after Stop on Fay: ' + JSON.stringify(c.dance||null));
  document.querySelector('#pane-inspect [data-dance="stop"]').click(); await wait(60);
  out.push('stop all: ' + JSON.stringify(c.dance||null) + ', turning groups ' + document.querySelectorAll('#bsvg .dance').length);
  /* pairing by gender: a man and a woman, then the same gender; someone with no gender on their sheet partners anyone */
  const L = root.library.npcs; L.find(p=>p.id==='n1').gender = 'Woman'; L.find(p=>p.id==='n2').gender = 'Man'; L.find(p=>p.id==='n3').gender = 'Woman';
  L.push({ id:'n4', name:'Gil Gray', gender:'Man' }, { id:'n5', name:'Hana Hart', gender:'Woman' }, { id:'n6', name:'Ivo Ink', gender:'Man' }, { id:'n7', name:'Jo Jay' });
  bnode().npcs.push('n4', 'n5', 'n6', 'n7'); renderBattle(); renderBattlePanel(); await wait(60);
  const put = { 'p:n1':[2,2], 'p:n2':[3,2], 'p:n3':[9,4], 'p:n4':[8,4], 'p:n5':[5,5], 'p:n6':[2,5], 'p:n7':[10,2] };
  for(const [id, [x, y]] of Object.entries(put)) c.pos[id] = { x, y };
  const gw = id => ({ n1:'W', n2:'M', n3:'W', n4:'M', n5:'W', n6:'M', n7:'?' })[id.slice(2)];
  const show = () => (c.dance||[]).map(p=>p.map(gw).join('+')).join(', ');
  const sel = document.querySelector('#pane-inspect [data-dancepair]'); sel.value = 'mw'; sel.dispatchEvent(new Event('change', { bubbles:true }));
  document.querySelector('#pane-inspect [data-dance="all"]').click(); await wait(80);
  const ivo = c.pos['p:n6'], hana = c.pos['p:n5'];
  out.push('a man and a woman: ' + show() + ', remembered ' + dancePair + ', Ivo stepped beside Hana ' + (Math.max(Math.abs(ivo.x-hana.x), Math.abs(ivo.y-hana.y)) <= 1) + ' (was 3 squares away)');
  document.querySelector('#pane-inspect [data-dance="stop"]').click(); await wait(40);
  const sel2 = document.querySelector('#pane-inspect [data-dancepair]'); sel2.value = 'same'; sel2.dispatchEvent(new Event('change', { bubbles:true }));
  document.querySelector('#pane-inspect [data-dance="all"]').click(); await wait(80);
  out.push('same gender: ' + show() + ', every couple matches or has an unknown ' + (c.dance||[]).every(p=>p.length<2 || gw(p[0])===gw(p[1]) || gw(p[0])==='?' || gw(p[1])==='?'));
  dancePair = 'any'; try{ localStorage.removeItem('ordinate-dancepair'); }catch(err){}
 }catch(e){ out.push('ERR ' + e.message + ' ' + (e.stack||'').split('\n')[1]); }
 document.title = 'RES ' + out.join(' || ');
}, 900);
</script>
