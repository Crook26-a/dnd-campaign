// uses: nothing
<script>
/* a room's name off the players' screen until the party has been in (n.nameHidden, root.visited), and battle-map
   labels kept as the DM's own ([x, y, text, "dm"]) */
const __NM = { format:"ordinate-survey-v1", title:"Names Test", ppm:10, unit:"mi", party:2,
  nodes:[{ id:"h", name:"Test Hall", kind:"town", x:0, y:0 }], roads:[], shapes:[],
  roster:[{ id:"pa", name:"Anna Ash", level:5, hp:"30", hpMax:"30" }, { id:"pb", name:"Bram Birch", level:5, hp:"30", hpMax:"30" }],
  library:{ foes:[], loot:[], npcs:[{ id:"n1", name:"Wanda Vale", role:"guest" }, { id:"n2", name:"Xavier Yule", role:"guest", known:true }] },
  groups:[{ id:"g1", members:["pa","pb"], at:{ map:"h", node:"front" } }],
  plans:{ h:{ format:"ordinate-plan-v1", of:"h", title:"Test Hall", ppm:5, unit:"yd", roads:[], shapes:[], nodes:[
    { id:"front", name:"The Front Room", kind:"hall", x:100, y:100, w:12, d:8, nameHidden:true, npcs:["n1","n2"], bmap:{ name:"The Front Room",
      rows:["##########","#i......i#","#........D","#i......i#","##########"], labels:[[2,1,"a dusty rug"],[8,2,"the secret study","dm"]],
      start:{ party:[[2,2],[3,2]], enemy:[] }, exits:[{ x:9, y:2, to:"study", at:[1,2] }] } },
    { id:"study", name:"The Secret Study", kind:"archive", x:170, y:100, w:10, d:8, nameHidden:true, bmap:{ name:"The Secret Study",
      rows:["########","D......#","D......#","########"], start:{ party:[[1,1]], enemy:[] }, exits:[{ x:0, y:1, to:"front", at:[8,2] }] } },
    { id:"shed", name:"The Plain Shed", kind:"house", x:100, y:180, w:8, d:6 } ] } } };
setTimeout(async ()=>{ const wait = ms => new Promise(r=>setTimeout(r, ms)); const out=[]; const txt = el => el ? el.innerText.replace(/\s+/g,' ').trim() : 'none';
 const tvNames = () => ['The Front Room', 'The Secret Study', 'The Plain Shed'].filter(s=>(playerMapScene().svg||'').includes(s)).join(', ') || 'none';
 const sqClient = (x, y) => { const r = document.getElementById('bsvg').getBoundingClientRect(), b = bview, s = Math.max(b.w/r.width, b.h/r.height);
   return { clientX: r.left + (r.width - b.w/s)/2 + ((x+.5)*BS - b.x)/s, clientY: r.top + (r.height - b.h/s)/2 + ((y+.5)*BS - b.y)/s }; };
 const drag = async (tokId, x, y, shift) => { const t = document.querySelector(`#bsvg [data-tok="${tokId}"]`); if(!t) throw new Error('no token ' + tokId);
   const p0 = bnode().site.combat.pos[tokId], a = sqClient(p0.x, p0.y), b = sqClient(x, y), o = { bubbles:true, pointerId:1, button:0, shiftKey:!!shift };
   t.dispatchEvent(new PointerEvent('pointerdown', { ...o, ...a })); await wait(10);
   document.getElementById('bsvg').dispatchEvent(new PointerEvent('pointermove', { ...o, clientX:(a.clientX+b.clientX)/2, clientY:(a.clientY+b.clientY)/2 })); await wait(10);
   document.getElementById('bsvg').dispatchEvent(new PointerEvent('pointermove', { ...o, ...b })); await wait(10);
   document.getElementById('bsvg').dispatchEvent(new PointerEvent('pointerup', { ...o, ...b })); await wait(80); };
 try{
  loadJSONNow(JSON.stringify(__NM)); await wait(300); setDmMode(true); await wait(50);
  enterPlan('h'); await wait(80); markVisits();
  out.push('on the plan, party in the front room: TV names ' + tvNames());
  openBattle(doc.nodes.find(x=>x.id==='front')); await wait(100);
  const sc = playerMapScene(), dmSvg = document.getElementById('bsvg').innerHTML;
  out.push('front room map: TV has "a dusty rug" ' + (sc.svg||'').includes('a dusty rug') + ', TV has the dm label ' + (sc.svg||'').includes('the secret study') + ', DM sees it ' + dmSvg.includes('the secret study'));
  const sc2 = playerMapScene().svg || "", dmEyes = (document.getElementById("bsvg").innerHTML.match(/👁/g)||[]).length;
  out.push("people the party knows: TV names Xavier " + />Xavier Yule</.test(sc2) + ", Wanda " + />Wanda Vale</.test(sc2) + ", eyes on the DM map " + dmEyes);
  battleSel = "p:n1"; renderBattlePanel(); await wait(30); const tick = document.querySelector("#pane-inspect [data-known=\"n1\"]");
  out.push("Wanda's card has the tick " + !!tick); tick.click(); await wait(60);
  out.push("ticked: Wanda known " + !!libNpcById("n1").known + ", TV names Wanda " + />Wanda Vale</.test(playerMapScene().svg||""));
  battleSel = null; renderBattlePanel();
  await drag('pa', 9, 2, true); await wait(100); closeBattle(true); await wait(60); markVisits();
  out.push('after walking in: TV names ' + tvNames() + ', visited ' + Object.keys(root.visited||{}).sort().join(','));
  /* the panel: untick "They've been in", then the name setting itself */
  select('node', 'study'); renderPane(true); await wait(40);
  const seen = document.querySelector('#pane-inspect [data-pshide="seen"]'); out.push('panel shows the boxes: ' + !!document.querySelector('#pane-inspect [data-pshide="name"]') + ' ' + !!seen);
  if(seen){ delete root.groups; root.groups = [{ id:'g1', members:['pa','pb'], at:{ map:'h', node:'shed' } }]; seen.click(); await wait(40); out.push('untick been-in (party in the shed): TV names ' + tvNames()); }
  const nm = document.querySelector('#pane-inspect [data-pshide="name"]'); nm.click(); await wait(40);
  out.push('name not hidden any more: ' + !doc.nodes.find(x=>x.id==='study').nameHidden + ', TV names ' + tvNames());
 }catch(e){ out.push('ERR ' + e.message + ' ' + (e.stack||'').split('\n')[1]); }
 document.title = 'RES ' + out.join(' || ');
}, 900);
</script>
