<script>
/* the action, one a turn, and Action Surge (Joseph, 2026-10-30: "also need action surge"): a second action asks first,
   Action Surge gives one more, bonus actions and reactions don't count, it clears when their turn comes round */
const __AS = { format:"ordinate-survey-v1", title:"Action Surge", ppm:10, unit:"mi", party:2,
  nodes:[{ id:"h", name:"Test House", kind:"town", x:0, y:0 }], roads:[], shapes:[],
  roster:[{ id:"pa", name:"Gawain", cls:"Fighter", level:5, hp:"40", hpMax:"53", ac:"17", attacks:[{ name:"Greatsword", hit:"+8", dmg:"2d6+5", dtype:"slashing" }, { name:"Dagger (off-hand, bonus action)", hit:"+8", dmg:"1d4", dtype:"piercing" }],
      res:[{ id:"rs_as", name:"Action Surge", max:1, used:0, rest:"short" }] },
    { id:"pb", name:"Wren", cls:"Cleric", level:5, hp:"28", hpMax:"28", ac:"12", attacks:[] }],
  groups:[{ id:"g1", members:["pa","pb"], at:{ map:"h", node:"hall" } }], library:{ npcs:[], foes:[], encounters:[], shops:[], loot:[] },
  plans:{ h:{ format:"ordinate-plan-v1", of:"h", title:"Test House", ppm:5, unit:"yd", roads:[], shapes:[], nodes:[
    { id:"hall", name:"The Hall", kind:"hall", x:100, y:100, w:10, d:8, site:{ kind:"", level:5, once:true, waves:1, loot:{ coin:0 }, items:[], light:"bright", foes:[{ id:"srd:ogre", n:"1" }] },
      bmap:{ name:"The Hall", rows:["##########","#........#","#........#","#........#","##########"], start:{ party:[[1,2],[2,2]], enemy:[[6,2]] } } } ] } } };
setTimeout(async ()=>{ const wait = ms => new Promise(r=>setTimeout(r, ms)); const out = [];
 try{
  loadJSONNow(JSON.stringify(__AS)); await wait(300); setDmMode(true); await wait(60);
  enterPlan('h'); await wait(40); const hall = doc.nodes.find(n=>n.id==='hall'); openBattle(hall); await wait(150);
  const c = hall.site.combat; beginBattle(hall.site); await wait(60); const ogre = c.list[0];
  combatants(c).forEach((t, k)=>{ c.init[t.id] = 20 - k; }); c.turn = 'pa';
  let asked = []; window.confirm = q => { asked.push(q); return false; };
  const swing = async what => { act = freshAct('pa'); act.what = what; act.targets = [ogre.id]; act.outcome = 'hit'; act.dmg = '5'; const n = (c.log||[]).length; logAction(hall, c); await wait(30); return (c.log||[]).length > n ? c.log.slice(-1)[0].text : 'not logged'; };
  const mark = () => { renderBattlePanel(); const m = [...document.querySelectorAll('.rused')].map(e=>e.textContent.trim()).filter(t=>/action|attack/.test(t)).concat([...document.querySelectorAll('.actbox .actspell')].map(e=>e.textContent.trim()).filter(t=>/left this turn|more attack|no other action/.test(t))); return m.join(' / ') || 'none'; };
  out.push('attacks in an Attack action: Gawain ' + attacksPerAction(combatants(c).find(t=>t.id==='pa')) + ', Wren ' + attacksPerAction(combatants(c).find(t=>t.id==='pb')) + ', the ogre ' + attacksPerAction(combatants(c).find(t=>t.id===ogre.id)));
  out.push('swing 1: ' + await swing('pca:0') + ' · marks: ' + mark());
  out.push('the off-hand dagger (bonus action): ' + await swing('pca:1'));
  out.push('swing 2 (Extra Attack, the same action): ' + await swing('pca:0') + ' · asked: ' + (asked.splice(0).join(' | ') || 'nothing') + ' · marks: ' + mark());
  out.push('swing 3: ' + await swing('pca:0') + ' · asked: ' + asked.splice(0).join(' | '));
  out.push('Action Surge in his list: ' + [...document.querySelectorAll('#ac-what option')].some(o=>/Action Surge/.test(o.textContent)));
  { act = freshAct('pa'); act.what = 'res:rs_as'; renderBattlePanel(); await wait(20); document.querySelector('#ac-what').dispatchEvent(new Event('change', { bubbles:true })); await wait(20);
    logAction(hall, c); await wait(30); out.push('Action Surge: "' + c.log.slice(-1)[0].text + '" · uses left ' + (root.roster[0].res[0].max - root.roster[0].res[0].used) + ' · marks: ' + mark()); }
  out.push('swing 3 after the surge: ' + await swing('pca:0') + ' · asked: ' + (asked.splice(0).join(' | ') || 'nothing') + ' · marks: ' + mark());
  out.push('swing 4: ' + await swing('pca:0') + ' · asked: ' + (asked.splice(0).join(' | ') || 'nothing'));
  out.push('swing 5: ' + await swing('pca:0') + ' · asked: ' + asked.splice(0).join(' | '));
  undoAction(c); await wait(20); out.push('undo swing 4: marks ' + mark());
  nextTurn(c); nextTurn(c); nextTurn(c); renderBattlePanel(); await wait(20); out.push('round 2, Gawain\'s turn again (' + c.turn + '): marks ' + mark());
 }catch(e){ out.push('ERR ' + e.message + ' ' + (e.stack||'').split('\n').slice(1, 3).join(' / ')); }
 out.push('page errors: ' + (window.__ERR || []).length + ((window.__ERR || []).length ? ' ' + __ERR.slice(0, 3).join(' ; ') : ''));
 document.title = 'RES ' + out.join(' || ');
}, 900);
</script>
