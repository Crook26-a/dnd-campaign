// uses: nothing
<script>
/* the concentration save over the DM's battle map (Joseph, 2026-10-30: "make the concentration pop up on the actual map
   for dm"): it pops up when it comes due, never on the TV, and goes back to the Action box when the map closes */
const __CP = { format:"ordinate-survey-v1", title:"Concentration", ppm:10, unit:"mi", party:2,
  nodes:[{ id:"h", name:"Test House", kind:"town", x:0, y:0 }], roads:[], shapes:[],
  roster:[{ id:"pa", name:"Gawain", cls:"Fighter", level:5, hp:"40", hpMax:"53", ac:"17", attacks:[] },
    { id:"pb", name:"Wren", cls:"Cleric", level:5, hp:"28", hpMax:"28", ac:"12", con:14, spells:["spell:bless"], attacks:[] }],
  groups:[{ id:"g1", members:["pa","pb"], at:{ map:"h", node:"hall" } }], library:{ npcs:[], foes:[], encounters:[], shops:[], loot:[] },
  plans:{ h:{ format:"ordinate-plan-v1", of:"h", title:"Test House", ppm:5, unit:"yd", roads:[], shapes:[], nodes:[
    { id:"hall", name:"The Hall", kind:"hall", x:100, y:100, w:10, d:8, site:{ kind:"", level:5, once:true, waves:1, loot:{ coin:0 }, items:[], light:"bright", foes:[{ id:"srd:ogre", n:"1" }] },
      bmap:{ name:"The Hall", rows:["##########","#........#","#........#","#........#","##########"], start:{ party:[[1,2],[2,2]], enemy:[[6,2]] } } } ] } } };
setTimeout(async ()=>{ const wait = ms => new Promise(r=>setTimeout(r, ms)); const out = [];
 try{
  loadJSONNow(JSON.stringify(__CP)); await wait(300); setDmMode(true); await wait(60);
  enterPlan('h'); await wait(40); const hall = doc.nodes.find(n=>n.id==='hall'); openBattle(hall); await wait(150);
  const c = hall.site.combat; beginBattle(hall.site); await wait(60); const ogre = c.list[0], W = root.roster[1];
  const pop = () => { const p = document.getElementById('bt-conc'); return p && !p.hidden ? p.textContent.replace(/\s+/g, ' ').trim() : 'no pop-up'; };
  concBegin(W, spellOf('spell:bless'), 28); out.push('Wren concentrating on ' + W.conc.name + ' · pop-up: ' + pop());
  act = freshAct(ogre.id); act.what = 'fa:Greatclub'; act.targets = ['pb']; act.outcome = 'hit'; act.dmg = '13'; logAction(hall, c); await wait(40); concSweep(); await wait(20);
  out.push('the ogre hits her for 13: pop-up: ' + pop());
  { const d = document.createElement('div'); d.innerHTML = `<svg>${renderBattle(true)}</svg>`; out.push('on the TV: ' + (/Constitution save|concask/.test(d.innerHTML) ? 'the save shows' : 'no save')); }
  renderBattle(); renderBattlePanel(); await wait(20); out.push('after the map redraws: ' + pop());
  const r0 = Math.random; Math.random = () => 0.7; document.querySelector('#bt-conc [data-concask="roll"]').click(); Math.random = r0; await wait(30);
  out.push('Roll: pop-up ' + pop() + ' · ' + gameLogList().slice(-1)[0].text);
  act = freshAct(ogre.id); act.what = 'fa:Greatclub'; act.targets = ['pb']; act.outcome = 'hit'; act.dmg = '4'; logAction(hall, c); await wait(40); concSweep(); await wait(20);
  out.push('hit again: ' + pop());
  closeBattle(); await wait(40); out.push('map closed: pop-up ' + pop() + ' · the save is in ' + ((document.getElementById('concasks')||{}).parentNode||{}).id);
 }catch(e){ out.push('ERR ' + e.message + ' ' + (e.stack||'').split('\n').slice(1, 3).join(' / ')); }
 out.push('page errors: ' + (window.__ERR || []).length + ((window.__ERR || []).length ? ' ' + __ERR.slice(0, 3).join(' ; ') : ''));
 document.title = 'RES ' + out.join(' || ');
}, 900);
</script>
